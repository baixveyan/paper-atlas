<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1220" viewBox="0 0 1400 1220" role="img" aria-labelledby="title desc"><title id="title">ARCache ｜history累计刷新与首段引导的残差外推</title><desc id="desc">依据主文 §3、Fig.2–4、式3–7；刷新与残差数字为教学算例，未测量真实视频加速。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1220" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ARCache ｜history累计刷新与首段引导的残差外推</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3、Fig.2–4、式3–7；刷新与残差数字为教学算例，未测量真实视频加速。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  两种时间：片段s依次生成，去噪t在每个片段内倒序变化</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">模型内部history特征 hₜˢ，不是固定原图</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">逻辑形状 Nh×C；当前噪声 Nx×C</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">Δ=‖hₜ−hₜ₊₁‖₁/‖hₜ₊₁‖₁</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">教学(2,2)→(2.1,2.1)，Δ=.05</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">缓存F / 残差r后，采样器仍更新latent</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">r不是“生成图−真实图”的监督误差</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">权重不变；仍保留片段间依赖</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">Nh/Nx/C、缓存层与探测成本依基座</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  缓存已初始化：δ=.10，逐步累积而不是仅看当前变化</text><rect x="52" y="425" width="405" height="131" fill="#fff" stroke="#17816c" rx="16"/><text x="70" y="457" font-size="23" fill="#17816c" font-weight="700">变化.04</text><text x="70" y="490" font-size="19" fill="#18334c" font-weight="400">累计.04 → 复用</text><text x="70" y="519" font-size="19" fill="#18334c" font-weight="400">不重算目标重块</text><path d="M457,487 L485,487" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="492" y="425" width="405" height="131" fill="#fff" stroke="#17816c" rx="16"/><text x="510" y="457" font-size="23" fill="#17816c" font-weight="700">变化.03</text><text x="510" y="490" font-size="19" fill="#18334c" font-weight="400">累计.07 → 复用</text><text x="510" y="519" font-size="19" fill="#18334c" font-weight="400">不是每步重置累计</text><path d="M897,487 L925,487" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="932" y="425" width="405" height="131" fill="#fff" stroke="#c36b24" rx="16"/><text x="950" y="457" font-size="23" fill="#c36b24" font-weight="700">变化.05</text><text x="950" y="490" font-size="19" fill="#18334c" font-weight="400">累计.12 → 刷新</text><text x="950" y="519" font-size="19" fill="#18334c" font-weight="400">保存新锚点，再重置</text><rect x="28" y="615" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  首段给标量进度，当前段两锚点给外推方向</text><rect x="53" y="675" width="610" height="152" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="707" font-size="23" fill="#2376c5" font-weight="700">首段：旧10，新12，当前13</text><text x="71" y="740" font-size="19" fill="#18334c" font-weight="400">相对距离比 (.3)/(.2)=1.5</text><text x="71" y="769" font-size="19" fill="#18334c" font-weight="400">λ=1到新锚点；λ&gt;1为外推</text><text x="71" y="798" font-size="19" fill="#18334c" font-weight="400">仅在L1rel按相同旧锚点归一的教学约定下</text><rect x="714" y="675" width="621" height="152" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="707" font-size="23" fill="#17816c" font-weight="700">当前段：旧20，新23</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">预测 = 20 + 1.5×(23−20)=24.5</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">不是把首段13直接复制成当前残差</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">张量各元素共享该进度标量</text><path d="M663,750 L707,750" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="890" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="924" font-size="24" fill="#18334c" font-weight="700">04  距离比会丢方向：首段折返到7也给相同λ=1.5</text><rect x="53" y="950" width="610" height="175" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="982" font-size="23" fill="#c36b24" font-weight="700">|13−10| = |7−10| = 3</text><text x="71" y="1015" font-size="19" fill="#18334c" font-weight="400">首段实际可能继续前进，也可能反向</text><text x="71" y="1044" font-size="19" fill="#18334c" font-weight="400">λ相同，当前段仍沿23−20方向外推</text><text x="71" y="1073" font-size="19" fill="#18334c" font-weight="400">曲率/内容突变会破坏跨段轨迹相似</text><text x="71" y="1102" font-size="19" fill="#18334c" font-weight="400">分母接近0、缺失时间点需实现核验</text><rect x="714" y="950" width="621" height="175" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="982" font-size="23" fill="#7750ad" font-weight="700">首段没有前段误差，不是外部干净真值</text><text x="732" y="1015" font-size="19" fill="#18334c" font-weight="400">首段缓存时如何取得完整参考尚未明确</text><text x="732" y="1044" font-size="19" fill="#18334c" font-weight="400">ERC冷启动至少依赖两个有效锚点</text><text x="732" y="1073" font-size="19" fill="#18334c" font-weight="400">缓存F减少重块，不代表T/m端到端加速</text><text x="732" y="1102" font-size="19" fill="#18334c" font-weight="400">未运行模型、权重或视频生成</text><text x="36" y="1197" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>