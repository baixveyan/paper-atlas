<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">ET3 ｜能量梯度、固定中心投影与条件理论保证</title><desc id="desc">依据主文 §3–4、Fig.2与Theorem4.1；标量模型和投影为独立教学例，非真实模型认证。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ET3 ｜能量梯度、固定中心投影与条件理论保证</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3–4、Fig.2与Theorem4.1；标量模型和投影为独立教学例，非真实模型认证。</text><rect x="28" y="115" width="1344" height="240" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  冻结网络权重，只更新当前图像；代理能量不是下游回答损失</text><rect x="52" y="176" width="375" height="143" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="208" font-size="23" fill="#2376c5" font-weight="700">图像 → CLIP / 分类器</text><text x="70" y="241" font-size="19" fill="#18334c" font-weight="400">图像1×D，代理文本K×D</text><text x="70" y="270" font-size="19" fill="#18334c" font-weight="400">相似度1×K作为logits</text><text x="70" y="299" font-size="19" fill="#18334c" font-weight="400">可缓存文本，不可省像素梯度</text><rect x="484" y="176" width="390" height="143" fill="#fff" stroke="#7750ad" rx="16"/><text x="502" y="208" font-size="23" fill="#7750ad" font-weight="700">负LogSumExp能量</text><text x="502" y="241" font-size="19" fill="#18334c" font-weight="400">E=−logΣexp(fk)</text><text x="502" y="270" font-size="19" fill="#18334c" font-weight="400">−∇E=Σ softmax(f)k ∇fk</text><text x="502" y="299" font-size="19" fill="#18334c" font-weight="400">加权各类方向，不自动选真类</text><rect x="932" y="176" width="405" height="143" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="208" font-size="23" fill="#17816c" font-weight="700">图像下降 + L2投影</text><text x="950" y="241" font-size="19" fill="#18334c" font-weight="400">球心固定为收到的输入x</text><text x="950" y="270" font-size="19" fill="#18334c" font-weight="400">T步后再送分类/VQA/描述</text><text x="950" y="299" font-size="19" fill="#18334c" font-weight="400">模型冻结 ≠ 禁用输入反向</text><path d="M427,247 L477,247" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,247 L925,247" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="380" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="414" font-size="24" fill="#18334c" font-weight="700">02  L2投影算例：δ=(3,4)、ε=2 → δ投影=(1.2,1.6)</text><circle cx="240" cy="540" r="50" fill="#fff" stroke="#2376c5" stroke-width="2"/><circle cx="240" cy="540" r="5" fill="#2376c5"/><text x="182" y="571" font-size="19" fill="#2376c5" font-weight="400">球心原x</text><path d="M240,540 L270,500" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><path d="M270,500 L315,440" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" stroke-dasharray="9 6"/><circle cx="270" cy="500" r="6" fill="#17816c"/><text x="280" y="514" font-size="19" fill="#17816c" font-weight="400">范数2</text><text x="327" y="450" font-size="19" fill="#c36b24" font-weight="400">候选范数5</text><rect x="714" y="440" width="621" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="472" font-size="23" fill="#2376c5" font-weight="700">δ ← δ·min(1, ε/‖δ‖₂)</text><text x="732" y="505" font-size="19" fill="#18334c" font-weight="400">逐坐标clip到±2不是同一种L2投影</text><text x="732" y="534" font-size="19" fill="#18334c" font-weight="400">不能每轮改球心后累积越界</text><text x="732" y="563" font-size="19" fill="#18334c" font-weight="400">攻击L∞4/255与防御L2的4或5不可直接比</text><rect x="28" y="655" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  低能量仍可能更错：局部线性反例也会违背定理条件</text><rect x="53" y="715" width="610" height="131" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="747" font-size="23" fill="#c36b24" font-weight="700">真类 fy=x，错误类 fo=2x+1</text><text x="71" y="780" font-size="19" fill="#18334c" font-weight="400">x=0，softmax≈(.26894,.73106)</text><text x="71" y="809" font-size="19" fill="#18334c" font-weight="400">η=.1 → 能量下降方向 z≈.17311</text><text x="71" y="838" font-size="19" fill="#18334c" font-weight="400">真类margin：−1 → −1.51932</text><rect x="714" y="715" width="621" height="131" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="747" font-size="23" fill="#7750ad" font-weight="700">能量下降不是分类正确性证明</text><text x="732" y="780" font-size="19" fill="#18334c" font-weight="400">共同给logits加b：预测不变，E减b</text><text x="732" y="809" font-size="19" fill="#18334c" font-weight="400">要看真类margin与梯度优势</text><text x="732" y="838" font-size="19" fill="#18334c" font-weight="400">不能只把净化图的能量低当安全</text><rect x="28" y="910" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="944" font-size="24" fill="#18334c" font-weight="700">04  Theorem4.1的有条件例子，不是21K代理或自由文本的认证</text><rect x="53" y="970" width="610" height="169" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="1002" font-size="23" fill="#17816c" font-weight="700">fy=2x−.2，fo=.1x，x=0</text><text x="71" y="1035" font-size="19" fill="#18334c" font-weight="400">全局线性，原margin=−.2</text><text x="71" y="1064" font-size="19" fill="#18334c" font-weight="400">ε=.4 &gt; .2；选择C=3 &gt; 2.44281</text><text x="71" y="1093" font-size="19" fill="#18334c" font-weight="400">C‖ehgh‖ &lt; ‖eygy‖；按定理α做一步</text><text x="71" y="1122" font-size="19" fill="#18334c" font-weight="400">可核算预算内且新margin&gt;0</text><rect x="714" y="970" width="621" height="169" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="1002" font-size="23" fill="#2376c5" font-weight="700">保证必须保留前提</text><text x="732" y="1035" font-size="19" fill="#18334c" font-weight="400">二分类、邻域局部线性、真类梯度优势</text><text x="732" y="1064" font-size="19" fill="#18334c" font-weight="400">特定预算与步长；真标签用于条件</text><text x="732" y="1093" font-size="19" fill="#18334c" font-weight="400">不能逐样本无标签确认所有假设</text><text x="732" y="1122" font-size="19" fill="#18334c" font-weight="400">未运行攻击/净化模型或加载权重</text><text x="64" y="1171" font-size="20" fill="#18334c" font-weight="700">默认实验T=2；本文定理示例T=1。自适应攻击与不知道防御的攻击必须分开报告。</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>