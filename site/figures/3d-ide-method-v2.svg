<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">3D-IDE ｜共享token、置信权重与深度warp</title><desc id="desc">依据PDF4–6 Fig.3、式4–9；置信/坐标/内存为教学例，非深度或问答模型实测。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">3D-IDE ｜共享token、置信权重与深度warp</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF4–6 Fig.3、式4–9；置信/坐标/内存为教学例，非深度或问答模型实测。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  RGB → 可微调SigLIP共享F；语言回答与几何训练读同一token</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">F=M×C，F3D≡F是共享设计，不是xyz数组</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">projector→Qwen2-7B，标准答案CE</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">弱DPT从零训练 → depth + 正权重Σ</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">GT深度/已知pose/VGGT仅训练使用</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="207" font-size="23" fill="#17816c" font-weight="700">三条辅助路径把压力传到视觉encoder</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">depth/gradient → validator → F</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">相邻depth warp → validator → F</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">全局cos → 学生descriptor/projection → F</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  固定残差r&gt;0，像素项ℓ(Σ)=Σr−αlogΣ；最优Σ*=α/r</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="457" font-size="23" fill="#7750ad" font-weight="700">教学α=.1：r=.5 → Σ*=.2</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">r=.05 → Σ*=2，残差小反而权重大</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">按公式更像置信权重，不按方差反向理解</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">正值activation/范围/clamp主文没给全</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">r0且Σ无上界：形式项−αlogΣ无有限最低</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">这是数学边界，不声称实际代码发散</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">梯度残差是空间深度边缘，不是时间差</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">valid depth及相邻梯度mask需一并检查</text><rect x="28" y="615" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  warp须转换深度：源反投影 → 相对pose → 目标投影与目标z</text><rect x="53" y="675" width="610" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="707" font-size="23" fill="#2376c5" font-weight="700">教学源X′=(0,0,2)，R=I，T=(0,0,1)</text><text x="71" y="740" font-size="19" fill="#18334c" font-weight="400">目标X=(0,0,3)，目标深度应为3</text><text x="71" y="769" font-size="19" fill="#18334c" font-weight="400">Dt预测3 → 残差0；原样搬源2会误罚1</text><text x="71" y="798" font-size="19" fill="#18334c" font-weight="400">不是普通图像warp后保留原深度数值</text><text x="71" y="827" font-size="19" fill="#18334c" font-weight="400">出界/遮挡/zbuffer/动态物体规则正文未全给</text><rect x="714" y="675" width="621" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="707" font-size="23" fill="#17816c" font-weight="700">全局teacher指导不是逐像素真值</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">cos教学(1,0) vs (.8,.6) → loss.2</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">(1,0) vs (2,0) → loss0，不限制模长</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">聚合/投影与teacher特征层需源码核验</text><text x="732" y="827" font-size="19" fill="#18334c" font-weight="400">预测一致仍可共同错误，GT项不可替代</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  部署删validator/global teacher；RGB视觉+语言主干保留</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="987" font-size="23" fill="#7750ad" font-weight="700">弱head策略是优化设计，不是信息论定理</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">SigLIP明确微调，不能只训练depth head</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">训练需要GT深度与pose，不是无几何监督</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">相邻抽样约NHW，不做全部N²对</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">32×224²×2 float32≈12.25MiB单套图</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="987" font-size="23" fill="#c36b24" font-weight="700">无辅助推理开销≠整体推理零耗时</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">mask/warp/teacher/激活训练内存另计</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">ScanNet静态室内不覆盖任意动态场景</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">独立验算置信/深度变换/cos/内存</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未运行视觉/几何/语言模型或训练</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>