<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">A4VL ｜检索帧预算、互评列和与有限剪枝循环</title><desc id="desc">依据PDF3–6 Fig.2–4、式1–12；矩阵/得分/帧计数是教学例，非代理实测日志。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">A4VL ｜检索帧预算、互评列和与有限剪枝循环</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–6 Fig.2–4、式1–12；矩阵/得分/帧计数是教学例，非代理实测日志。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  可选任务级选队 → 每题首轮各4帧提线索 → 新线索检索视频块</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">teaming分数是群体同答频率，不是准确率</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">教学4模型2题：[A,A,B,C] / [B,A,B,C]</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">平均分[.5,.375,.375,.25] → 选前3</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">模型权重固定，只更新线索/答案/成员集合</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="207" font-size="23" fill="#17816c" font-weight="700">每agent每轮16帧，非全系统16帧</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">事件边界DINOv2+像素线索，细节在附录</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">CLIP线索-块分数，ρ=.8不是80%概率</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">后轮直接检索，不重复4帧初看</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  教学块得分[.90,.85,.40]：只保留前两块，softmax分预算</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="457" font-size="23" fill="#7750ad" font-weight="700">π≈[.512497,.487503]，×16后floor</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">得到[8,7]，余1随机分给某块</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">可能[9,7]或[8,8]，不是最大余数法</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">全低于阈值时：只在最高分块取全部16帧</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">当前取证 → 答案与理由 → full consensus</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">[A,A,B]继续；[A,A,A]直接汇总</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">共同选错也会停；选项一致不等于真相</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">重检索才带来新证据，不只是文本辩论</text><rect x="28" y="615" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  不一致才互评：行=评分者，列=被评者；按列求和剪枝</text><text x="210" y="685" font-size="19" fill="#2376c5" font-weight="700">被评A</text><text x="320" y="685" font-size="19" fill="#2376c5" font-weight="700">被评B</text><text x="430" y="685" font-size="19" fill="#2376c5" font-weight="700">被评C</text><text x="80" y="729" font-size="19" fill="#18334c" font-weight="400">评分A</text><rect x="195" y="702" width="94" height="40" fill="#eaf3fb" stroke="#cedee9" rx="6"/><text x="235" y="729" font-size="22" fill="#18334c" font-weight="400">8</text><rect x="305" y="702" width="94" height="40" fill="#fff0e5" stroke="#cedee9" rx="6"/><text x="345" y="729" font-size="22" fill="#c36b24" font-weight="400">5</text><rect x="415" y="702" width="94" height="40" fill="#eaf3fb" stroke="#cedee9" rx="6"/><text x="455" y="729" font-size="22" fill="#18334c" font-weight="400">6</text><text x="80" y="776" font-size="19" fill="#18334c" font-weight="400">评分B</text><rect x="195" y="749" width="94" height="40" fill="#eaf3fb" stroke="#cedee9" rx="6"/><text x="235" y="776" font-size="22" fill="#18334c" font-weight="400">7</text><rect x="305" y="749" width="94" height="40" fill="#fff0e5" stroke="#cedee9" rx="6"/><text x="345" y="776" font-size="22" fill="#c36b24" font-weight="400">6</text><rect x="415" y="749" width="94" height="40" fill="#eaf3fb" stroke="#cedee9" rx="6"/><text x="455" y="776" font-size="22" fill="#18334c" font-weight="400">5</text><text x="80" y="823" font-size="19" fill="#18334c" font-weight="400">评分C</text><rect x="195" y="796" width="94" height="40" fill="#eaf3fb" stroke="#cedee9" rx="6"/><text x="235" y="823" font-size="22" fill="#18334c" font-weight="400">9</text><rect x="305" y="796" width="94" height="40" fill="#fff0e5" stroke="#cedee9" rx="6"/><text x="345" y="823" font-size="22" fill="#c36b24" font-weight="400">4</text><rect x="415" y="796" width="94" height="40" fill="#eaf3fb" stroke="#cedee9" rx="6"/><text x="455" y="823" font-size="22" fill="#18334c" font-weight="400">7</text><text x="80" y="878" font-size="20" fill="#18334c" font-weight="400">列和：</text><text x="230" y="878" font-size="22" fill="#18334c" font-weight="400">24</text><text x="340" y="878" font-size="22" fill="#c36b24" font-weight="700">15</text><text x="450" y="878" font-size="22" fill="#18334c" font-weight="400">18</text><rect x="714" y="675" width="621" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="707" font-size="23" fill="#2376c5" font-weight="700">B最低 → 剩余A/C修订线索再取证</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">评分包含自评，非校准正确率</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">式8输入答案/理由，不保证重看全体证据</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">并列最低/无效答案处理正文未展开</text><text x="732" y="827" font-size="19" fill="#18334c" font-weight="400">最多3人→2人→1人，末轮单人自动一致</text><rect x="28" y="925" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="959" font-size="24" fill="#18334c" font-weight="700">04  固定模型、有限轮次；保留每轮证据与累计成本</text><rect x="53" y="985" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="1017" font-size="23" fill="#17816c" font-weight="700">最坏帧呈现：16×(3+2+1)+4×3=108</text><text x="71" y="1050" font-size="19" fill="#18334c" font-weight="400">是呈现次数，不是108张不同原帧</text><text x="71" y="1079" font-size="19" fill="#18334c" font-weight="400">互评3²+2²=13个分数，不是13次API调用</text><text x="71" y="1108" font-size="19" fill="#18334c" font-weight="400">输出summary还需模型与上下文开销</text><text x="71" y="1137" font-size="19" fill="#18334c" font-weight="400">离线选队和六H200成本不可省略</text><rect x="714" y="985" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="1017" font-size="23" fill="#7750ad" font-weight="700">共识可能来自正确取证，也可能共同偏见</text><text x="732" y="1050" font-size="19" fill="#18334c" font-weight="400">高分理由不证明有视觉证据</text><text x="732" y="1079" font-size="19" fill="#18334c" font-weight="400">淘汰可降低成本，也可能丢互补模型</text><text x="732" y="1108" font-size="19" fill="#18334c" font-weight="400">未部署代理、调用API或运行视频推理</text><text x="732" y="1137" font-size="19" fill="#18334c" font-weight="400">仅验算频率/分配/列和/轮数</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>