<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">Act2See ｜双轮视觉调用、观测与假设、监督边界</title><desc id="desc">依据主文 §2–3、Fig.1、Algorithm1与式1；采样与loss数字为教学例，非问答实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1230" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">Act2See ｜双轮视觉调用、观测与假设、监督边界</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §2–3、Fig.1、Algorithm1与式1；采样与loss数字为教学例，非问答实验。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  初始1fps上下文 ≠ 完整视频：工具另外搜索3fps候选</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">教学10秒、左闭右开采样</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">初始10帧 → VLM写查询或直接回答</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">检索30个候选时刻 → 定位后取中间帧</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">实际端点与每帧token数未完整给出</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">第一轮在调用结束标签暂停</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">原视频 + 问题Q + 选项A + 推理前缀</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">模型输出调用文本；外部运行器执行</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">没有调用则保留纯文本轨迹</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  两条分支均只插一张图，证据来源与工具成本不同</text><rect x="53" y="425" width="610" height="170" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="457" font-size="23" fill="#2376c5" font-weight="700">retrieve：查询qr → TFVTG → 观测帧</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">BLIP-2支持查询相关事件定位</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">检索更密的原视频，不保证找到事实</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">返回图是原视频观测；保留来源时刻</text><text x="71" y="577" font-size="19" fill="#18334c" font-weight="400">原文没有自动失败转生成的回退</text><rect x="714" y="425" width="621" height="170" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">generate：qg → 检索条件帧 → SD3.5</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">一次检索 + 一次图像生成，不是等成本</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">生成图只表示假设，不能证明事件发生</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">Algorithm1第15行qr未定义，需核查实现</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">画错豆子位置会让后续推理受误导</text><rect x="28" y="645" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  原输入 + 第一轮前缀 + 新图 → 第二轮继续至答案结束</text><rect x="53" y="705" width="610" height="134" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="737" font-size="23" fill="#17816c" font-weight="700">不是独立重答、投票或无限工具循环</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">第一轮停止点以后的续写不保留</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">第二轮没有再进入工具分派逻辑</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">VLM编码新图后利用其内容续写</text><rect x="714" y="705" width="621" height="134" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="737" font-size="23" fill="#7750ad" font-weight="700">延迟取决于实际分支</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">两轮语言生成 + 检索 / 可选SD采样</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">返回图只有一张 ≠ 只处理一张图</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">工具失败、KV复用与超时策略未详述</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  SFT教调用文本；图片无文本输出标签，但影响之后的答案</text><rect x="53" y="955" width="610" height="173" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="987" font-size="23" fill="#2376c5" font-weight="700">3373轨迹：1608带图 / 1765纯文本</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">带图：1026检索 + 582生成 = 47.67%</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">Gemini教师先生成，人工CoT后验过滤</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">语义相似&gt;80%不是逐事实正确率</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">LoRA训Qwen；不是强化学习</text><rect x="714" y="955" width="621" height="173" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="987" font-size="23" fill="#17816c" font-weight="700">两token教学：p(query)=.2，p(ans)=.8</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">NLL = −ln .2 −ln .8 ≈ 1.83258</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">查询与答案均监督，图像本身不算文本NLL</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">图像改变后续条件概率，不是没有作用</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未调用教师/生成器，未训练或跑问答</text><text x="36" y="1207" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>