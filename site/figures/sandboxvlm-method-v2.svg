<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">SandboxVLM ｜从像素代理到可供 VLM 阅读的三维盒</title><desc id="desc">依据正文 §3、Fig.2–3，PDF3–5；坐标与投票数字为教学例，未运行生成或重建。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">SandboxVLM ｜从像素代理到可供 VLM 阅读的三维盒</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据正文 §3、Fig.2–3，PDF3–5；坐标与投票数字为教学例，未运行生成或重建。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  问题相关的假想探索 → 30 个内部像素代理 / 物体 / 视图</text><rect x="52" y="177" width="375" height="143" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="209" font-size="23" fill="#2376c5" font-weight="700">VLM 选抽象方向</text><text x="70" y="242" font-size="19" fill="#18334c" font-weight="400">左 / 前左 / 前 / 前右 / 右</text><text x="70" y="271" font-size="19" fill="#18334c" font-weight="400">SEVA 生成 M 条、每条 T 帧</text><text x="70" y="300" font-size="19" fill="#18334c" font-weight="400">生成帧属于先验，不是新实拍</text><rect x="484" y="177" width="390" height="143" fill="#fff" stroke="#c36b24" rx="16"/><text x="502" y="209" font-size="23" fill="#c36b24" font-weight="700">物体类别 + 点 → mask</text><text x="502" y="242" font-size="19" fill="#18334c" font-weight="400">腐蚀边界，减弱深度噪声</text><text x="502" y="271" font-size="19" fill="#18334c" font-weight="400">在二维内部像素 FPS 采 30 点</text><text x="502" y="300" font-size="19" fill="#18334c" font-weight="400">小物体 / 空mask需另行处理</text><rect x="932" y="177" width="405" height="143" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="209" font-size="23" fill="#17816c" font-weight="700">VGGT 深度与相机</text><text x="950" y="242" font-size="19" fill="#18334c" font-weight="400">每点反投影到统一坐标</text><text x="950" y="271" font-size="19" fill="#18334c" font-weight="400">30×2 像素 → 30×3 代理</text><text x="950" y="300" font-size="19" fill="#18334c" font-weight="400">尺度影响 δ 与后退2m</text><path d="M427,249 L477,249" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,249 L925,249" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="385" width="1344" height="210" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  坐标例：外参是 world-to-camera 时必须用逆变换</text><rect x="53" y="443" width="610" height="116" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="475" font-size="23" fill="#2376c5" font-weight="700">fx=fy=100，cx=cy=50</text><text x="71" y="508" font-size="19" fill="#18334c" font-weight="400">像素 (60,50)、z深度2 → xc=(.2,0,2)</text><text x="71" y="537" font-size="19" fill="#18334c" font-weight="400">R=I，t=(1,0,0) → xw=(−.8,0,2)</text><rect x="714" y="443" width="621" height="116" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="475" font-size="23" fill="#7750ad" font-weight="700">xc = R xw + t</text><text x="732" y="508" font-size="19" fill="#18334c" font-weight="400">xw = Rᵀ(xc − t)，不是直接加 t</text><text x="732" y="537" font-size="19" fill="#18334c" font-weight="400">仅教学坐标约定，未核验作者文件格式</text><rect x="28" y="620" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="654" font-size="24" fill="#18334c" font-weight="700">03  跨视图投票：一个视图最多一票，不按邻点个数刷票</text><rect x="60" y="680" width="245" height="122" fill="#fff" stroke="#17816c" rx="16"/><text x="78" y="712" font-size="23" fill="#17816c" font-weight="700">其他视图 1</text><text x="78" y="745" font-size="19" fill="#18334c" font-weight="400">最近同类距离 .04</text><text x="78" y="774" font-size="19" fill="#18334c" font-weight="400">1 票</text><rect x="345" y="680" width="245" height="122" fill="#fff" stroke="#17816c" rx="16"/><text x="363" y="712" font-size="23" fill="#17816c" font-weight="700">其他视图 2</text><text x="363" y="745" font-size="19" fill="#18334c" font-weight="400">最近同类距离 .08</text><text x="363" y="774" font-size="19" fill="#18334c" font-weight="400">1 票</text><rect x="630" y="680" width="245" height="122" fill="#fff" stroke="#c36b24" rx="16"/><text x="648" y="712" font-size="23" fill="#c36b24" font-weight="700">其他视图 3</text><text x="648" y="745" font-size="19" fill="#18334c" font-weight="400">最近同类距离 .30</text><text x="648" y="774" font-size="19" fill="#18334c" font-weight="400">0 票</text><rect x="936" y="680" width="400" height="122" fill="#fff" stroke="#7750ad" rx="16"/><text x="954" y="712" font-size="23" fill="#7750ad" font-weight="700">教学 δ=.1、N=2</text><text x="954" y="745" font-size="19" fill="#18334c" font-weight="400">两票达到阈值 → 保留</text><text x="954" y="774" font-size="19" fill="#18334c" font-weight="400">原式 v≠v₀ 的索引歧义仍保留</text><text x="64" y="838" font-size="21" fill="#18334c" font-weight="700">多张合成图可共享同一幻觉；一致性过滤不等于外部真值验证。</text><rect x="28" y="890" width="1344" height="300" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="924" font-size="24" fill="#18334c" font-weight="700">04  按类别聚类 → PCA有向盒 → 俯视与后退图，原图同时保留</text><rect x="52" y="949" width="375" height="188" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="981" font-size="23" fill="#2376c5" font-weight="700">DBSCAN 分同类实例</text><text x="70" y="1014" font-size="19" fill="#18334c" font-weight="400">对象太近可能合并、遮断可能拆分</text><text x="70" y="1043" font-size="19" fill="#18334c" font-weight="400">PCA轴 Q；局部 r=Qᵀ(p−μ)</text><text x="70" y="1072" font-size="19" fill="#18334c" font-weight="400">局部尺寸 = max − min</text><text x="70" y="1101" font-size="19" fill="#18334c" font-weight="400">中心 = μ + Q(min+max)/2</text><rect x="484" y="949" width="390" height="188" fill="#fff" stroke="#c36b24" rx="16"/><text x="502" y="981" font-size="23" fill="#c36b24" font-weight="700">局部极值教学例</text><text x="502" y="1014" font-size="19" fill="#18334c" font-weight="400">x:[−1,3]，y:[−.5,.5]</text><text x="502" y="1043" font-size="19" fill="#18334c" font-weight="400">z:[−.2,.2] → 尺寸(4,1,.4)</text><text x="502" y="1072" font-size="19" fill="#18334c" font-weight="400">局部中心(1,0,0)，不一定是μ</text><text x="502" y="1101" font-size="19" fill="#18334c" font-weight="400">对称 / 平面簇朝向可能不稳</text><rect x="932" y="949" width="405" height="188" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="981" font-size="23" fill="#17816c" font-weight="700">渲染盒 + 原图 + 问题</text><text x="950" y="1014" font-size="19" fill="#18334c" font-weight="400">后退2m与俯视帮助看排列</text><text x="950" y="1043" font-size="19" fill="#18334c" font-weight="400">原图补充外观，盒只留粗几何</text><text x="950" y="1072" font-size="19" fill="#18334c" font-weight="400">所有模型在推理链，无额外训练</text><text x="950" y="1101" font-size="19" fill="#18334c" font-weight="400">不包含质量 / 摩擦 / 动力学</text><path d="M427,1030 L477,1030" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,1030 L925,1030" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>