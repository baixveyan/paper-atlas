<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">AdaBet ｜激活持久环、资源归一化与冻结梯度边界</title><desc id="desc">依据主文 §3–4、Fig.4；正方形/排名/缓存均为教学例，非网络激活或硬件测量。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">AdaBet ｜激活持久环、资源归一化与冻结梯度边界</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3–4、Fig.4；正方形/排名/缓存均为教学例，非网络激活或硬件测量。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  只前向选层：样本 → 候选子层激活 → 点云 → Ripser持久环</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">逻辑卷积激活B×C×H×W</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">若每样本展平：B个CHW维点</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">batch8累计5次 → 40点，不是5个环数相加</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">展平/池化/距离/持久阈值主文未给全</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">选择单元须固定</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">含参数子层才候选，pool/reshape不排名</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">ViT的Q/K/V与输出投影合并处理</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">无标签/无反向仅指选择，后训练仍有监督</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  正方形教学：边长1、对角√2；Rips阈值是最大点间距</text><rect x="90" y="445" width="125" height="125" fill="#fff" stroke="#2376c5" rx="0"/><circle cx="90" cy="445" r="6" fill="#2376c5"/><circle cx="215" cy="445" r="6" fill="#2376c5"/><circle cx="90" cy="570" r="6" fill="#2376c5"/><circle cx="215" cy="570" r="6" fill="#2376c5"/><text x="268" y="458" font-size="21" fill="#18334c" font-weight="400">r&lt;1：孤立点，无环</text><text x="268" y="505" font-size="21" fill="#17816c" font-weight="700">1≤r&lt;√2：一个未填环</text><text x="268" y="552" font-size="21" fill="#18334c" font-weight="400">r≥√2：三角面填环</text><rect x="714" y="425" width="621" height="175" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">持久条约[1,√2)，不是固定b1=1</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">b0也不总等于batch大小</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">坐标放大2倍，出生/死亡尺度同变</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">绝对持久阈值固定时计数可能变</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">示意非作者激活，不调用真实拓扑数据</text><rect x="28" y="645" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  分数b1/激活元素数；ρ按层计，不按参数或显存计</text><rect x="53" y="705" width="610" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="737" font-size="23" fill="#17816c" font-weight="700">层A：10环/1000元素=.01</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">层B：4环/100元素=.04 → B优先</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">20候选、ρ=.1 → 教学选2层</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">激活规模是成本代理，不是精确硬件成本</text><rect x="714" y="705" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="737" font-size="23" fill="#7750ad" font-weight="700">通道筛选不会自动把模型剪小</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">默认主表选全部通道</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">冻结通道仍可能需要前向计算</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">梯度mask还要核查动量/权重衰减更新</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  W1可训、W2冻结、W3可训：W1梯度仍需经过f2</text><rect x="53" y="955" width="610" height="177" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="987" font-size="23" fill="#2376c5" font-weight="700">x → f1(W1) → f2(W2固定) → f3(W3)</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">不求W2参数梯度，不等于切断输入梯度</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">整段no_grad可能让W1收不到训练信号</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">早层被选时，后部冻结仍有反向成本</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">BN运行统计与参数冻结要分别检查</text><rect x="714" y="955" width="621" height="177" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="987" font-size="23" fill="#c36b24" font-weight="700">选择缓存 / 拓扑 / 后训练分开计账</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">40点距离矩阵1600项，400点160000项</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">还需高维激活与复杂形内存</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">环多是经验选择信号，不是任务相关性证明</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未跑真实激活、训练或边缘设备实验</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>