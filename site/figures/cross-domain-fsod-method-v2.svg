<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">跨域FSOD ｜共享query并行解码、DN随机与渐进解冻</title><desc id="desc">依据PDF3–5 Fig.2、式1–7；预测/query尺寸为教学例，非检测器实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">跨域FSOD ｜共享query并行解码、DN随机与渐进解冻</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–5 Fig.2、式1–7；预测/query尺寸为教学例，非检测器实验。</text><rect x="28" y="115" width="1344" height="315" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  L6/K1：沿用原6层参数，后5层都读Q1；不是D6再读D5</text><rect x="60" y="230" width="200" height="105" fill="#fff" stroke="#2376c5" rx="16"/><text x="78" y="262" font-size="23" fill="#2376c5" font-weight="700">Q0 → D1 → Q1</text><text x="78" y="295" font-size="19" fill="#18334c" font-weight="400">共享层也给预测</text><rect x="415" y="180" width="205" height="36" fill="#f1ecf8" stroke="#7750ad" rx="6"/><text x="440" y="206" font-size="20" fill="#7750ad" font-weight="700">D2(Q1,E)</text><path d="M260 280 L350 280 L350 198 L408 198" fill="none" stroke="#7750ad" stroke-width="3" marker-end="url(#7750ad)" /><rect x="415" y="225" width="205" height="36" fill="#f1ecf8" stroke="#7750ad" rx="6"/><text x="440" y="251" font-size="20" fill="#7750ad" font-weight="700">D3(Q1,E)</text><path d="M260 280 L350 280 L350 243 L408 243" fill="none" stroke="#7750ad" stroke-width="3" marker-end="url(#7750ad)" /><rect x="415" y="270" width="205" height="36" fill="#f1ecf8" stroke="#7750ad" rx="6"/><text x="440" y="296" font-size="20" fill="#7750ad" font-weight="700">D4(Q1,E)</text><path d="M260 280 L350 280 L350 288 L408 288" fill="none" stroke="#7750ad" stroke-width="3" marker-end="url(#7750ad)" /><rect x="415" y="315" width="205" height="36" fill="#f1ecf8" stroke="#7750ad" rx="6"/><text x="440" y="341" font-size="20" fill="#7750ad" font-weight="700">D5(Q1,E)</text><path d="M260 280 L350 280 L350 333 L408 333" fill="none" stroke="#7750ad" stroke-width="3" marker-end="url(#7750ad)" /><rect x="415" y="360" width="205" height="36" fill="#f1ecf8" stroke="#7750ad" rx="6"/><text x="440" y="386" font-size="20" fill="#7750ad" font-weight="700">D6(Q1,E)</text><path d="M260 280 L350 280 L350 378 L408 378" fill="none" stroke="#7750ad" stroke-width="3" marker-end="url(#7750ad)" /><rect x="714" y="175" width="621" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="207" font-size="23" fill="#17816c" font-weight="700">原串行依赖6层 → HED最长2层</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">总共仍执行6层，不是计算层数也减成2</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">不是复制出5个完整检测器</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">正常query输出按全部6层平均</text><text x="732" y="327" font-size="19" fill="#18334c" font-weight="400">τ0取消DN随机，仍是并行结构</text><rect x="28" y="455" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="489" font-size="24" fill="#18334c" font-weight="700">02  教学同query的6层预测：共享层输出不能丢掉</text><rect x="53" y="515" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="547" font-size="23" fill="#2376c5" font-weight="700">x_center=[.3,.4,.5,.4,.6,.2] → 平均.4</text><text x="71" y="580" font-size="19" fill="#18334c" font-weight="400">class p=[.4,.8,.6,.7,.5,.6] → 平均.6</text><text x="71" y="609" font-size="19" fill="#18334c" font-weight="400">错删首共享层 → .42 / .64</text><text x="71" y="638" font-size="19" fill="#18334c" font-weight="400">框坐标格式与query索引必须统一</text><rect x="714" y="515" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="547" font-size="23" fill="#c36b24" font-weight="700">平均p不等于平均logits再softmax</text><text x="732" y="580" font-size="19" fill="#18334c" font-weight="400">不concat任意框就直接视作原HED</text><text x="732" y="609" font-size="19" fill="#18334c" font-weight="400">移植到别的模型需核query对应</text><text x="732" y="638" font-size="19" fill="#18334c" font-weight="400">多样性也可能把正确尖锐预测稀释</text><rect x="28" y="705" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="739" font-size="24" fill="#18334c" font-weight="700">03  DN仅训练：GT框扰动→DN query；以τ重建并同步该分支target</text><rect x="53" y="765" width="610" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="797" font-size="23" fill="#7750ad" font-weight="700">正常object query不做随机重置</text><text x="71" y="830" font-size="19" fill="#18334c" font-weight="400">不是重置decoder权重或测试时随机目标</text><text x="71" y="859" font-size="19" fill="#18334c" font-weight="400">默认τ.5；教学独立5分支期望2.5个重置</text><text x="71" y="888" font-size="19" fill="#18334c" font-weight="400">实际RandInit粒度/GT处理主文未给全</text><rect x="714" y="765" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="797" font-size="23" fill="#17816c" font-weight="700">Lmatch + λdn Ldn；分支loss平均</text><text x="732" y="830" font-size="19" fill="#18334c" font-weight="400">正常query用匹配监督，DN提供辅助目标</text><text x="732" y="859" font-size="19" fill="#18334c" font-weight="400">推理不输入GT、不保留DN、不做RandInit</text><text x="732" y="888" font-size="19" fill="#18334c" font-weight="400">“确定”指无该随机过程，非bitwise保证</text><rect x="28" y="955" width="1344" height="235" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="989" font-size="24" fill="#18334c" font-weight="700">04  冻结encoder先适配 → 验证plateau首次降lr → 解冻全部继续训练</text><rect x="53" y="1015" width="610" height="153" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="1047" font-size="23" fill="#2376c5" font-weight="700">事件驱动，不捏造固定轮数/学习率</text><text x="71" y="1080" font-size="19" fill="#18334c" font-weight="400">patience/factor/冻结参数范围在配置核验</text><text x="71" y="1109" font-size="19" fill="#18334c" font-weight="400">增强需框标签同步，验证不偷用测试</text><text x="71" y="1138" font-size="19" fill="#18334c" font-weight="400">参数相同不等于吞吐/峰值内存相同</text><rect x="714" y="1015" width="621" height="153" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="1047" font-size="23" fill="#c36b24" font-weight="700">教学100×256 float32≈.098MiB/份</text><text x="732" y="1080" font-size="19" fill="#18334c" font-weight="400">5份输出≈.488MiB，QKV/梯度另计</text><text x="732" y="1109" font-size="19" fill="#18334c" font-weight="400">未训练、运行或下载上游检测模型</text><text x="732" y="1138" font-size="19" fill="#18334c" font-weight="400">仅验算层依赖/平均/期望/内存</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>