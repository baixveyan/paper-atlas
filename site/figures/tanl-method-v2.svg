<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">TANL ｜激活概率、前缀排序与FIFO更新时序</title><desc id="desc">依据PDF3–5 式5–15、Algorithm1；概率与质量数字为教学例，非OOD评测。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">TANL ｜激活概率、前缀排序与FIFO更新时序</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–5 式5–15、Algorithm1；概率与质量数字为教学例，非OOD评测。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  CLIP权重固定，缓存/负词更新；Act分母含全部C个ID+N个候选</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">Act=对应词softmax概率在feature集合均值</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">教学pos[.1,.3,.1]，neg[.4,.1,.2]</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">差[.3,−.2,.1] → 选第1/3词</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">不是余弦均值，正式测试不访问GT分组</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="207" font-size="23" fill="#17816c" font-weight="700">FIFO正队列初始是ID文本feature</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">负队列初始是Gaussian噪声图feature</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">后续高置信图像入队，超L删最早</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">旧元素无新入队时不会自动按时间过期</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  门限教学γ.5/g.2：pos≥.6，neg&lt;.4，中间不入队</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="457" font-size="23" fill="#7750ad" font-weight="700">batch Act=.95历史+.05本批（非空时）</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">正侧历史.1/本批.3 → .11</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">每边独立判空，空侧直接用历史</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">不能把空均值当0，也不把整批都混在一起</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">已有score筛batch → 重选词 → final score</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">final高置信再更新FIFO，保存前后状态</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">Algorithm1 bootstrap没完全明列，需核实现</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">不是新score先选择它自己的输入数据</text><rect x="28" y="615" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  按activation降序的负词，反复出现在不同前缀分母里</text><rect x="53" y="675" width="610" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="707" font-size="23" fill="#2376c5" font-weight="700">教学A=2，负质量[3,1]</text><text x="71" y="740" font-size="19" fill="#18334c" font-weight="400">前缀ID概率：2/5=.4；2/6=.333333</text><text x="71" y="769" font-size="19" fill="#18334c" font-weight="400">平均S≈.366667（越低越像OOD）</text><text x="71" y="798" font-size="19" fill="#18334c" font-weight="400">若反排[1,3]：均值.5，排序影响输出</text><text x="71" y="827" font-size="19" fill="#18334c" font-weight="400">只用全分母二者都2/6，非本文评分</text><rect x="714" y="675" width="621" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="707" font-size="23" fill="#17816c" font-weight="700">S=(1/M)Σ_m A/(A+cumsum(b)_m)</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">第1负词进M个分母，第M词只进1个</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">不是把activation数值直接乘logit</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">τ=.01不能漏；exp要做数值稳定</text><text x="732" y="827" font-size="19" fill="#18334c" font-weight="400">cumsum约BM，非逐前缀重算BM²</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  有状态测试适应：批组成、顺序、重置和伪标签污染均影响结果</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="987" font-size="23" fill="#7750ad" font-weight="700">p1&lt;p2是理论条件，不由Act排序严格保证</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">近OOD可错进正队列并自强化</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">灰区保守会慢，过松更易污染</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">跨数据集继承缓存会改变协议</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">每批保留provisional/final与入队记录</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="987" font-size="23" fill="#c36b24" font-weight="700">D512/L300教学两队列float32≈1.17MiB</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">文本库/相似矩阵/encoder工作区另计</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">training-free不等于无计算或无状态</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">仅验算激活/门限/前缀/导数/内存</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未运行CLIP或任何OOD检测实验</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>