<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1330" viewBox="0 0 1400 1330" role="img" aria-labelledby="title desc"><title id="title">3DrawAgent ｜真实曲线投影与外部经验循环</title><desc id="desc">依据PDF2–4 Fig.2、式1–11；控制点/投影/奖励均为教学例，非模型生成样本。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1330" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">3DrawAgent ｜真实曲线投影与外部经验循环</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF2–4 Fig.2、式1–11；控制点/投影/奖励均为教学例，非模型生成样本。</text><rect x="28" y="115" width="1344" height="370" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  同一3D Bézier两种正交教学投影：xz端点重合，不代表三维闭合</text><rect x="53" y="175" width="621" height="282" fill="#fff" stroke="#b7cbdc" rx="16"/><text x="71" y="206" font-size="23" fill="#2376c5" font-weight="700">xy投影</text><rect x="714" y="175" width="621" height="282" fill="#fff" stroke="#b7cbdc" rx="16"/><text x="732" y="206" font-size="23" fill="#2376c5" font-weight="700">xz投影</text><polyline points="90,440 330,440 330,240 90,240" fill="none" stroke="#99a8b8" stroke-width="2" stroke-dasharray="6 5"/><path d="M90 440 C330 440 330 240 90 240" fill="none" stroke="#2376c5" stroke-width="5"/><polyline points="790,340 1030,250 1030,430 790,340" fill="none" stroke="#99a8b8" stroke-width="2" stroke-dasharray="6 5"/><path d="M790 340 C1030 250 1030 430 790 340" fill="none" stroke="#7750ad" stroke-width="5"/><circle cx="90" cy="440" r="5" fill="#c36b24"/><text x="98" y="432" font-size="17" fill="#c36b24" font-weight="400">P0</text><circle cx="330" cy="440" r="5" fill="#c36b24"/><text x="338" y="432" font-size="17" fill="#c36b24" font-weight="400">P1</text><circle cx="330" cy="240" r="5" fill="#c36b24"/><text x="338" y="232" font-size="17" fill="#c36b24" font-weight="400">P2</text><circle cx="90" cy="240" r="5" fill="#c36b24"/><text x="98" y="232" font-size="17" fill="#c36b24" font-weight="400">P3</text><circle cx="790" cy="340" r="5" fill="#c36b24"/><text x="798" y="332" font-size="17" fill="#c36b24" font-weight="400">P0/P3</text><circle cx="1030" cy="250" r="5" fill="#c36b24"/><text x="1038" y="242" font-size="17" fill="#c36b24" font-weight="400">P1</text><circle cx="1030" cy="430" r="5" fill="#c36b24"/><text x="1038" y="422" font-size="17" fill="#c36b24" font-weight="400">P2</text><text x="370" y="255" font-size="18" fill="#18334c" font-weight="400">P0=(0,0,0)</text><text x="370" y="290" font-size="18" fill="#18334c" font-weight="400">P1=(1,0,1)</text><text x="370" y="325" font-size="18" fill="#18334c" font-weight="400">P2=(1,1,−1)</text><text x="370" y="360" font-size="18" fill="#18334c" font-weight="400">P3=(0,1,0)</text><text x="370" y="415" font-size="17" fill="#586d80" font-weight="400">不是作者相机设置</text><text x="1070" y="255" font-size="19" fill="#18334c" font-weight="400">B(.5)=</text><text x="1070" y="289" font-size="19" fill="#17816c" font-weight="700">(.75,.5,0)</text><text x="1070" y="338" font-size="19" fill="#18334c" font-weight="400">t=.25时</text><text x="1070" y="372" font-size="19" fill="#18334c" font-weight="400">z=.28125</text><text x="1070" y="420" font-size="17" fill="#586d80" font-weight="400">透视需另处理</text><rect x="28" y="510" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="544" font-size="24" fill="#18334c" font-weight="700">02  冻结LLM输出N×4×3数据 → 安全解析 → 16视图 → CLIP均值</text><rect x="53" y="570" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="602" font-size="23" fill="#2376c5" font-weight="700">经验采样每题K5 → 至少80张视图</text><text x="71" y="635" font-size="19" fill="#18334c" font-weight="400">parser只读数据，不eval执行输出</text><text x="71" y="664" font-size="19" fill="#18334c" font-weight="400">格式/数值/曲线数与失败统计分开保存</text><text x="71" y="693" font-size="19" fill="#18334c" font-weight="400">可微renderer在本文不用于控制点反向优化</text><rect x="714" y="570" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="602" font-size="23" fill="#17816c" font-weight="700">教学A：8张.8、8张.4 → 均值.6</text><text x="732" y="635" font-size="19" fill="#18334c" font-weight="400">B：16张.61 → .61，B排名更高</text><text x="732" y="664" font-size="19" fill="#18334c" font-weight="400">先逐视图求余弦，后平均；不是3D正确率</text><text x="732" y="693" font-size="19" fill="#18334c" font-weight="400">主文经验奖励按文本，图像评测口径另列</text><rect x="28" y="760" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="794" font-size="24" fill="#18334c" font-weight="700">03  对比分数 → LLM文字优势 → Add/Delete/Modify/Keep → 外部E</text><rect x="53" y="820" width="610" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="852" font-size="23" fill="#7750ad" font-weight="700">例分数[.60,.61,.52,.58,.55]</text><text x="71" y="885" font-size="19" fill="#18334c" font-weight="400">可比.61与.52；5候选最多10无序对</text><text x="71" y="914" font-size="19" fill="#18334c" font-weight="400">主文未说使用全部pair或只取极值</text><text x="71" y="943" font-size="19" fill="#18334c" font-weight="400">judge解释是因果假说，不由CLIP证明</text><text x="71" y="972" font-size="19" fill="#18334c" font-weight="400">经验/支持候选/分数和编辑版本需一同留存</text><rect x="714" y="820" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="852" font-size="23" fill="#c36b24" font-weight="700">θ固定：改变E不等于更新参数</text><text x="732" y="885" font-size="19" fill="#18334c" font-weight="400">不是GRPO数值优势乘策略梯度</text><text x="732" y="914" font-size="19" fill="#18334c" font-weight="400">格式示例仍有示范作用，非完全无先验</text><text x="732" y="943" font-size="19" fill="#18334c" font-weight="400">更多轮/K不保证更好，独立验证选版本</text><text x="732" y="972" font-size="19" fill="#18334c" font-weight="400">API/经验长度/采样成本也计入系统</text><rect x="28" y="1040" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1074" font-size="24" fill="#18334c" font-weight="700">04  最终T+固定E → 首个完整候选 → 验证/渲染，失败也进统计</text><rect x="53" y="1100" width="610" height="153" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="1132" font-size="23" fill="#17816c" font-weight="700">端点相接C0，不自动切向C1</text><text x="71" y="1165" font-size="19" fill="#18334c" font-weight="400">B′(0)=3(P1−P0)，B′(1)=3(P3−P2)</text><text x="71" y="1194" font-size="19" fill="#18334c" font-weight="400">接段需Q0=P3；同参数C1需Q1−Q0=P3−P2</text><text x="71" y="1223" font-size="19" fill="#18334c" font-weight="400">输出曲线草图，不是闭合实体/真实尺寸</text><rect x="714" y="1100" width="621" height="153" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="1132" font-size="23" fill="#2376c5" font-weight="700">Pass@1不等于K候选择优</text><text x="732" y="1165" font-size="19" fill="#18334c" font-weight="400">本地仅验算曲线、投影与奖励均值</text><text x="732" y="1194" font-size="19" fill="#18334c" font-weight="400">未调用API/模型或运行第三方renderer</text><text x="732" y="1223" font-size="19" fill="#18334c" font-weight="400">单3090描述不含远端LLM推理算力</text><text x="36" y="1307" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>