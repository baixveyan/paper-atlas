<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">GAP ｜动作块、未来伪标签与冻结解码梯度</title><desc id="desc">依据PDF3–5 Fig.2、式1–8；t100/N8和224²均为教学例，非作者实际控制配置。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">GAP ｜动作块、未来伪标签与冻结解码梯度</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–5 Fig.2、式1–8；t100/N8和224²均为教学例，非作者实际控制配置。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  当前t条件：5张历史+当前RGB / 当前语义 / 14维机器人状态</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">π³最后两层concat → 1024宽几何</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">DINOv3当前RGB → 1024宽语义</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">状态左/右各6关节+1夹爪 → MLP1024</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">按token拼接，不是每token变3072通道</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="207" font-size="23" fill="#17816c" font-weight="700">4层DETR融合context，联合条件去噪</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">动作N×14，future latent (H/14)×(W/14)×1024</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">点图H×W×4：xyz+confidence</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">完整geometry condition token数主文未明确</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  教学t100/N8：动作100…107；未来几何目标108，不是8张点图</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="457" font-size="23" fill="#7750ad" font-weight="700">teacher离线用索引s的历史+I_s提f_s</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">训练取f_t+N作标签；当前condition不看未来</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">π³伪标签不等于真实完整3D测量</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">坐标/尺度/confidence与尾段处理仍待核</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">扩散步k不是环境动作序号</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">xk=√αbar x0+√(1−αbar)ε</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">教学x0=.5、αbar=.64、ε=−1 → xk=−.2</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">训练目标是干净.5，不是噪声−1</text><rect x="28" y="615" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  action/latent/pointmap三项L1；冻结Dense Head仍传输入梯度</text><rect x="53" y="675" width="610" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="707" font-size="23" fill="#2376c5" font-weight="700">Fig.2雪花：π³、DINOv3、Dense Head</text><text x="71" y="740" font-size="19" fill="#18334c" font-weight="400">训练状态MLP/融合/denoiser/action head</text><text x="71" y="769" font-size="19" fill="#18334c" font-weight="400">P_hat=Dec(f_hat)，Dec参数固定</text><text x="71" y="798" font-size="19" fill="#18334c" font-weight="400">J_Decᵀ × pointmap误差 → 上游f_hat梯度</text><text x="71" y="827" font-size="19" fill="#18334c" font-weight="400">整段no_grad会切断这条训练信号</text><rect x="714" y="675" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="707" font-size="23" fill="#c36b24" font-weight="700">未来目标来自专家序列，不是推理输入</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">式4把P列加噪集合，图又由f解P</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">是否独立P噪声输入主文未展开，不补猜</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">λ/γ、sum/mean、归一化都影响梯度尺度</text><text x="732" y="827" font-size="19" fill="#18334c" font-weight="400">几何一致性不是碰撞/动力学硬约束</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  部署高斯初态迭代K次 → 动作块+future latent；可跳过点图解码</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="987" font-size="23" fill="#17816c" font-weight="700">教学224²：latent262144标量≈1MiB</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">pointmap200704标量≈.766MiB</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">N8 action112标量=448字节，非全部内存</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">geometry tokens仍参与联合去噪</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">K/N、执行前缀与重规划配置主文未给全</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="987" font-size="23" fill="#7750ad" font-weight="700">RGB-only仍需14维真实状态与控制配置</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">不把joint position当力矩或末端位姿</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">终点监督不保证每个中间动作安全可行</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">仅验算索引/shape/噪声，非策略训练</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未采集数据、运行模型或控制机器人</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>