<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">Action-Sketcher ｜草图坐标、token模式与动作接口</title><desc id="desc">依据主文 §3、Fig.2与式1–7；坐标/IoU/采样均为教学例，非机器人执行结果。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">Action-Sketcher ｜草图坐标、token模式与动作接口</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3、Fig.2与式1–7；坐标/IoU/采样均为教学例，非机器人执行结果。</text><rect x="28" y="115" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  ego-view像素草图表达意图；多视角/状态仍负责消解3D动作</text><rect x="66" y="183" width="540" height="160" fill="#fff" stroke="#2376c5" rx="5"/><rect x="120" y="219" width="160" height="93" fill="#edf5ff" stroke="#2376c5" rx="3"/><text x="133" y="244" font-size="20" fill="#2376c5" font-weight="400">壶体框</text><text x="130" y="338" font-size="19" fill="#2376c5" font-weight="400">柄点(160,240)</text><circle cx="260" cy="278" r="6" fill="#2376c5"/><circle cx="466" cy="278" r="6" fill="#17816c"/><path d="M268,278 L457,278" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><text x="293" y="258" font-size="20" fill="#17816c" font-weight="700">壶嘴 → 杯口</text><rect x="714" y="175" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">640×480缩为320×240的教学例</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">柄点(160,240) → (80,120)</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">框/点/箭头同步缩放；裁剪还需平移</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">箭头不唯一规定深度、接触力或关节轨迹</text><text x="732" y="327" font-size="19" fill="#18334c" font-weight="400">旋转提示另含锚点、x/y/z轴与方向</text><rect x="28" y="400" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="434" font-size="24" fill="#18334c" font-weight="700">02  空上下文先BOR；之后由学习token切换，不是固定风险检测器</text><rect x="52" y="460" width="375" height="136" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="492" font-size="23" fill="#2376c5" font-weight="700">BOR → 自回归推理</text><text x="70" y="525" font-size="19" fill="#18334c" font-weight="400">历史/场景 → 下一子任务</text><text x="70" y="554" font-size="19" fill="#18334c" font-weight="400">结构化框/点/箭头描述</text><text x="70" y="583" font-size="19" fill="#18334c" font-weight="400">到EOR结束文本推理</text><rect x="484" y="460" width="390" height="136" fill="#fff" stroke="#17816c" rx="16"/><text x="502" y="492" font-size="23" fill="#17816c" font-weight="700">渲染 → 更新上下文</text><text x="502" y="525" font-size="19" fill="#18334c" font-weight="400">文本坐标 → 参考图上草图</text><text x="502" y="554" font-size="19" fill="#18334c" font-weight="400">可人工修订、留修改历史</text><text x="502" y="583" font-size="19" fill="#18334c" font-weight="400">场景变了旧像素可能过期</text><rect x="932" y="460" width="405" height="136" fill="#fff" stroke="#c36b24" rx="16"/><text x="950" y="492" font-size="23" fill="#c36b24" font-weight="700">BOA → 连续动作块</text><text x="950" y="525" font-size="19" fill="#18334c" font-weight="400">动作专家另读state/noise</text><text x="950" y="554" font-size="19" fill="#18334c" font-weight="400">flow-matching采样，不是文本关节命令</text><text x="950" y="583" font-size="19" fill="#18334c" font-weight="400">执行后回读，再决定是否BOR</text><path d="M427,526 L477,526" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,526 L925,526" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="650" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="684" font-size="24" fill="#18334c" font-weight="700">03  小误差增广：点改则箭头跟随；框IoU条件不是坐标20%规则</text><rect x="53" y="710" width="610" height="137" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="742" font-size="23" fill="#2376c5" font-weight="700">100×100框仅横移d的教学</text><text x="71" y="775" font-size="19" fill="#18334c" font-weight="400">IoU=(100−d)/(100+d)</text><text x="71" y="804" font-size="19" fill="#18334c" font-weight="400">d10 → .81818合格；d12 → .78571不合格</text><text x="71" y="833" font-size="19" fill="#18334c" font-weight="400">点圆半径与实现规范主文未给全</text><rect x="714" y="710" width="621" height="137" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="742" font-size="23" fill="#7750ad" font-weight="700">示范动作不随意被新草图改写</text><text x="732" y="775" font-size="19" fill="#18334c" font-weight="400">小误差容忍 ≠ 任意错误意图都有正确动作</text><text x="732" y="804" font-size="19" fill="#18334c" font-weight="400">旋转大小/持续时间/SE(3)解码仍待策略学习</text><text x="732" y="833" font-size="19" fill="#18334c" font-weight="400">未提供可执行RL奖励或更新式，不补造GRPO</text><rect x="28" y="900" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="934" font-size="24" fill="#18334c" font-weight="700">04  模式均衡监督不等于部署随机选模式</text><rect x="53" y="960" width="610" height="177" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="992" font-size="23" fill="#17816c" font-weight="700">教学|DR|=10，|DA|=1000</text><text x="71" y="1025" font-size="19" fill="#18334c" font-weight="400">每条推理.05；每条动作.0005</text><text x="71" y="1054" font-size="19" fill="#18334c" font-weight="400">单条推理权重100倍，两组总概率各.5</text><text x="71" y="1083" font-size="19" fill="#18334c" font-weight="400">混池均匀取样推理仅约.99%</text><text x="71" y="1112" font-size="19" fill="#18334c" font-weight="400">部署模式由模型决定，并非50%抛硬币</text><rect x="714" y="960" width="621" height="177" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="992" font-size="23" fill="#c36b24" font-weight="700">三阶段：基础 → 理由/草图 → 动作/模式</text><text x="732" y="1025" font-size="19" fill="#18334c" font-weight="400">3.4M空间 + 870K时序样本</text><text x="732" y="1054" font-size="19" fill="#18334c" font-weight="400">21K推理到草图；阶段3有动作监督与增广</text><text x="732" y="1083" font-size="19" fill="#18334c" font-weight="400">附录优化/冻结/求解器参数尚未核验</text><text x="732" y="1112" font-size="19" fill="#18334c" font-weight="400">未调用教师、训练或控制任何机器人</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>