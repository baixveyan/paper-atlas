<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">噪声与双边滤波 ｜边缘权重、迭代顺序与随机攻击评估</title><desc id="desc">依据主文 §4–6、Fig.1与Table1–2；像素/范数/梯度说明为教学例，非攻击实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1230" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">噪声与双边滤波 ｜边缘权重、迭代顺序与随机攻击评估</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §4–6、Fig.1与Table1–2；像素/范数/梯度说明为教学例，非攻击实验。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  x → 加高斯噪声 → K轮双边滤波 → CNN；训练/推理都使用</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">预处理不是无需训练的通用外挂</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">基础CNN从预处理分布学习</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">强WRN还用TRADES与EDM数据</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">20/100是训练/推理滤波轮数，不是100次投票</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">双边权重 = 空间权重 × 颜色差权重</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">颜色差大时抑制跨边缘混合</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">每轮从新图重算权重，不是固定线性卷积</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">图注variance .032的尺度/代码需核验</text><rect x="28" y="365" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  双像素教学：空间权重都1、σr=.2；看颜色差怎样保边</text><rect x="53" y="425" width="610" height="169" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="457" font-size="23" fill="#17816c" font-weight="700">[0,1]，以0为中心</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">自身权重1；另一项exp(−12.5)</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">输出≈.00000372664，而普通均值.5</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">强边缘不被简单抹平</text><text x="71" y="577" font-size="19" fill="#18334c" font-weight="400">[0,.1]时输出≈.046879，接近均值.05</text><rect x="714" y="425" width="621" height="169" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">先噪声后滤波 ≠ 先滤波后噪声</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">反序新增噪声没有后续去噪</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">多轮K顺序依赖，计算不免费</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">σr太小也可能把噪声误当边缘</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">教学窗口/数值不是作者默认参数</text><rect x="28" y="640" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="674" font-size="24" fill="#18334c" font-weight="700">03  理想几何解释互补；高维噪声与干净精度仍有成本</text><rect x="53" y="700" width="610" height="143" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="732" font-size="23" fill="#2376c5" font-weight="700">理想滤波对离流形较远扰动有用</text><text x="71" y="765" font-size="19" fill="#18334c" font-weight="400">近流形细长错误区域可能抗滤波</text><text x="71" y="794" font-size="19" fill="#18334c" font-weight="400">随机噪声可能离开细长区域</text><text x="71" y="823" font-size="19" fill="#18334c" font-weight="400">两者理论分开分析，不保证实际滤波满足假设</text><rect x="714" y="700" width="621" height="143" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="732" font-size="23" fill="#7750ad" font-weight="700">教学D=3072、σn=.03</text><text x="732" y="765" font-size="19" fill="#18334c" font-weight="400">E‖ε‖²=2.7648，RMS范数≈1.66277</text><text x="732" y="794" font-size="19" fill="#18334c" font-weight="400">不是每次相同长度，也不是攻击者预算</text><text x="732" y="823" font-size="19" fill="#18334c" font-weight="400">单像素噪声小不代表总扰动小</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  自适应攻击包括完整随机预处理；EoT不是单次随机梯度</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="987" font-size="23" fill="#c36b24" font-weight="700">max合法a Eε loss(f(Tε(x+a)),y)</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">EoT：S份噪声梯度平均，检查收敛</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">BPDA：真实前向、近似反向帮助优化</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">TABPDA省略攻击阶段噪声，不等于充分EoT</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">高攻击准确率可能有梯度遮蔽成分</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="987" font-size="23" fill="#17816c" font-weight="700">按同攻击/资源报告收益与代价</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">L∞表均值组合增益约36.3点</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">单项增益和26.1点；原表小舍入差保留</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">并非每种攻击都超线性，也非鲁棒认证</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未训练模型、执行攻击或测试安全系统</text><text x="36" y="1207" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>