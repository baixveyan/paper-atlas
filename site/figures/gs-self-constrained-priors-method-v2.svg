<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">自约束高斯表面重建 ｜TSDF窄带、透明度与显式拉回</title><desc id="desc">依据主文 §3、式1–10与Fig.2–4；透明度与距离尺度例为教学算术，非重建实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">自约束高斯表面重建 ｜TSDF窄带、透明度与显式拉回</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3、式1–10与Fig.2–4；透明度与距离尺度例为教学算术，非重建实验。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  自先验循环：多视角RGB → 高斯深度 → TSDF → 反过来约束高斯</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">渲染深度是相机Z，不是沿射线距离</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">每视图H×W深度；ft是三维网格</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">sj=ft(μj)，中心三线性查询</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">σ控制截断带宽；δ划分on/off</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">表面是当前深度的融合，不是外部真值</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">周期更新参考并缩带：1 → .5 → .25</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">无新增神经SDF或外部深度网络训练</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">自己的错误也可能被反馈强化</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  同一透明度o=.4、教学δ=.2：分区改变优化方向</text><rect x="70" y="448" width="480" height="90" fill="#e7f6f1" stroke="#b2d5cb" rx="0"/><text x="86" y="478" font-size="21" fill="#17816c" font-weight="700">on：|s|≤.2</text><text x="86" y="515" font-size="19" fill="#18334c" font-weight="400">off：.2&lt;|s|&lt;1；饱和±1为清除候选</text><rect x="605" y="425" width="731" height="157" fill="#fff" stroke="#17816c" rx="16"/><text x="623" y="457" font-size="23" fill="#17816c" font-weight="700">近面s=.1：目标o→1；离面s=.6：目标o→0</text><text x="623" y="490" font-size="19" fill="#18334c" font-weight="400">权重1/(1+|s|)²：.82645 与 .390625</text><text x="623" y="519" font-size="19" fill="#18334c" font-weight="400">未除M损失：.29752 与 .0625</text><text x="623" y="548" font-size="19" fill="#18334c" font-weight="400">对o导数：−.99174/M 与 +.3125/M</text><text x="623" y="577" font-size="19" fill="#18334c" font-weight="400">颜色/其他损失仍同时作用，不保证最后恰0或1</text><rect x="28" y="645" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  增密 → 先拉回 → 再清除仍带外点；透明度项每次迭代</text><rect x="53" y="705" width="610" height="156" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="737" font-size="23" fill="#2376c5" font-weight="700">真实单位SDF教学：f=z，面z=0</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">μz=.2，s=.2，梯度1 → 更新到0</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">μ ← μ − s∇f 是显式位置操作</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">不是每轮额外反传的pulling loss</text><text x="71" y="857" font-size="19" fill="#18334c" font-weight="400">中心差分每轴±ϵ，ϵ=1e−4</text><rect x="714" y="705" width="621" height="156" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="737" font-size="23" fill="#c36b24" font-weight="700">归一化尺度反例：f=z/.5</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">μz=.1，s=.2，梯度2 → 印刷式到−.3</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">不是任意TSDF都能一步精确投影</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">距离单位、梯度处理、动量需实现核验</text><text x="732" y="857" font-size="19" fill="#18334c" font-weight="400">带外饱和梯度可为0，仍需随后删除</text><rect x="28" y="930" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="964" font-size="24" fill="#18334c" font-weight="700">04  几何损失与事件时序：颜色拟合不能替代几何一致性</text><rect x="53" y="990" width="610" height="157" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="1022" font-size="23" fill="#7750ad" font-weight="700">同射线两深度1与3、权重各.5</text><text x="71" y="1055" font-size="19" fill="#18334c" font-weight="400">深度惩罚 .5×.5×(1−3)²=1</text><text x="71" y="1084" font-size="19" fill="#18334c" font-weight="400">两深度都2 → 惩罚0，促表面收薄</text><text x="71" y="1113" font-size="19" fill="#18334c" font-weight="400">法向渲染 vs 深度法向；跨视图平面往返</text><text x="71" y="1142" font-size="19" fill="#18334c" font-weight="400">权重未归一时不能直接称概率方差</text><rect x="714" y="990" width="621" height="157" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="1022" font-size="23" fill="#2376c5" font-weight="700">优化高斯；TSDF只在周期重新融合</text><text x="732" y="1055" font-size="19" fill="#18334c" font-weight="400">渲染/损失 → 参数更新 → 增密事件</text><text x="732" y="1084" font-size="19" fill="#18334c" font-weight="400">增密后：拉回 → 删除；周期到：换参考</text><text x="732" y="1113" font-size="19" fill="#18334c" font-weight="400">事件重合优先级、未知体素策略未给全</text><text x="732" y="1142" font-size="19" fill="#18334c" font-weight="400">未训练、融合或运行作者重建程序</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>