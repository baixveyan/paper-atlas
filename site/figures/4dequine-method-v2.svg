<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1260" viewBox="0 0 1400 1260" role="img" aria-labelledby="title desc"><title id="title">4DEquine ｜动作参数、规范高斯与两阶段几何优化</title><desc id="desc">依据主文 §3–4 Fig.2 与补充 §2；坐标、内存为教学算例，未运行VAREN或重建模型。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1260" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">4DEquine ｜动作参数、规范高斯与两阶段几何优化</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3–4 Fig.2 与补充 §2；坐标、内存为教学算例，未运行VAREN或重建模型。</text><rect x="28" y="115" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  动作随时间，外观只生成一次：VAREN保持身体对应</text><rect x="52" y="176" width="375" height="175" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="208" font-size="23" fill="#2376c5" font-weight="700">视频 → AniMoFormer</text><text x="70" y="241" font-size="19" fill="#18334c" font-weight="400">16帧空间/时间特征 → 参数</text><text x="70" y="270" font-size="19" fill="#18334c" font-weight="400">β39、θ38×3、相机</text><text x="70" y="299" font-size="19" fill="#18334c" font-weight="400">VAREN网格：13873顶点</text><text x="70" y="328" font-size="19" fill="#18334c" font-weight="400">滑窗拼接细节仍需核验</text><rect x="484" y="176" width="390" height="175" fill="#fff" stroke="#7750ad" rx="16"/><text x="502" y="208" font-size="23" fill="#7750ad" font-weight="700">单图 → EquineGS</text><text x="502" y="241" font-size="19" fill="#18334c" font-weight="400">FI：784×1024；DINOv3冻结</text><text x="502" y="270" font-size="19" fill="#18334c" font-weight="400">FP：55486×1024规范点</text><text x="502" y="299" font-size="19" fill="#18334c" font-weight="400">全局条件：1×1024</text><text x="502" y="328" font-size="19" fill="#18334c" font-weight="400">5个DSTG块 → 每点14属性</text><rect x="932" y="176" width="405" height="175" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="208" font-size="23" fill="#17816c" font-weight="700">每帧LBS → 高斯渲染</text><text x="950" y="241" font-size="19" fill="#18334c" font-weight="400">同一规范高斯随动作变形</text><text x="950" y="270" font-size="19" fill="#18334c" font-weight="400">位移3+旋转4+尺度3+RGB3+o1</text><text x="950" y="299" font-size="19" fill="#18334c" font-weight="400">颜色是RGB，不直接套SH维数</text><text x="950" y="328" font-size="19" fill="#18334c" font-weight="400">动作与外观不是逐帧联合重训</text><path d="M427,252 L477,252" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,252 L925,252" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="405" width="1344" height="238" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="439" font-size="24" fill="#18334c" font-weight="700">02  几何后优化两阶段：参数更新不等于重新训练整个网络</text><rect x="53" y="465" width="610" height="141" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="497" font-size="23" fill="#2376c5" font-weight="700">阶段1：全部VAREN参数与相机</text><text x="71" y="530" font-size="19" fill="#18334c" font-weight="400">100次AdamW，lr=.005</text><text x="71" y="559" font-size="19" fill="#18334c" font-weight="400">λ2D=10000，λmask=100</text><text x="71" y="588" font-size="19" fill="#18334c" font-weight="400">关键点投影优先；同时保留平滑与姿态正则</text><rect x="714" y="465" width="621" height="141" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="497" font-size="23" fill="#c36b24" font-weight="700">阶段2：冻结姿态与相机，主要修形状</text><text x="732" y="530" font-size="19" fill="#18334c" font-weight="400">再100次AdamW，lr=.005</text><text x="732" y="559" font-size="19" fill="#18334c" font-weight="400">λ2D=100，λmask=10000</text><text x="732" y="588" font-size="19" fill="#18334c" font-weight="400">使用伪关键点/mask，不是3D真值</text><rect x="28" y="668" width="1344" height="300" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="702" font-size="24" fill="#18334c" font-weight="700">03  LBS纯平移教学例：同一规范点按权重跟随两个变换</text><path d="M78,904 L620,904" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M78,904 L78,743" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="610" y="931" font-size="20" fill="#18334c" font-weight="400">x</text><text x="57" y="743" font-size="20" fill="#18334c" font-weight="400">y</text><circle cx="238" cy="904" r="7" fill="#2376c5"/><text x="249" y="891" font-size="18" fill="#2376c5" font-weight="700">p=(1,0)</text><circle cx="398" cy="904" r="7" fill="#c36b24"/><text x="409" y="891" font-size="18" fill="#c36b24" font-weight="700">T₁p=(2,0)</text><circle cx="238" cy="744" r="7" fill="#7750ad"/><text x="249" y="731" font-size="18" fill="#7750ad" font-weight="700">T₂p=(1,2)</text><circle cx="358" cy="864" r="7" fill="#17816c"/><text x="369" y="851" font-size="18" fill="#17816c" font-weight="700">混合=(1.75,.5)</text><path d="M398 894 L363 870" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><path d="M246 749 L351 857" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><rect x="716" y="730" width="620" height="188" fill="#fff" stroke="#17816c" rx="16"/><text x="734" y="762" font-size="23" fill="#17816c" font-weight="700">w₁=.75，w₂=.25，w₁+w₂=1</text><text x="734" y="795" font-size="19" fill="#18334c" font-weight="400">.75·(2,0)+.25·(1,2)=(1.75,.5)</text><text x="734" y="824" font-size="19" fill="#18334c" font-weight="400">此例只解释中心的基础蒙皮</text><text x="734" y="853" font-size="19" fill="#18334c" font-weight="400">实际还涉及体型/肌肉形变与椭球方向</text><text x="734" y="882" font-size="19" fill="#18334c" font-weight="400">绑定面权与高斯运输的实现未核验</text><rect x="28" y="993" width="1344" height="220" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1027" font-size="24" fill="#18334c" font-weight="700">04  特征与计算量纲：单份FP16不等于完整训练显存</text><rect x="53" y="1053" width="610" height="128" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="1085" font-size="23" fill="#7750ad" font-weight="700">55486×1024 = 56817664 标量</text><text x="71" y="1118" font-size="19" fill="#18334c" font-weight="400">单份FP16约113.64MB（十进制）</text><text x="71" y="1147" font-size="19" fill="#18334c" font-weight="400">不含梯度、优化器、多层激活</text><rect x="714" y="1053" width="621" height="128" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="1085" font-size="23" fill="#c36b24" font-weight="700">若朴素全注意力：56270²/单head</text><text x="732" y="1118" font-size="19" fill="#18334c" font-weight="400">约31.66亿元素，FP16约6.33GB</text><text x="732" y="1147" font-size="19" fill="#18334c" font-weight="400">量纲估算；不是作者实际内核或显存测量</text><text x="36" y="1237" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>