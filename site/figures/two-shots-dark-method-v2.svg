<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">2-Shots in the Dark ｜两次校准与频谱—直方图交替合成</title><desc id="desc">依据正文 §3、Fig.2，PDF3–5；数值为教学算例，未读取用户照片或执行去噪训练。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">2-Shots in the Dark ｜两次校准与频谱—直方图交替合成</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据正文 §3、Fig.2，PDF3–5；数值为教学算例，未读取用户照片或执行去噪训练。</text><rect x="28" y="115" width="1344" height="235" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  每 ISO 两张校准图，不是去噪网络只训练两张图</text><rect x="52" y="176" width="375" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="208" font-size="23" fill="#2376c5" font-weight="700">暗帧：无光传感器输出</text><text x="70" y="241" font-size="19" fill="#18334c" font-weight="400">估计 S、μR 与残差频谱</text><text x="70" y="270" font-size="19" fill="#18334c" font-weight="400">固定结构原位保留</text><text x="70" y="299" font-size="19" fill="#18334c" font-weight="400">不是普通照片在软件里涂黑</text><rect x="484" y="176" width="390" height="145" fill="#fff" stroke="#c36b24" rx="16"/><text x="502" y="208" font-size="23" fill="#c36b24" font-weight="700">一张噪声图 → 估计光子增益</text><text x="502" y="241" font-size="19" fill="#18334c" font-weight="400">局部均值作伪干净信号</text><text x="502" y="270" font-size="19" fill="#18334c" font-weight="400">Var(y)=g·s+σother²</text><text x="502" y="299" font-size="19" fill="#18334c" font-weight="400">需要固定RAW单位与ISO</text><rect x="932" y="176" width="405" height="145" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="208" font-size="23" fill="#17816c" font-weight="700">合成训练对 → 去噪器</text><text x="950" y="241" font-size="19" fill="#18334c" font-weight="400">已有干净图 + 合成暗帧</text><text x="950" y="270" font-size="19" fill="#18334c" font-weight="400">另采 g·Poisson(s/g)</text><text x="950" y="299" font-size="19" fill="#18334c" font-weight="400">训练与推理都处理DSC偏置</text><path d="M427,247 L477,247" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,247 L925,247" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="375" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="409" font-size="24" fill="#18334c" font-weight="700">02  共享每个频率的相位偏移：初始跨谱中的随机因子相消</text><rect x="53" y="435" width="610" height="146" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="467" font-size="23" fill="#2376c5" font-weight="700">每通道保留各自幅度与原相位</text><text x="71" y="500" font-size="19" fill="#18334c" font-weight="400">N̂c = R̂c exp(iξ₀)</text><text x="71" y="529" font-size="19" fill="#18334c" font-weight="400">N̂d = R̂d exp(iξ₀)</text><text x="71" y="558" font-size="19" fill="#18334c" font-weight="400">ξ₀ 是H×W图，跨通道共享，不是常数</text><rect x="714" y="435" width="621" height="146" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="467" font-size="23" fill="#7750ad" font-weight="700">N̂c · conj(N̂d) = R̂c · conj(R̂d)</text><text x="732" y="500" font-size="19" fill="#18334c" font-weight="400">exp(iξ₀) exp(−iξ₀)=1</text><text x="732" y="529" font-size="19" fill="#18334c" font-weight="400">共轭对称与FFT归一化必须匹配</text><text x="732" y="558" font-size="19" fill="#18334c" font-weight="400">该恒等式不能自动推广到非线性匹配后</text><rect x="28" y="645" width="1344" height="277" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  交替约束：每步修复一种性质，也可能扰动另一种性质</text><rect x="53" y="705" width="375" height="177" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="737" font-size="23" fill="#c36b24" font-weight="700">直方图匹配</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">参考：[−3,−1,1,3]</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">当前：[.1,2,−1,.7]</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">rank赋值：[−1,3,−3,1]</text><text x="71" y="857" font-size="19" fill="#18334c" font-weight="400">值集合相同，位置不同</text><rect x="484" y="705" width="390" height="177" fill="#fff" stroke="#17816c" rx="16"/><text x="502" y="737" font-size="23" fill="#17816c" font-weight="700">去均值 → FFT → 幅度校正</text><text x="502" y="770" font-size="19" fill="#18334c" font-weight="400">保留当前相位，换回参考幅度</text><text x="502" y="799" font-size="19" fill="#18334c" font-weight="400">IFFT后加回该轮均值</text><text x="502" y="828" font-size="19" fill="#18334c" font-weight="400">频谱恢复，直方图可能再变化</text><text x="502" y="857" font-size="19" fill="#18334c" font-weight="400">K轮不是K张额外校准图</text><path d="M428,782 L477,782" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="932" y="705" width="405" height="177" fill="#fff" stroke="#2376c5" rx="16"/><text x="950" y="737" font-size="23" fill="#2376c5" font-weight="700">最终加回 S 与 μR</text><text x="950" y="770" font-size="19" fill="#18334c" font-weight="400">有限轮逼近两种约束</text><text x="950" y="799" font-size="19" fill="#18334c" font-weight="400">未证明所有联合统计完全相同</text><text x="950" y="828" font-size="19" fill="#18334c" font-weight="400">不重复加 / 减暗电平和DSC</text><text x="950" y="857" font-size="19" fill="#18334c" font-weight="400">未执行作者合成或训练代码</text><path d="M874,782 L925,782" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="947" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="981" font-size="24" fill="#18334c" font-weight="700">04  光子增益教学算例：区分Poisson均值x与RAW信号s=gx</text><rect x="53" y="1007" width="610" height="152" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="1039" font-size="23" fill="#17816c" font-weight="700">(s,Var) 两点为 (10,7)、(30,17)</text><text x="71" y="1072" font-size="19" fill="#18334c" font-weight="400">斜率 g=(17−7)/(30−10)=.5</text><text x="71" y="1101" font-size="19" fill="#18334c" font-weight="400">截距 σother²=2</text><text x="71" y="1130" font-size="19" fill="#18334c" font-weight="400">给干净信号s采 .5·Poisson(s/.5)</text><rect x="714" y="1007" width="621" height="152" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="1039" font-size="23" fill="#c36b24" font-weight="700">数据与假设边界</text><text x="732" y="1072" font-size="19" fill="#18334c" font-weight="400">暗帧统计仅来自一幅，保留其估计偏差</text><text x="732" y="1101" font-size="19" fill="#18334c" font-weight="400">近似平稳与ISO/温度稳定是适用条件</text><text x="732" y="1130" font-size="19" fill="#18334c" font-weight="400">随机样本变多，不等于新增独立真实测量</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>