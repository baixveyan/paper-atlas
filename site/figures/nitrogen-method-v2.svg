<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1270" viewBox="0 0 1400 1270" role="img" aria-labelledby="title desc"><title id="title">NitroGen ｜动作标注、单帧策略与16步流匹配求解</title><desc id="desc">依据主文 §2–3 与补充 §7–9、固定代码；坐标与速度图为教学算例，未控制游戏。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1270" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">NitroGen ｜动作标注、单帧策略与16步流匹配求解</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §2–3 与补充 §7–9、固定代码；坐标与速度图为教学算例，未控制游戏。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  标注器读取手柄叠层；策略观察必须遮住叠层</text><rect x="52" y="176" width="375" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="208" font-size="23" fill="#2376c5" font-weight="700">25采样帧 → 模板定位</text><text x="70" y="241" font-size="19" fill="#18334c" font-weight="400">SIFT/XFeat；至少20内点</text><text x="70" y="270" font-size="19" fill="#18334c" font-weight="400">相邻2帧 → SegFormer</text><text x="70" y="299" font-size="19" fill="#18334c" font-weight="400">11×11摇杆mask + 按钮</text><rect x="484" y="176" width="390" height="145" fill="#fff" stroke="#7750ad" rx="16"/><text x="502" y="208" font-size="23" fill="#7750ad" font-weight="700">整段轮廓 → 连续坐标</text><text x="502" y="241" font-size="19" fill="#18334c" font-weight="400">居中帧估中心，99分位缩放</text><text x="502" y="270" font-size="19" fill="#18334c" font-weight="400">教学(60,40)−(50,50)，尺度20</text><text x="502" y="299" font-size="19" fill="#18334c" font-weight="400">得到(.5,−.5)，轴方向另核验</text><rect x="932" y="176" width="405" height="145" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="208" font-size="23" fill="#17816c" font-weight="700">遮罩游戏图 + 动作标签</text><text x="950" y="241" font-size="19" fill="#18334c" font-weight="400">密度≥50%才保留该片段</text><text x="950" y="270" font-size="19" fill="#18334c" font-weight="400">8/16通过，7/16不通过（例）</text><text x="950" y="299" font-size="19" fill="#18334c" font-weight="400">过滤chunk长度不默认等于16</text><path d="M427,248 L477,248" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,248 L925,248" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="385" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  单帧256² → 256视觉token；16未来动作token通过cross-attention读取</text><rect x="53" y="445" width="610" height="147" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="477" font-size="23" fill="#2376c5" font-weight="700">游戏控制时间：16个未来时刻</text><text x="71" y="510" font-size="19" fill="#18334c" font-weight="400">主文16按钮+4摇杆轴 → 16×20</text><text x="71" y="539" font-size="19" fill="#18334c" font-weight="400">补充却写16×24，需核对checkpoint</text><text x="71" y="568" font-size="19" fill="#18334c" font-weight="400">动作self-attention逻辑矩阵16×16</text><rect x="714" y="445" width="621" height="147" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="477" font-size="23" fill="#c36b24" font-weight="700">流求解时间：同一块更新16次</text><text x="732" y="510" font-size="19" fill="#18334c" font-weight="400">cross-attention逻辑矩阵16×256</text><text x="732" y="539" font-size="19" fill="#18334c" font-weight="400">去噪一次不等于游戏前进一步</text><text x="732" y="568" font-size="19" fill="#18334c" font-weight="400">单帧无语言输入，不自动获得长期记忆</text><rect x="28" y="655" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  一维流匹配教学：a=.8，ε=−.4，目标速度a−ε=1.2</text><path d="M80,864 L592,864" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M80,864 L80,728" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M100,849 L565,747" stroke="#17816c" stroke-width="4" fill="none"/><circle cx="216.25" cy="823.5" r="7" fill="#c36b24"/><text x="110" y="897" font-size="19" fill="#18334c" font-weight="400">t=0：−.4</text><text x="447" y="897" font-size="19" fill="#18334c" font-weight="400">t=1：.8</text><text x="208" y="800" font-size="20" fill="#c36b24" font-weight="700">t=.25：−.1</text><rect x="714" y="715" width="621" height="177" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="747" font-size="23" fill="#17816c" font-weight="700">aₜ=(1−t)ε+ta，监督速度1.2</text><text x="732" y="780" font-size="19" fill="#18334c" font-weight="400">若预测1.0，该维平方误差.04</text><text x="732" y="809" font-size="19" fill="#18334c" font-weight="400">Euler每步dt=1/16，理想恒速每次+.075</text><text x="732" y="838" font-size="19" fill="#18334c" font-weight="400">从−.4累加16次 → .8</text><text x="732" y="867" font-size="19" fill="#18334c" font-weight="400">真实速度依赖状态；不是实测游戏轨迹</text><rect x="28" y="960" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="994" font-size="24" fill="#18334c" font-weight="700">04  连续采样后还原控制；评测与学习都有明确边界</text><rect x="53" y="1020" width="610" height="160" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="1052" font-size="23" fill="#7750ad" font-weight="700">固定tokenizer的解码规则</text><text x="71" y="1085" font-size="19" fill="#18334c" font-weight="400">摇杆 .75 → 2×.75−1=.5，随后裁切</text><text x="71" y="1114" font-size="19" fill="#18334c" font-weight="400">按钮 .5 → 0；.51 → 1（严格&gt;）</text><text x="71" y="1143" font-size="19" fill="#18334c" font-weight="400">布局按checkpoint核验，不按变量名猜</text><text x="71" y="1172" font-size="19" fill="#18334c" font-weight="400">自模仿：人工筛轨迹+原BC各50%</text><rect x="714" y="1020" width="621" height="160" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="1052" font-size="23" fill="#c36b24" font-weight="700">同步评估暂停环境等待动作</text><text x="732" y="1085" font-size="19" fill="#18334c" font-weight="400">16次求解不证明满足真实游戏时延</text><text x="732" y="1114" font-size="19" fill="#18334c" font-weight="400">单次动作块仍需执行/回读循环</text><text x="732" y="1143" font-size="19" fill="#18334c" font-weight="400">无模型/权重/游戏控制的本地运行</text><text x="732" y="1172" font-size="19" fill="#18334c" font-weight="400">非商业研究代码许可，视频权利另核验</text><text x="36" y="1247" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>