<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">3D-LATTE ｜反演噪声、注意力时序、掩码与几何引导</title><desc id="desc">依据主文 §3、Fig.2与式1–7；潜混合、导数和频率数字为教学例，非编辑资产实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">3D-LATTE ｜反演噪声、注意力时序、掩码与几何引导</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3、Fig.2与式1–7；潜混合、导数和频率数字为教学例，非编辑资产实验。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  源资产 → 多视图splat grids → VAE → DDPM反演与噪声轨迹</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">zₜ=√αₜ z₀ + √(1−αₜ) εₜ</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">ηₜ=(zₜ₋₁−μθ(zₜ,t))/σₜ</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">重放：μθ+σₜηₜ=zₜ₋₁</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">不能把独立采样εₜ与反求ηₜ混用</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">源p与目标p*从相同反演状态出发</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">Gi写C=12；物理属性列合计14需查通道映射</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">不是任意14属性直接当12通道输入</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">冻结基座权重，仍有多步前向与潜梯度</text><rect x="28" y="365" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  注意力：t从大到小；早期复制源结构，后期释放目标</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="457" font-size="23" fill="#17816c" font-weight="700">Cross：t≥τcross且CT词有匹配时复制源</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">共享teddy/bear等词保留主体关联</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">新增pink/tutu词保留目标自己的列</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">不匹配或t&lt;τcross：用目标列</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="457" font-size="23" fill="#2376c5" font-weight="700">Self：t≥τself用源，之后用目标</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">逻辑cross N×L，self N×N</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">词对齐、潜位置与原高斯非简单一一对应</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">注入太久可能限制几何变化</text><rect x="28" y="620" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="654" font-size="24" fill="#18334c" font-weight="700">03  原部位mask ∪ 新概念注意力mask → 同噪声时刻潜混合</text><text x="65" y="705" font-size="20" fill="#2376c5" font-weight="700">源</text><rect x="144" y="681" width="91" height="35" fill="#fff" stroke="#2376c5" rx="4"/><text x="177" y="706" font-size="20" fill="#2376c5" font-weight="700">1</text><rect x="249" y="681" width="91" height="35" fill="#fff" stroke="#2376c5" rx="4"/><text x="282" y="706" font-size="20" fill="#2376c5" font-weight="700">2</text><rect x="354" y="681" width="91" height="35" fill="#fff" stroke="#2376c5" rx="4"/><text x="387" y="706" font-size="20" fill="#2376c5" font-weight="700">3</text><rect x="459" y="681" width="91" height="35" fill="#fff" stroke="#2376c5" rx="4"/><text x="492" y="706" font-size="20" fill="#2376c5" font-weight="700">4</text><text x="65" y="749" font-size="20" fill="#7750ad" font-weight="700">编辑</text><rect x="144" y="725" width="91" height="35" fill="#fff" stroke="#7750ad" rx="4"/><text x="177" y="750" font-size="20" fill="#7750ad" font-weight="700">9</text><rect x="249" y="725" width="91" height="35" fill="#fff" stroke="#7750ad" rx="4"/><text x="282" y="750" font-size="20" fill="#7750ad" font-weight="700">8</text><rect x="354" y="725" width="91" height="35" fill="#fff" stroke="#7750ad" rx="4"/><text x="387" y="750" font-size="20" fill="#7750ad" font-weight="700">7</text><rect x="459" y="725" width="91" height="35" fill="#fff" stroke="#7750ad" rx="4"/><text x="492" y="750" font-size="20" fill="#7750ad" font-weight="700">6</text><text x="65" y="793" font-size="20" fill="#c36b24" font-weight="700">M</text><rect x="144" y="769" width="91" height="35" fill="#fff" stroke="#c36b24" rx="4"/><text x="177" y="794" font-size="20" fill="#c36b24" font-weight="700">0</text><rect x="249" y="769" width="91" height="35" fill="#fff" stroke="#c36b24" rx="4"/><text x="282" y="794" font-size="20" fill="#c36b24" font-weight="700">1</text><rect x="354" y="769" width="91" height="35" fill="#fff" stroke="#c36b24" rx="4"/><text x="387" y="794" font-size="20" fill="#c36b24" font-weight="700">1</text><rect x="459" y="769" width="91" height="35" fill="#fff" stroke="#c36b24" rx="4"/><text x="492" y="794" font-size="20" fill="#c36b24" font-weight="700">0</text><text x="65" y="837" font-size="20" fill="#17816c" font-weight="700">结果</text><rect x="144" y="813" width="91" height="35" fill="#fff" stroke="#17816c" rx="4"/><text x="177" y="838" font-size="20" fill="#17816c" font-weight="700">1</text><rect x="249" y="813" width="91" height="35" fill="#fff" stroke="#17816c" rx="4"/><text x="282" y="838" font-size="20" fill="#17816c" font-weight="700">8</text><rect x="354" y="813" width="91" height="35" fill="#fff" stroke="#17816c" rx="4"/><text x="387" y="838" font-size="20" fill="#17816c" font-weight="700">7</text><rect x="459" y="813" width="91" height="35" fill="#fff" stroke="#17816c" rx="4"/><text x="492" y="838" font-size="20" fill="#17816c" font-weight="700">4</text><rect x="650" y="680" width="687" height="158" fill="#fff" stroke="#17816c" rx="16"/><text x="668" y="712" font-size="23" fill="#17816c" font-weight="700">M=0：源zₜ₋₁；M=1：目标z*ₜ₋₁</text><text x="668" y="745" font-size="19" fill="#18334c" font-weight="400">外区不是直接塞无噪声z₀</text><text x="668" y="774" font-size="19" fill="#18334c" font-weight="400">GPT-4o部位 → 框/SAM2；也支持人工mask</text><text x="668" y="803" font-size="19" fill="#18334c" font-weight="400">注意力扩展让新衣物/形状有空间</text><text x="668" y="832" font-size="19" fill="#18334c" font-weight="400">mask跨时平均与潜分辨率对齐需实现核验</text><rect x="28" y="910" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="944" font-size="24" fill="#18334c" font-weight="700">04  正则防消失，频率调skip，末端增强还用2D扩散</text><rect x="53" y="970" width="610" height="173" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="1002" font-size="23" fill="#c36b24" font-weight="700">R=.8、γ=2、λ=1、o=.1教学例</text><text x="71" y="1035" font-size="19" fill="#18334c" font-weight="400">R exp(−γo)≈.65498；导数≈−1.30997</text><text x="71" y="1064" font-size="19" fill="#18334c" font-weight="400">下降增o，协方差trace亦趋增</text><text x="71" y="1093" font-size="19" fill="#18334c" font-weight="400">trace大不保证各方向尺度合理</text><text x="71" y="1122" font-size="19" fill="#18334c" font-weight="400">冻结VAE不等于阻断对潜变量的梯度</text><rect x="714" y="970" width="621" height="173" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="1002" font-size="23" fill="#7750ad" font-weight="700">频率教学sl=1.5、sh=1.2</text><text x="732" y="1035" font-size="19" fill="#18334c" font-weight="400">低/高幅度[2,1] → 早期[3,1]，后期[2,1.2]</text><text x="732" y="1064" font-size="19" fill="#18334c" font-weight="400">未选频段乘1，不是清零所有高频</text><text x="732" y="1093" font-size="19" fill="#18334c" font-weight="400">高分辨渲染→ControlNet-Tile→再优化3DGS</text><text x="732" y="1122" font-size="19" fill="#18334c" font-weight="400">未调用付费VLM、加载权重或生成资产</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>