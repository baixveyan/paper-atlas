<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1270" viewBox="0 0 1400 1270" role="img" aria-labelledby="title desc"><title id="title">HetCache ｜按累计漂移调度，再按 ROI 选择背景代表</title><desc id="desc">依据正文 §3.3、Fig.2、Algorithm1，PDF4–5；数值为教学例，未运行视频编辑模型。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1270" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">HetCache ｜按累计漂移调度，再按 ROI 选择背景代表</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据正文 §3.3、Fig.2、Algorithm1，PDF4–5；数值为教学例，未运行视频编辑模型。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  正文意图的时间轴：Δ=.10，完整/部分刷新后累计 D 清零</text><rect x="57" y="177" width="245" height="127" fill="#fff" stroke="#2376c5" rx="16"/><text x="75" y="209" font-size="23" fill="#2376c5" font-weight="700">完整初始化</text><text x="75" y="242" font-size="19" fill="#18334c" font-weight="400">首步无缓存</text><text x="75" y="271" font-size="19" fill="#18334c" font-weight="400">仍执行采样器状态更新</text><rect x="317" y="177" width="245" height="127" fill="#fff" stroke="#17816c" rx="16"/><text x="335" y="209" font-size="23" fill="#17816c" font-weight="700">复用</text><text x="335" y="242" font-size="19" fill="#18334c" font-weight="400">D=.04</text><text x="335" y="271" font-size="19" fill="#18334c" font-weight="400">仍执行采样器状态更新</text><rect x="577" y="177" width="245" height="127" fill="#fff" stroke="#17816c" rx="16"/><text x="595" y="209" font-size="23" fill="#17816c" font-weight="700">复用</text><text x="595" y="242" font-size="19" fill="#18334c" font-weight="400">D=.08</text><text x="595" y="271" font-size="19" fill="#18334c" font-weight="400">仍执行采样器状态更新</text><rect x="837" y="177" width="245" height="127" fill="#fff" stroke="#c36b24" rx="16"/><text x="855" y="209" font-size="23" fill="#c36b24" font-weight="700">部分</text><text x="855" y="242" font-size="19" fill="#18334c" font-weight="400">D=.13 → 0</text><text x="855" y="271" font-size="19" fill="#18334c" font-weight="400">仍执行采样器状态更新</text><rect x="1097" y="177" width="245" height="127" fill="#fff" stroke="#2376c5" rx="16"/><text x="1115" y="209" font-size="23" fill="#2376c5" font-weight="700">完整</text><text x="1115" y="242" font-size="19" fill="#18334c" font-weight="400">D=.16 → 0</text><text x="1115" y="271" font-size="19" fill="#18334c" font-weight="400">仍执行采样器状态更新</text><text x="62" y="340" font-size="20" fill="#18334c" font-weight="700">D≤Δ 复用；Δ&lt;D≤1.5Δ 部分；D&gt;1.5Δ 完整。该时间轴按正文解释，不冒充原伪代码执行。</text><rect x="28" y="385" width="1344" height="296" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  聚类内挑代表：不让一种背景语义独占全部预算</text><rect x="66" y="452" width="137" height="63" fill="#e7f6f1" stroke="#17816c" rx="16"/><text x="81" y="478" font-size="20" fill="#17816c" font-weight="400">a  α=0.9</text><text x="81" y="503" font-size="17" fill="#18334c" font-weight="400">保留</text><rect x="222" y="452" width="137" height="63" fill="#fff" stroke="#d9e3ec" rx="16"/><text x="237" y="478" font-size="20" fill="#18334c" font-weight="400">b  α=0.8</text><text x="237" y="503" font-size="17" fill="#18334c" font-weight="400">不重算</text><rect x="378" y="452" width="137" height="63" fill="#fff" stroke="#d9e3ec" rx="16"/><text x="393" y="478" font-size="20" fill="#18334c" font-weight="400">c  α=0.1</text><text x="393" y="503" font-size="17" fill="#18334c" font-weight="400">不重算</text><rect x="66" y="540" width="137" height="63" fill="#e7f6f1" stroke="#17816c" rx="16"/><text x="81" y="566" font-size="20" fill="#17816c" font-weight="400">d  α=0.4</text><text x="81" y="591" font-size="17" fill="#18334c" font-weight="400">保留</text><rect x="222" y="540" width="137" height="63" fill="#fff" stroke="#d9e3ec" rx="16"/><text x="237" y="566" font-size="20" fill="#18334c" font-weight="400">e  α=0.3</text><text x="237" y="591" font-size="17" fill="#18334c" font-weight="400">不重算</text><rect x="378" y="540" width="137" height="63" fill="#fff" stroke="#d9e3ec" rx="16"/><text x="393" y="566" font-size="20" fill="#18334c" font-weight="400">f  α=0.2</text><text x="393" y="591" font-size="17" fill="#18334c" font-weight="400">不重算</text><rect x="625" y="449" width="710" height="181" fill="#fff" stroke="#7750ad" rx="16"/><text x="643" y="481" font-size="23" fill="#7750ad" font-weight="700">rctx=1/3：每簇选 a 与 d</text><text x="643" y="514" font-size="19" fill="#18334c" font-weight="400">全局 top2 会选 a、b → 漏掉第二种背景</text><text x="643" y="543" font-size="19" fill="#18334c" font-weight="400">背景6 + 边缘2 + 生成2：总长10</text><text x="643" y="572" font-size="19" fill="#18334c" font-weight="400">部分：背景2 + 边缘2 + 生成2 → 总长6</text><text x="643" y="601" font-size="19" fill="#18334c" font-weight="400">注意力主项 100 → 36；不是时延实测</text><rect x="28" y="706" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="740" font-size="24" fill="#18334c" font-weight="700">03  保留全部生成 token ≠ 保留完整注意力数值</text><rect x="53" y="766" width="610" height="131" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="798" font-size="23" fill="#c36b24" font-weight="700">缩减背景会改变 softmax 分母</text><text x="71" y="831" font-size="19" fill="#18334c" font-weight="400">示例原权重 [.5,.3,.2]，删第三项</text><text x="71" y="860" font-size="19" fill="#18334c" font-weight="400">剩余归一化为 [.625,.375]</text><text x="71" y="889" font-size="19" fill="#18334c" font-weight="400">生成 query 没删，输出也通常改变</text><rect x="714" y="766" width="621" height="131" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="798" font-size="23" fill="#2376c5" font-weight="700">缓存输出必须有可合并的形状</text><text x="732" y="831" font-size="19" fill="#18334c" font-weight="400">EMA：(1−γ)旧 + γ新；10与14，γ=.25 → 11</text><text x="732" y="860" font-size="19" fill="#18334c" font-weight="400">X 行旧缓存与 X′ 行输出不能直接相加</text><text x="732" y="889" font-size="19" fill="#18334c" font-weight="400">scatter / 未选位置 / 逐层更新需实现核验</text><rect x="28" y="961" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="995" font-size="24" fill="#18334c" font-weight="700">04  原 Algorithm1 条件冲突：必须保留，不能当现成实现</text><rect x="53" y="1020" width="1282" height="158" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="1052" font-size="23" fill="#7750ad" font-weight="700">印刷 τreuse=1.5Δ，τpartial=Δ，先 if reuse，再 else-if partial</text><text x="71" y="1085" font-size="19" fill="#18334c" font-weight="400">缓存存在时 D≤Δ 已被 D≤1.5Δ 捕获 → 部分分支不可达</text><text x="71" y="1114" font-size="19" fill="#18334c" font-weight="400">首步缓存为空、D=0却可进依赖缓存的部分分支</text><text x="71" y="1143" font-size="19" fill="#18334c" font-weight="400">正文三范围与印刷伪代码不一致；本篇未审查作者真实实现，不生成伪复现承诺</text><text x="36" y="1247" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>