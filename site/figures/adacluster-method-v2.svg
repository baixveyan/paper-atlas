<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">AdaCluster ｜Q方向、K离群细分与簇上界筛选</title><desc id="desc">依据主文 §3、Fig.5与Algorithm1–3；聚类/上界/softmax数字为教学例，非视频生成测量。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">AdaCluster ｜Q方向、K离群细分与簇上界筛选</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3、Fig.5与Algorithm1–3；聚类/上界/softmax数字为教学例，非视频生成测量。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  Q方向用于候选；K须欧氏紧密；最终仍用原Q与真实KV</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">教学logits[1,0] → softmax[.731,.269]</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">Q正缩放2：logits[2,0] → [.881,.119]</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">排序不变，概率改变；不能把原Q范数删掉</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">实验Q固定65簇，零向量/重排规则需核验</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">|qᵀ(k−c)| ≤ ‖q‖‖k−c‖</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">K方向相同但范数1/10，分数仍可差10倍</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">簇半径越大，中心近似误差可能越大</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">这不是最终生成质量的统一误差界</text><rect x="28" y="365" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  K教学[0,.1,3]：中心.05、半径阈值.2，离群点继续增簇</text><path d="M95,526 L595,526" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><circle cx="120" cy="526" r="7" fill="#2376c5"/><text x="112" y="558" font-size="20" fill="#18334c" font-weight="400">0</text><circle cx="150" cy="526" r="7" fill="#2376c5"/><text x="142" y="558" font-size="20" fill="#18334c" font-weight="400">.1</text><circle cx="550" cy="526" r="7" fill="#2376c5"/><text x="542" y="558" font-size="20" fill="#18334c" font-weight="400">3</text><text x="83" y="451" font-size="20" fill="#2376c5" font-weight="700">前两点已紧密；3另加中心，不强塞宽簇</text><path d="M550 516 L550 472 L610 472" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><rect x="714" y="425" width="621" height="168" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">首步选每层簇数；后续固定数、更新中心</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">上一步中心作为当前初始化，不冻结分配</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">超过预算仍未解决 → 回退全注意力</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">实验约15%层回退；τ首步均距的1.5倍</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">数量/空簇/离群阈值与Nmax实现需查代码</text><rect x="28" y="640" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="674" font-size="24" fill="#18334c" font-weight="700">03  Quest簇极值上界不等于均值，也不等于对原K简单正负截断</text><rect x="53" y="700" width="610" height="172" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="732" font-size="23" fill="#17816c" font-weight="700">q=(1,1)，K={(2,0),(0,2)}</text><text x="71" y="765" font-size="19" fill="#18334c" font-weight="400">逐维最大(2,2) → 上界4</text><text x="71" y="794" font-size="19" fill="#18334c" font-weight="400">两个真实成员分数均2，上界可以较松</text><text x="71" y="823" font-size="19" fill="#18334c" font-weight="400">U=q+ᵀmax(K)+q−ᵀmin(K)</text><text x="71" y="852" font-size="19" fill="#18334c" font-weight="400">簇内规约是必要步骤，不是自动出现</text><rect x="714" y="700" width="621" height="172" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="732" font-size="23" fill="#7750ad" font-weight="700">单维q=1，K={−2,−1}</text><text x="732" y="765" font-size="19" fill="#18334c" font-weight="400">Quest上界−1；截K正部却得0</text><text x="732" y="794" font-size="19" fill="#18334c" font-weight="400">Algorithm2/3没展开完整簇摘要/索引使用</text><text x="732" y="823" font-size="19" fill="#18334c" font-weight="400">不能以等价一句替代kernel核查</text><text x="732" y="852" font-size="19" fill="#18334c" font-weight="400">只是阅读核对，未写入作者代码修补</text><rect x="28" y="915" width="1344" height="275" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="949" font-size="24" fill="#18334c" font-weight="700">04  top-K簇要展开真实KV，再重新归一化，误差仍需评估</text><rect x="53" y="975" width="610" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="1007" font-size="23" fill="#c36b24" font-weight="700">logits[1,0]、V=[0,10]教学</text><text x="71" y="1040" font-size="19" fill="#18334c" font-weight="400">完整注意力输出约2.68941</text><text x="71" y="1069" font-size="19" fill="#18334c" font-weight="400">只保留首token → softmax单项1 → 输出0</text><text x="71" y="1098" font-size="19" fill="#18334c" font-weight="400">低分被删不等于质量为0</text><text x="71" y="1127" font-size="19" fill="#18334c" font-weight="400">簇大小不等，top-K簇不是固定K个token</text><rect x="714" y="975" width="621" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="1007" font-size="23" fill="#2376c5" font-weight="700">冻结模型不代表生成只做一次注意力</text><text x="732" y="1040" font-size="19" fill="#18334c" font-weight="400">聚类/重排/筛选/回退均有开销</text><text x="732" y="1069" font-size="19" fill="#18334c" font-weight="400">首步统计不保证后面任意分布都紧密</text><text x="732" y="1098" font-size="19" fill="#18334c" font-weight="400">算子速度与端到端生成速度必须分开</text><text x="732" y="1127" font-size="19" fill="#18334c" font-weight="400">未运行GPU kernel、模型或生成视频</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>