<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">BoT ｜三轴权重小波、Haar幅度与双向初始化边界</title><desc id="desc">依据主文 §3、Fig.2与式1–4；尺寸/系数/能量/排列均为教学例，非作者模型权重。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1230" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">BoT ｜三轴权重小波、Haar幅度与双向初始化边界</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3、Fig.2与式1–4；尺寸/系数/能量/排列均为教学例，非作者模型权重。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  每种线性权重各自按层堆叠：L × din × dout，不变换训练数据</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">教学QKV：(12,768,2304)</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">三轴各减半 → (6,384,1152)</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">Wo / FFN按自身矩阵尺寸另行处理</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">QKV排列、head和out/in存储顺序要核验</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">3D-DWT：每轴L/H，共8子带</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">LLL为cA，其余7种组合为细节</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">全子带保留才可重建原张量</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">参数频率不是图像纹理的物理频率</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  正交Haar教学2×2×2立方体放0…7：cA=28/√8≈9.899495</text><rect x="52" y="425" width="375" height="172" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="457" font-size="23" fill="#2376c5" font-weight="700">L2S：只留cA</text><text x="70" y="490" font-size="19" fill="#18334c" font-weight="400">小目标值9.899495</text><text x="70" y="519" font-size="19" fill="#18334c" font-weight="400">不是八项平均3.5</text><text x="70" y="548" font-size="19" fill="#18334c" font-weight="400">原平方和140，cA²=98</text><text x="70" y="577" font-size="19" fill="#18334c" font-weight="400">细节能量42被丢掉</text><rect x="484" y="425" width="390" height="172" fill="#fff" stroke="#c36b24" rx="16"/><text x="502" y="457" font-size="23" fill="#c36b24" font-weight="700">零细节再IDWT</text><text x="502" y="490" font-size="19" fill="#18334c" font-weight="400">大立方体每项3.5</text><text x="502" y="519" font-size="19" fill="#18334c" font-weight="400">小系数除√8分回八项</text><text x="502" y="548" font-size="19" fill="#18334c" font-weight="400">无法恢复原0…7差异</text><text x="502" y="577" font-size="19" fill="#18334c" font-weight="400">这是低通投影，不是精确逆</text><rect x="932" y="425" width="405" height="172" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="457" font-size="23" fill="#17816c" font-weight="700">若保留全部8子带</text><text x="950" y="490" font-size="19" fill="#18334c" font-weight="400">逆变换恢复原0…7</text><text x="950" y="519" font-size="19" fill="#18334c" font-weight="400">Haar系数平方和=140</text><text x="950" y="548" font-size="19" fill="#18334c" font-weight="400">双正交小波不直接照搬此范数等式</text><text x="950" y="577" font-size="19" fill="#18334c" font-weight="400">示例不是作者默认小波</text><rect x="28" y="645" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  S2L：小权重作cA，7细节全0；不是把原值复制八遍</text><rect x="53" y="705" width="610" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="737" font-size="23" fill="#17816c" font-weight="700">小源1 → 大目标每项1/√8≈.353553</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">匹配规则下再DWT取LLL → 1</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">大→小→大通常有损；小→大→小可一致</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">两种参数往返都不证明网络函数保持</text><rect x="714" y="705" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="737" font-size="23" fill="#7750ad" font-weight="700">统一倍率与边界是必要实现条件</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">深度减半、宽度变3/4不能一层自动匹配</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">奇数长度/长滤波/不同轴层级需规则</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">bias/LN/embedding等未覆盖参数需逐项登记</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  坐标排列影响低频；无额外映射训练仍需后续训练</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="987" font-size="23" fill="#c36b24" font-weight="700">一维Haar教学</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">[1,1,−1,−1] → [√2,−√2]</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">[1,−1,1,−1] → [0,0]</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">配对改变，低频就变；函数等价需邻层补偿</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">不能把频谱当与参数排列无关的知识</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="987" font-size="23" fill="#2376c5" font-weight="700">固定源 → 变换 → 拆层 → 训练目标</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">迁移算子不学习，不是目标不用训练</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">节省率需同目标性能并单列源成本</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">初始化内存/全模型未迁移参数不可省略</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未改真实checkpoint或运行预训练</text><text x="36" y="1207" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>