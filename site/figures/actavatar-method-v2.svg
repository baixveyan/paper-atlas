<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">ActAvatar ｜阶段软注意力、层深音频与两阶段训练</title><desc id="desc">依据主文 §3–4、Fig.2与式1–11；时间窗、注意力与flow数值为教学例，非数字人实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ActAvatar ｜阶段软注意力、层深音频与两阶段训练</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3–4、Fig.2与式1–11；时间窗、注意力与flow数值为教学例，非数字人实验。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  视频f、flow时间t、DiT层ℓ是三条不同轴</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">5秒视频的动作窗教学</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">0–2秒张掌 → 归一化[0,.4]</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">2–4秒下指 → [.4,.8]</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">主文秒数/归一化并用，实际编码待核验</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">PACA：阶段token加零初始化ek</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">Q来自视频；K/V来自阶段文本</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">逻辑注意力N×M，没有时间窗硬mask</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">logits[2,0] → [.8808,.1192]，非[1,0]</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  音频系数 (ℓ/30)^1.5：按网络深度，不是按视频后半段</text><rect x="70" y="550.3914193805498" width="110" height="0.6085806194501845" fill="#17816c" stroke="#fff" rx="3"/><text x="70" y="587" font-size="20" fill="#18334c" font-weight="400">层1</text><text x="70" y="437" font-size="21" fill="#17816c" font-weight="700">0.00609</text><rect x="250" y="515.6446609406726" width="110" height="35.35533905932738" fill="#17816c" stroke="#fff" rx="3"/><text x="250" y="587" font-size="20" fill="#18334c" font-weight="400">层15</text><text x="250" y="437" font-size="21" fill="#17816c" font-weight="700">0.35355</text><rect x="430" y="451.0" width="110" height="100.0" fill="#17816c" stroke="#fff" rx="3"/><text x="430" y="587" font-size="20" fill="#18334c" font-weight="400">层30</text><text x="430" y="437" font-size="21" fill="#17816c" font-weight="700">1.00000</text><rect x="714" y="425" width="621" height="157" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="457" font-size="23" fill="#17816c" font-weight="700">残差为2的层15：实际加约.70711</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">浅层音频没完全关掉；末层系数1</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">系数≤1，逐层增强≠比未缩放音频都放大</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">每个采样步仍经过30层</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">实际残差不同，不能只凭系数比较范数</text><rect x="28" y="645" width="1344" height="240" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  两阶段更新范围不同：音频先学，阶段动作再全量适配</text><rect x="53" y="705" width="610" height="144" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="737" font-size="23" fill="#2376c5" font-weight="700">阶段1：500K说话视频、20K步</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">简短caption与音频</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">只训audio adapter，冻结base</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">适配器投影到帧对齐token后cross-attend</text><rect x="714" y="705" width="621" height="144" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="737" font-size="23" fill="#c36b24" font-weight="700">阶段2：100K动作样本、14K步</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">注入已训练适配器，使用结构化阶段文本</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">更新base + audio + PACA</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">不把阶段1冻结策略沿用到阶段2</text><rect x="28" y="910" width="1344" height="275" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="944" font-size="24" fill="#18334c" font-weight="700">04  flow定义是数据x₀→噪声x₁；生成沿t=1→0反向走</text><rect x="53" y="970" width="610" height="169" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="1002" font-size="23" fill="#7750ad" font-weight="700">x₀=.8、x₁=−.4教学例</text><text x="71" y="1035" font-size="19" fill="#18334c" font-weight="400">xₜ=(1−t)x₀+tx₁；t=.25 → .5</text><text x="71" y="1064" font-size="19" fill="#18334c" font-weight="400">目标v=x₁−x₀=−1.2</text><text x="71" y="1093" font-size="19" fill="#18334c" font-weight="400">从噪声−.4开始，dt=−1/40</text><text x="71" y="1122" font-size="19" fill="#18334c" font-weight="400">理想恒速每次+.03，40步回.8</text><rect x="714" y="970" width="621" height="169" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="1002" font-size="23" fill="#2376c5" font-weight="700">原实验输出与边界</text><text x="732" y="1035" font-size="19" fill="#18334c" font-weight="400">125帧/25fps，704×1280，40采样步</text><text x="732" y="1064" font-size="19" fill="#18334c" font-weight="400">文本/音频CFG均5，完整分支需代码核验</text><text x="732" y="1093" font-size="19" fill="#18334c" font-weight="400">单H20约16分钟/5秒视频，非实时</text><text x="732" y="1122" font-size="19" fill="#18334c" font-weight="400">未训练、生成或调用MLLM/评委</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>