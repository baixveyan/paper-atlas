<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">GAI-GS ｜条件高斯、角度几何与双因子信号累积</title><desc id="desc">依据主文 §4–5、Fig.1–3与式10–16；角度/信号/相位为教学例，非真实无线测量。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1230" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">GAI-GS ｜条件高斯、角度几何与双因子信号累积</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §4–5、Fig.1–3与式10–16；角度/信号/相位为教学例，非真实无线测量。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  发射机TX改变属性；接收机RX决定角度投影，二者不能混淆</text><rect x="52" y="175" width="375" height="140" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="207" font-size="23" fill="#2376c5" font-weight="700">场景N个高斯</text><text x="70" y="240" font-size="19" fill="#18334c" font-weight="400">top-M不透明度锚点 → GATr</text><text x="70" y="269" font-size="19" fill="#18334c" font-weight="400">CLS广播至全部N个高斯</text><text x="70" y="298" font-size="19" fill="#18334c" font-weight="400">M²注意力不等于整体零N成本</text><rect x="484" y="175" width="390" height="140" fill="#fff" stroke="#7750ad" rx="16"/><text x="502" y="207" font-size="23" fill="#7750ad" font-weight="700">位置编码 + CLS → 双MLP</text><text x="502" y="240" font-size="19" fill="#18334c" font-weight="400">衰减网络先输出δ与中间f</text><text x="502" y="269" font-size="19" fill="#18334c" font-weight="400">信号网络还读取f与TX条件</text><text x="502" y="298" font-size="19" fill="#18334c" font-weight="400">残差头改旋转/尺度/SH/opacity</text><rect x="932" y="175" width="405" height="140" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="207" font-size="23" fill="#17816c" font-weight="700">按RX渲染角度功率图</text><text x="950" y="240" font-size="19" fill="#18334c" font-weight="400">RX相对方位λ与俯仰φ</text><text x="950" y="269" font-size="19" fill="#18334c" font-weight="400">Mercator → tile复制/深度排序</text><text x="950" y="298" font-size="19" fill="#18334c" font-weight="400">频谱后可再汇聚RSSI</text><path d="M427,244 L477,244" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,244 L925,244" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="365" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  v/a = log tan(π/4+φ/2)：纵坐标非线性拉伸</text><rect x="90" y="560" width="100" height="1" fill="#2376c5" stroke="#fff" rx="2"/><text x="90" y="594" font-size="21" fill="#18334c" font-weight="400">0°</text><text x="90" y="441" font-size="20" fill="#2376c5" font-weight="700">0.000000</text><rect x="270" y="510.56246" width="100" height="49.43754" fill="#2376c5" stroke="#fff" rx="2"/><text x="270" y="594" font-size="21" fill="#18334c" font-weight="400">30°</text><text x="270" y="441" font-size="20" fill="#2376c5" font-weight="700">0.549306</text><rect x="450" y="441.47378" width="100" height="118.52622000000001" fill="#2376c5" stroke="#fff" rx="2"/><text x="450" y="594" font-size="21" fill="#18334c" font-weight="400">60°</text><text x="450" y="441" font-size="20" fill="#2376c5" font-weight="700">1.316958</text><rect x="714" y="425" width="621" height="168" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">dv/dφ=a/cosφ，极区发散</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">三角函数用弧度；范围/接缝需处理</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">局部保角 ≠ 整个宽高斯精确不变形</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">中心公式不含全部协方差传播细节</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">缩放a和不透明度α是不同变量</text><rect x="28" y="640" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="674" font-size="24" fill="#18334c" font-weight="700">03  教学两高斯：ξ=[10,6]，α=[.2,.3]，第一项δ=.8</text><rect x="53" y="700" width="610" height="175" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="732" font-size="23" fill="#17816c" font-weight="700">T1=1；贡献1 = 10×.2 = 2</text><text x="71" y="765" font-size="19" fill="#18334c" font-weight="400">T2 = 1×δ1×(1−α1)=.64</text><text x="71" y="794" font-size="19" fill="#18334c" font-weight="400">贡献2 = 6×.3×.64 = 1.152</text><text x="71" y="823" font-size="19" fill="#18334c" font-weight="400">总R=3.152；忘记δ会得到3.44</text><text x="71" y="852" font-size="19" fill="#18334c" font-weight="400">递推T避免重复计算前缀连乘</text><rect x="714" y="700" width="621" height="175" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="732" font-size="23" fill="#7750ad" font-weight="700">L2约束dattn，不是硬范围保证</text><text x="732" y="765" font-size="19" fill="#18334c" font-weight="400">有效opacity=基础α + dattn残差</text><text x="732" y="794" font-size="19" fill="#18334c" font-weight="400">L2直接梯度2γd，把修正拉向0</text><text x="732" y="823" font-size="19" fill="#18334c" font-weight="400">正尺度/旋转合法性/alpha边界需查实现</text><text x="732" y="852" font-size="19" fill="#18334c" font-weight="400">δ与(1−α)两套因子不能随意合并</text><rect x="28" y="910" width="1344" height="275" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="944" font-size="24" fill="#18334c" font-weight="700">04  相位与物理解释：标量功率图不是完整电磁路径求解器</text><rect x="53" y="970" width="610" height="172" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="1002" font-size="23" fill="#2376c5" font-weight="700">两路各幅度1的独立教学反例</text><text x="71" y="1035" font-size="19" fill="#18334c" font-weight="400">相位同向 → 幅度2、功率4</text><text x="71" y="1064" font-size="19" fill="#18334c" font-weight="400">相位相反 → 幅度0、功率0</text><text x="71" y="1093" font-size="19" fill="#18334c" font-weight="400">直接两路功率相加却都是2</text><text x="71" y="1122" font-size="19" fill="#18334c" font-weight="400">RSSI/功率拟合好不证明恢复全部相位</text><rect x="714" y="970" width="621" height="172" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="1002" font-size="23" fill="#c36b24" font-weight="700">频谱训练：MAE + SSIM + 残差L2</text><text x="732" y="1035" font-size="19" fill="#18334c" font-weight="400">GA基签名和注意力夹心解释需核验</text><text x="732" y="1064" font-size="19" fill="#18334c" font-weight="400">多径算子有顺序，不能交换乘积</text><text x="732" y="1093" font-size="19" fill="#18334c" font-weight="400">原文17.37ms总推理 / .91ms渲染</text><text x="732" y="1122" font-size="19" fill="#18334c" font-weight="400">未训练、采集无线数据或运行模型</text><text x="36" y="1207" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>