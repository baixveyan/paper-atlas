<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">AceTone ｜颜色查表、64索引与分阶段生成训练</title><desc id="desc">依据主文 §2–3 Fig.2 与固定提交代码；插值/奖励数字为教学例，未加载权重或调图实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">AceTone ｜颜色查表、64索引与分阶段生成训练</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §2–3 Fig.2 与固定提交代码；插值/奖励数字为教学例，未加载权重或调图实验。</text><rect x="28" y="115" width="1344" height="305" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  颜色立方体：每个格点存RGB输出，不是图像中的空间位置</text><path d="M80,211 L300,211" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M80,211 L80,351" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M80,351 L300,351" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M300,211 L300,351" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M80,211 L165,164" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M300,211 L385,164" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M80,351 L165,304" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M300,351 L385,304" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M165,164 L385,164" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M385,164 L385,304" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M165,164 L165,304" stroke="#8da7bc" fill="none" stroke-width="2"/><path d="M165,304 L385,304" stroke="#8da7bc" fill="none" stroke-width="2"/><circle cx="235" cy="264" r="9" fill="#17816c"/><text x="95" y="393" font-size="20" fill="#2376c5" font-weight="700">同一输入RGB → 同一LUT输出</text><rect x="468" y="176" width="870" height="192" fill="#fff" stroke="#2376c5" rx="16"/><text x="486" y="208" font-size="23" fill="#2376c5" font-weight="700">像素 x=(.2,.4,.6)，32网格坐标31x=(6.2,12.4,18.6)</text><text x="486" y="241" font-size="19" fill="#18334c" font-weight="400">下角(6,12,18)，小数(.2,.4,.6) → 八角三线性权重</text><text x="486" y="270" font-size="19" fill="#18334c" font-weight="400">若存 f(r,g,b)=(.8r+.1,.9g,.7b+.2)</text><text x="486" y="299" font-size="19" fill="#18334c" font-weight="400">插值得(.26,.36,.62)，位置不变、颜色改变</text><text x="486" y="328" font-size="19" fill="#18334c" font-weight="400">该仿射函数是教学例；RGB/BGR与gamma必须按实际实现核对</text><rect x="28" y="445" width="1344" height="235" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="479" font-size="24" fill="#18334c" font-weight="700">02  LUT → 连续潜变量 → 64个整数 → 码本向量 → LUT</text><rect x="52" y="505" width="375" height="136" fill="#fff" stroke="#7750ad" rx="16"/><text x="70" y="537" font-size="23" fill="#7750ad" font-weight="700">3×32³ → D×4³</text><text x="70" y="570" font-size="19" fill="#18334c" font-weight="400">卷积32→16→8→4</text><text x="70" y="599" font-size="19" fill="#18334c" font-weight="400">D默认64是码字维数，不是K</text><text x="70" y="628" font-size="19" fill="#18334c" font-weight="400">K=256是可选索引总数</text><rect x="484" y="505" width="390" height="136" fill="#fff" stroke="#2376c5" rx="16"/><text x="502" y="537" font-size="23" fill="#2376c5" font-weight="700">64索引，取值0…255</text><text x="502" y="570" font-size="19" fill="#18334c" font-weight="400">每个索引可紧凑打包8bit</text><text x="502" y="599" font-size="19" fill="#18334c" font-weight="400">不等于64个RGB颜色</text><text x="502" y="628" font-size="19" fill="#18334c" font-weight="400">码本EMA，编码梯度用直通</text><rect x="932" y="505" width="405" height="136" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="537" font-size="23" fill="#17816c" font-weight="700">查表 → 三层上采样</text><text x="950" y="570" font-size="19" fill="#18334c" font-weight="400">还原3×32×32×32</text><text x="950" y="599" font-size="19" fill="#18334c" font-weight="400">Sigmoid保范围，不保证可逆</text><text x="950" y="628" font-size="19" fill="#18334c" font-weight="400">64字节不包含VLM/码本/缓存</text><path d="M427,573 L477,573" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,573 L925,573" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="705" width="1344" height="235" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="739" font-size="24" fill="#18334c" font-weight="700">03  相同输出格式，不同阶段可见的信息不同</text><rect x="52" y="765" width="375" height="135" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="797" font-size="23" fill="#2376c5" font-weight="700">预训练</text><text x="70" y="830" font-size="19" fill="#18334c" font-weight="400">原图 I + 调后目标 L(I)</text><text x="70" y="859" font-size="19" fill="#18334c" font-weight="400">学习图像对对应的64索引</text><text x="70" y="888" font-size="19" fill="#18334c" font-weight="400">不能照搬成部署输入</text><rect x="484" y="765" width="390" height="135" fill="#fff" stroke="#17816c" rx="16"/><text x="502" y="797" font-size="23" fill="#17816c" font-weight="700">SFT / 实际任务</text><text x="502" y="830" font-size="19" fill="#18334c" font-weight="400">PST：查询 + 其他内容参考图</text><text x="502" y="859" font-size="19" fill="#18334c" font-weight="400">IGG：查询 + 文字指令</text><text x="502" y="888" font-size="19" fill="#18334c" font-weight="400">不需要用户提交目标结果图</text><rect x="932" y="765" width="405" height="135" fill="#fff" stroke="#c36b24" rx="16"/><text x="950" y="797" font-size="23" fill="#c36b24" font-weight="700">RL训练</text><text x="950" y="830" font-size="19" fill="#18334c" font-weight="400">采G个候选，调图后给奖励</text><text x="950" y="859" font-size="19" fill="#18334c" font-weight="400">颜色奖励使用训练目标Igt</text><text x="950" y="888" font-size="19" fill="#18334c" font-weight="400">部署不再在线调用奖励模型</text><rect x="28" y="965" width="1344" height="240" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="999" font-size="24" fill="#18334c" font-weight="700">04  颜色奖励在ΔE≤2饱和；组内优势推动相对更好的序列</text><rect x="65" y="1038" width="81" height="110" fill="#17816c" stroke="#fff" rx="4"/><text x="65" y="1172" font-size="18" fill="#18334c" font-weight="400">ΔE=1</text><text x="65" y="1027" font-size="18" fill="#17816c" font-weight="700">1</text><rect x="192" y="1038" width="81" height="110" fill="#17816c" stroke="#fff" rx="4"/><text x="192" y="1172" font-size="18" fill="#18334c" font-weight="400">ΔE=2</text><text x="192" y="1027" font-size="18" fill="#17816c" font-weight="700">1</text><rect x="319" y="1038" width="81" height="55.0" fill="#17816c" stroke="#fff" rx="4"/><text x="319" y="1172" font-size="18" fill="#18334c" font-weight="400">ΔE=3</text><text x="319" y="1027" font-size="18" fill="#17816c" font-weight="700">0.5</text><rect x="446" y="1038" width="81" height="27.5" fill="#17816c" stroke="#fff" rx="4"/><text x="446" y="1172" font-size="18" fill="#18334c" font-weight="400">ΔE=5</text><text x="446" y="1027" font-size="18" fill="#17816c" font-weight="700">0.25</text><rect x="635" y="1025" width="703" height="143" fill="#fff" stroke="#7750ad" rx="16"/><text x="653" y="1057" font-size="23" fill="#7750ad" font-weight="700">r = 1/(max(2,ΔE)−1) + 审美/5</text><text x="653" y="1090" font-size="19" fill="#18334c" font-weight="400">(ΔE,审美)=(1,2),(3,3),(5,4)</text><text x="653" y="1119" font-size="19" fill="#18334c" font-weight="400">奖励=1.4,1.1,1.05；第一项相对优势正</text><text x="653" y="1148" font-size="19" fill="#18334c" font-weight="400">审美最高者也可能因颜色偏差被抑制</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>