<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">ACE-Merging ｜列Gram、分支ridge与右侧矩阵求解</title><desc id="desc">依据PDF2–6 式2–19、Algorithm1；低维矩阵和谱数字均为教学例，非checkpoint实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ACE-Merging ｜列Gram、分支ridge与右侧矩阵求解</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF2–6 式2–19、Algorithm1；低维矩阵和谱数字均为教学例，非checkpoint实验。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  同基座层ΔWt=dout×din；按输出维去均值，UᵀU为din×din</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">理论：WΣ_t匹配专家，实际用参数代理</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">单样本gᵀg=4||e||²xxᵀ，需残差解耦</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">累积ΔW的Gram另含跨步项，非精确Σ</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">每列去均值，不是每行；原能量另算</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="207" font-size="23" fill="#c36b24" font-weight="700">γ=Var(log原能量)/Mean(log原能量)²</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">教学总体方差，能量2/8 → γ=.25 &lt; .3</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">整体位移×.5 → log均值0，需异常处理</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">同向所有输出行可能中心化为0，trace须查</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  高异质B=G/TrG，R=B+ε/TrG·I；低异质B=G，R=G+εI</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="457" font-size="23" fill="#7750ad" font-weight="700">CSP从ΣB的平均行广播：C=1cᵀ</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">高异质再除原位移平均能量</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">教学ΣB=diag(2,8) → C=[[1,4],[1,4]]</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">C非对称；z=(2,−1)时zᵀCz=−2</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="457" font-size="23" fill="#17816c" font-weight="700">P=(ΣUR)(ΣR+C)⁻¹</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">求解DᵀPᵀ=Nᵀ，检查PD−N残差</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">不是D⁻¹N，不强行用对称Cholesky</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">原文输出何处加W0不清，先核接口再落盘</text><rect x="28" y="615" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  两任务2×2教学：中心化位移[[1,0],[−1,0]]和[[0,2],[0,−2]]</text><rect x="53" y="675" width="610" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="707" font-size="23" fill="#2376c5" font-weight="700">教学ε=.1（非论文默认），γ=.25</text><text x="71" y="740" font-size="19" fill="#18334c" font-weight="400">G1=diag(2,0)，G2=diag(0,8)</text><text x="71" y="769" font-size="19" fill="#18334c" font-weight="400">D=[[3.2,4],[1,12.2]]</text><text x="71" y="798" font-size="19" fill="#18334c" font-weight="400">N首行=[2.1,16.2]，次行反号</text><text x="71" y="827" font-size="19" fill="#18334c" font-weight="400">解P首行≈[.2688356,1.2397260]</text><rect x="714" y="675" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="707" font-size="23" fill="#c36b24" font-weight="700">高异质残差用原ΔW，不用U</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">Δres=ΣΔWt(Bt−平均R)</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">对P+Δres做SVD，再构造均值奇异值低秩项</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">最后返回P+Δrefine，不是直接替换全部谱</text><text x="732" y="827" font-size="19" fill="#18334c" font-weight="400">教学diag(10,1)、k2 → diag(15.5,6.5)</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  所有运算离线、无样本训练，但宽层Gram/求解/SVD仍有成本</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="987" font-size="23" fill="#17816c" font-weight="700">4096²单份float32矩阵64MiB</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">多任务中间矩阵/工作区另计</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">Gram约T·dout·din²，稠密求解约din³</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">bias/头/非二维参数处理主文未列全</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">零trace/log0/k取整等边界待代码核查</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="987" font-size="23" fill="#7750ad" font-weight="700">保留原Fig.2作谱分析证据</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">谱方向近似保持，不证明语义正确</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">闭式局部解≠完整非线性网络全局最优</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">独立低维验算，不是模型合并实验</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未读取、覆盖或推送任何模型权重</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>