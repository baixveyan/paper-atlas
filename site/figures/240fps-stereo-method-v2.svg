<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">240FPS Stereo ｜积分解混、极线交互与时间融合</title><desc id="desc">依据PDF2–6 Fig.2–5、式1–8；LS/softmax数值为教学例，非硬件采集或性能实测。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">240FPS Stereo ｜积分解混、极线交互与时间融合</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF2–6 Fig.2–5、式1–8；LS/softmax数值为教学例，非硬件采集或性能实测。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  单传感器叠加两光路：I_mix(t)=I_L+f(t)I_R，调制只在右路</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">每触发间隔：Q≈α(I_L Δt + I_R F)</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">Q=α=1教学：.5I_L=1</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">第二式.25I_L+.125I_R=1 → (2,4)</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">短窗内两路近似恒定，非任意高速运动均成立</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="207" font-size="23" fill="#c36b24" font-weight="700">每行A=α[Δt,F]，解2×2 ridge</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">(AᵀA+λI)x=Aᵀb，作者λ=.001</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">若所有F/Δt相同，仍无法区分左右</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">正则可逆不创造观测；采样秩必须检查</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  ABC整周期统计校亮度 → CBA极线跨视图去残影</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="457" font-size="23" fill="#17816c" font-weight="700">M_t=Q/Tf × 一周期内脉冲个数</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">M仍是混合统计，不是任一路干净图</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">左右与M的通道均值/std → 两层1×1</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">预测γ/β作特征仿射，不直接套固定AdaIN</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="457" font-size="23" fill="#7750ad" font-weight="700">CBA：同极线左Query读取右K/V</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">每行w×w attention，左右可互补</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">不是同坐标逐像素相加，需要光路标定</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">重复纹理/遮挡仍会带入错误对应</text><rect x="28" y="615" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  RSF先对齐历史，再在每个空间点的ℓ帧时间轴softmax</text><rect x="53" y="675" width="610" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="707" font-size="23" fill="#2376c5" font-weight="700">历史S → DeformConv(Δ,m) → 对齐S</text><text x="71" y="740" font-size="19" fill="#18334c" font-weight="400">Δ/m是网络偏移/调制，不是LCD的f(t)</text><text x="71" y="769" font-size="19" fill="#18334c" font-weight="400">当前Query 1×d，历史K/V ℓ×d</text><text x="71" y="798" font-size="19" fill="#18334c" font-weight="400">每像素权重1×ℓ，不是(hw)×(hw)</text><text x="71" y="827" font-size="19" fill="#18334c" font-weight="400">GTA+当前特征 → ECA → 左右SCAM</text><rect x="714" y="675" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="707" font-size="23" fill="#c36b24" font-weight="700">教学d1：logits[0,ln3]，V=[2,6]</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">softmax=[.25,.75] → 加权值5</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">错误对齐也会融合出错纹理</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">push当前state，pop最旧，shared decoder</text><text x="732" y="827" font-size="19" fill="#18334c" font-weight="400">空历史/截断反传/精确队列配置主文未给全</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  60Hz周期约16.67ms，4对输出位置间隔4.17ms ≠ 总延迟</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="987" font-size="23" fill="#17816c" font-weight="700">SMS-Net训练左右L1，无额外深度损失</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">已知粗解/M作为输入，优化网络参数</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">后接DEFOM/CRE冻结，仅评视差/深度</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">40kHz读出不等于像素同频率触发</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">未运行网络、估计器或采集实拍数据</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="987" font-size="23" fill="#7750ad" font-weight="700">作者CPU构造.093s、求解.0151s</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">远大于4.17ms，尚未计网络与搬运</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">短窗脉冲少/秩弱，长窗运动误差大</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">GTA约ℓhwd，极线约hw²d；另计网络</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">240FPS指输出采样，非已测实时吞吐</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>