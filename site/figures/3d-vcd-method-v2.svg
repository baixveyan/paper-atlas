<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">3D-VCD ｜图 / 提示扰动、双路缓存与相对logit证据</title><desc id="desc">依据主文 §3–4、Fig.2与式1–5；表格与概率为独立教学例，未运行模型问答。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">3D-VCD ｜图 / 提示扰动、双路缓存与相对logit证据</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3–4、Fig.2与式1–5；表格与概率为独立教学例，未运行模型问答。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  两种负上下文：3D-POPE改图；HEAL保持图、改任务提示</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">3D-POPE：对象ID + 类别 + 中心/尺寸</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">中心3+尺寸3；语义替换、几何高斯噪声</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">低/高σ=.05/.20米；默认低语义+低几何</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">尺寸合法性、随机种子与实现需核验</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">HEAL：固定G，干净任务x与对抗任务x̂</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">离散状态/关系，不统一塞进N×6数组</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">加入干扰、同义替换或任务矛盾</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">两路任务改变，也会混入任务差异</text><rect x="28" y="365" width="1344" height="240" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  每个token用共同前缀，两套独立上下文 / KV缓存</text><rect x="52" y="425" width="375" height="140" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="457" font-size="23" fill="#2376c5" font-weight="700">原上下文 + y&lt;k</text><text x="70" y="490" font-size="19" fill="#18334c" font-weight="400">冻结模型 → zo ∈ R^V</text><text x="70" y="519" font-size="19" fill="#18334c" font-weight="400">KV-o独立保存原图/提示</text><text x="70" y="548" font-size="19" fill="#18334c" font-weight="400">不先独立贪心走一条答案</text><rect x="484" y="425" width="390" height="140" fill="#fff" stroke="#17816c" rx="16"/><text x="502" y="457" font-size="23" fill="#17816c" font-weight="700">融合，只选一个token</text><text x="502" y="490" font-size="19" fill="#18334c" font-weight="400">zv=(1+α)zo−αzd</text><text x="502" y="519" font-size="19" fill="#18334c" font-weight="400">默认α=1，greedy选唯一token</text><text x="502" y="548" font-size="19" fill="#18334c" font-weight="400">同一个结果反馈两路缓存</text><rect x="932" y="425" width="405" height="140" fill="#fff" stroke="#7750ad" rx="16"/><text x="950" y="457" font-size="23" fill="#7750ad" font-weight="700">负上下文 + 同一y&lt;k</text><text x="950" y="490" font-size="19" fill="#18334c" font-weight="400">同一模型 → zd ∈ R^V</text><text x="950" y="519" font-size="19" fill="#18334c" font-weight="400">KV-d独立保存负上下文</text><text x="950" y="548" font-size="19" fill="#18334c" font-weight="400">batch并行不等于只有一路计算</text><path d="M427,492 L477,492" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M932,492 L881,492" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="630" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="664" font-size="24" fill="#18334c" font-weight="700">03  教学只含Yes/No两token：不是整词表或真实问答实验</text><rect x="52" y="690" width="405" height="134" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="722" font-size="23" fill="#2376c5" font-weight="700">原logits (3,2)</text><text x="70" y="755" font-size="19" fill="#18334c" font-weight="400">Yes概率≈.73106</text><text x="70" y="784" font-size="19" fill="#18334c" font-weight="400">基线贪心Yes</text><path d="M457,752 L485,752" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="492" y="690" width="405" height="134" fill="#fff" stroke="#c36b24" rx="16"/><text x="510" y="722" font-size="23" fill="#c36b24" font-weight="700">负logits (4,1)</text><text x="510" y="755" font-size="19" fill="#18334c" font-weight="400">α=1：2×原−负</text><text x="510" y="784" font-size="19" fill="#18334c" font-weight="400">融合得(2,3)</text><path d="M897,752 L925,752" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="932" y="690" width="405" height="134" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="722" font-size="23" fill="#17816c" font-weight="700">融合logits (2,3)</text><text x="950" y="755" font-size="19" fill="#18334c" font-weight="400">Yes概率≈.26894</text><text x="950" y="784" font-size="19" fill="#18334c" font-weight="400">融合贪心No</text><text x="65" y="866" font-size="21" fill="#18334c" font-weight="700">若两路都(3,2)，融合仍(3,2)，不会把不变token置零；少答Yes不等于所有任务更正确。</text><rect x="28" y="920" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="954" font-size="24" fill="#18334c" font-weight="700">04  概率比、计算开销与能力边界</text><rect x="53" y="980" width="610" height="171" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="1012" font-size="23" fill="#7750ad" font-weight="700">pVCD(v) ∝ po(v)^(1+α) / pd(v)^α</text><text x="71" y="1045" font-size="19" fill="#18334c" font-weight="400">不是po−pd，不会产生负概率</text><text x="71" y="1074" font-size="19" fill="#18334c" font-weight="400">负上下文极低分也可能过度奖励怪词</text><text x="71" y="1103" font-size="19" fill="#18334c" font-weight="400">默认式子没有另行列可信候选mask</text><text x="71" y="1132" font-size="19" fill="#18334c" font-weight="400">同一词表/前缀和上下文可比性很关键</text><rect x="714" y="980" width="621" height="171" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="1012" font-size="23" fill="#2376c5" font-weight="700">每token两路前向，冻结θ无需训练</text><text x="732" y="1045" font-size="19" fill="#18334c" font-weight="400">权重共享，KV有两套；对象多前缀更长</text><text x="732" y="1074" font-size="19" fill="#18334c" font-weight="400">2秒→2.5秒是报告配置的25%延迟增加</text><text x="732" y="1103" font-size="19" fill="#18334c" font-weight="400">不是修复漏检，也不是机器人安全证明</text><text x="732" y="1132" font-size="19" fill="#18334c" font-weight="400">未加载模型或运行真实问答/作者代码</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>