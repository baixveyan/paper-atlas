<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">BackSplit ｜标签粒度、条件score与Fisher信息方向</title><desc id="desc">依据主文 §3–4、Lemma1/Theorem1/Proposition1；概率和曲率为教学算术，非患者或临床结果。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">BackSplit ｜标签粒度、条件score与Fisher信息方向</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3–4、Lemma1/Theorem1/Proposition1；概率和曲率为教学算术，非患者或临床结果。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  同一影像：病灶之外拆成器官/组织/残余背景，不额外硬裁剪病灶</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">逻辑输出B×K×D×H×W</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">标签是整数类别，K通道softmax</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">支持标注可离线取得，部署不必再跑器官模型</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">重叠/缺失规则必须明确，未标不等于背景</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">教学p=[病灶.2,器官.3,其他.5]</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">细标签器官：NLL=−ln.3≈1.20397</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">只知非病灶：NLL=−ln.8≈.22314</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">loss更大不等于监督更差，信息粒度不同</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  score是对数似然梯度；粗标签只能看到条件平均</text><rect x="53" y="425" width="610" height="172" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="457" font-size="23" fill="#2376c5" font-weight="700">非目标组权重：器官.375 / 其他.625</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">器官score=(−.2,.7,−.5)</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">其他score=(−.2,−.3,.5)</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">条件平均=(−.2,.075,.125)</text><text x="71" y="577" font-size="19" fill="#18334c" font-weight="400">负对数似然梯度要取负，不能反写更新方向</text><rect x="714" y="425" width="621" height="172" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="457" font-size="23" fill="#17816c" font-weight="700">IY = IZ + E[Var(score | Z,X)]</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">差为半正定，不是每个元素都变大</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">细score在粗组内相同 → 信息差为0</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">非零差不保证每个参数方向严格增加</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">定理比较同一概率模型的标签粗化</text><rect x="28" y="645" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  教学背景方向d=(0,.5,−.3)：粗标签看不到，细标签有曲率</text><rect x="53" y="705" width="610" height="143" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="737" font-size="23" fill="#17816c" font-weight="700">p=(.2,.3,.5)，J=I的logit例子</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">(ec−p)ᵀd=0 → dᵀIZd=0</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">dᵀIYd=.3×.5²+.5×(−.3)²=.12</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">背景内差异提供一条额外信息方向</text><rect x="714" y="705" width="621" height="143" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="737" font-size="23" fill="#c36b24" font-weight="700">这个3类softmax矩阵本身奇异</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">所有logit同加常数，概率不变</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">示例不求逆；MLE推论另需可辨识/正定</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">渐近方差较小不等于Dice必然逐类提升</text><rect x="28" y="900" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="934" font-size="24" fill="#18334c" font-weight="700">04  标签准备 → 相同主干多分类训练 → 直接读目标输出</text><rect x="53" y="960" width="610" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="992" font-size="23" fill="#2376c5" font-weight="700">辅助支持主要改变训练监督</text><text x="71" y="1025" font-size="19" fill="#18334c" font-weight="400">数据/病例划分/预处理保持一致</text><text x="71" y="1054" font-size="19" fill="#18334c" font-weight="400">输出头多通道与离线标签都有成本</text><text x="71" y="1083" font-size="19" fill="#18334c" font-weight="400">目标概率阈值与K类argmax可能不同</text><text x="71" y="1112" font-size="19" fill="#18334c" font-weight="400">完整loss/后处理仍要按实现固定</text><rect x="714" y="960" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="992" font-size="23" fill="#7750ad" font-weight="700">理论与真实部署之间的边界</text><text x="732" y="1025" font-size="19" fill="#18334c" font-weight="400">正确模型、正则性、足够样本等是假设</text><text x="732" y="1054" font-size="19" fill="#18334c" font-weight="400">伪标签错位/覆盖不足会带来冲突</text><text x="732" y="1083" font-size="19" fill="#18334c" font-weight="400">Table2肾结石退化，平均不能掩盖分层</text><text x="732" y="1112" font-size="19" fill="#18334c" font-weight="400">未训练、读取患者数据或做临床验证</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>