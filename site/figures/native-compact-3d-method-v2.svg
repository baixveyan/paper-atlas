<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">Native Compact 3D ｜dual网格QEF与稀疏有损压缩</title><desc id="desc">依据PDF3–6 Fig.2–4、式1–7；QEF/通道与内存是教学例，非三维重建实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">Native Compact 3D ｜dual网格QEF与稀疏有损压缩</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–6 Fig.2–4、式1–7；QEF/通道与内存是教学例，非三维重建实验。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  直接mesh求交 → Hermite点/法向 → dual vertex + flags + γ</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">每激活格几何3+3+1；材质6通道</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">不先猜SDF正负；邻格共享primal边flag</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">flag决定连接quad，γ决定三角化</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">QEF贴切平面/开放边界/交点均值正则</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="207" font-size="23" fill="#17816c" font-weight="700">教学平面x=.2、y=.7，λr=.1</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">qbar=(.2,.7,.5)，H=diag(1.1,1.1,.1)</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">b=(.22,.77,.05) → v=(.2,.7,.5)</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">z无表面约束，正则定z；格外解须核盒约束</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  SC-VAE下采样shortcut：8个child的C通道 → 8C → 分组平均</text><rect x="53" y="425" width="610" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="457" font-size="23" fill="#7750ad" font-weight="700">教学C4、C′8，连续每4通道一组</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">child0=[1,3,5,7]；child1=[2,4,6,8]</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">其余6个child缺失补零</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">32维stack → [4,5,0,0,0,0,0,0]</text><text x="71" y="577" font-size="19" fill="#18334c" font-weight="400">shortcut有损，不是无损space-to-channel</text><rect x="714" y="425" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">反向分到8个child并复制通道</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">child0变[4,4,4,4]，未恢复原细节</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">学习的Residual Enc/Dec分支补修正</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">具体packing顺序教学，不冒充作者kernel</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">上采样先预测8位mask，跳过空child</text><rect x="28" y="645" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  两个VAE：shape提供细分结构，material沿相同支撑解码</text><rect x="53" y="705" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="737" font-size="23" fill="#2376c5" font-weight="700">第一阶段直接重建+KL，第二阶段加渲染</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">v用MSE，edge/child flags用BCE，材质L1</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">near plane切进表面，监督内部可见结构</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">材质RGB+metallic+roughness+alpha</text><rect x="714" y="705" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="737" font-size="23" fill="#17816c" font-weight="700">1024³ / 每轴16 → latent格64³</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">64³是上限，不是全部激活；约9.6K token</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">×32维≈307200标量，单份float32≈1.17MiB</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">不含坐标/双latent/模型/激活或成品资产</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  图像到三维：布局 → geometry latent → material latent</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="987" font-size="23" fill="#7750ad" font-weight="700">训练有资产目标，推理只有条件图像</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">三个flow DiT各约1.3B，非总共1.3B</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">材质生成以图像+几何latent为条件</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">解码再连面/拆面/表面材质插值</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">训练重建路径不等于推理输入目标mesh</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="987" font-size="23" fill="#c36b24" font-weight="700">分清表示、压缩、生成三种误差</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">薄结构/同格多表面受有限分辨率限制</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">未知背面与内部靠先验，不是测量真值</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">公式路径/步数/solver主文未给全</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未运行转换器、VAE或三阶段生成模型</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>