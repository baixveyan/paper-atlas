<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">φ-DPO ｜阶段参考、偏好概率与focal梯度核对</title><desc id="desc">依据主文 §3、Fig.4与式7/14/17；分数/梯度/KL均为独立教学例，非模型结果。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">φ-DPO ｜阶段参考、偏好概率与focal梯度核对</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3、Fig.4与式7/14/17；分数/梯度/KL均为独立教学例，非模型结果。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  当前阶段(x,y+,y−)；参考冻结，current以LoRA学习</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">current两回答log概率差Δt</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">序列log概率为回答token分数求和</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">reference两回答得到Δref，无梯度</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">s=β(Δt−Δref)，p=sigmoid(s)</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">教学Δref=1、Δt=2、β=.1</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">s=.1，p≈.524979，DPO≈.644397</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">初始化current=reference时p=.5</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">p不是整任务准确率，也不是用户群体比例</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  focal损失−(1−p)^γ ln p；困难度不等于少数群体身份</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="457" font-size="23" fill="#17816c" font-weight="700">γ=2，p=.9 → 损失≈.001054</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">p=.1 → 损失≈1.865094</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">容易对被降权；困难对保留较强影响</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">γ=0退化普通DPO，不按群体频率直接反权重</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="457" font-size="23" fill="#2376c5" font-weight="700">正确链式梯度含权重自身导数</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">dℓ/ds=(1−p)^γ[γp ln p−(1−p)]</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">p=.5、γ=2 → −.298287</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">下降增加正确偏好logit；勿detach focal权重</text><rect x="28" y="615" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  原文式15符号与式14求导不同：必须核代码，不照抄展开</text><rect x="53" y="675" width="610" height="177" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="707" font-size="23" fill="#c36b24" font-weight="700">γ因子括号应为(1−p)−γp ln p</text><text x="71" y="740" font-size="19" fill="#18334c" font-weight="400">印刷式15写加号；教学例会反转更新方向</text><text x="71" y="769" font-size="19" fill="#18334c" font-weight="400">本地有限差分仅核数学，不是作者代码验收</text><text x="71" y="798" font-size="19" fill="#18334c" font-weight="400">组内E[αg]一般不等于E[α]E[g]</text><text x="71" y="827" font-size="19" fill="#18334c" font-weight="400">组梯度因子分解还需协方差条件</text><rect x="714" y="675" width="621" height="177" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="707" font-size="23" fill="#7750ad" font-weight="700">SFT答案NLL + focal偏好损失</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">SFT学当前任务；reference在当前输入评分</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">结束阶段保存current，下阶段作新参考</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">不存在旧任务数据自动重放</text><text x="732" y="827" font-size="19" fill="#18334c" font-weight="400">完整冻结范围/缓存/权重参数待核验</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  低DPO不无条件保证全策略KL小；γ过大也可能一起无梯度</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="987" font-size="23" fill="#c36b24" font-weight="700">三回答教学：reference=(1/3,1/3,1/3)</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">current=(1−2ε,ε,ε)，只观测首优于次</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">ε趋0：该对DPO趋0，但KL可增大</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">定理须保留覆盖/概率等附录条件</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">这是数学边界，不冒充独立审完所有证明</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="987" font-size="23" fill="#17816c" font-weight="700">公平/遗忘/适应分开评价</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">困难度与少数主题不一定一致</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">梯度差归零也可能只是所有更新消失</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">两回答×两模型有前向/缓存成本</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未调用LLM、训练LoRA或做模型实验</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>