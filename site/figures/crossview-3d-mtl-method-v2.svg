<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">跨视图3D-MTL ｜相机warp、代价体与单图复制边界</title><desc id="desc">依据主文 §3.2、Fig.2与式2–3；相机/深度/内存均为教学例，非场景重建或模型实测。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">跨视图3D-MTL ｜相机warp、代价体与单图复制边界</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3.2、Fig.2与式2–3；相机/深度/内存均为教学例，非场景重建或模型实测。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  语义主干f与几何CvM并行；融合后各任务头共享几何线索</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">CvM：浅CNN → self/cross-view transformer</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">128通道、1/8分辨率、6层注意力</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">窗口上下文不等于已知正确像素对应</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">主干与CvM空间对齐后才可拼通道</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">Fi + 深度代价体Ci + f(Ii) → 任务头</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">逻辑融合Cm+L+128通道</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">分割/深度/法向/边界各有监督</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">视频额外帧只有深度标签，不伪造缺失任务</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  教学f=100、基线b=.1、参考u=50；参考→邻图平移−b</text><rect x="53" y="425" width="610" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="457" font-size="23" fill="#2376c5" font-weight="700">u′=u−fb/d</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">d=1 → 邻图u′=40</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">d=2 → 邻图u′=45</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">同一参考像素，不同深度去不同位置匹配</text><text x="71" y="577" font-size="19" fill="#18334c" font-weight="400">相机方向反了，视差符号也会反</text><rect x="714" y="425" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">先逆内参回投影，再相对位姿，再投影</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">Xi=d Ki⁻¹p；Xj=RjiXi+tji</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">pj∼KjXj，除Z后采样邻图特征</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">特征缩放时内参/主点也须匹配</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">插值/遮挡/越界规则原文未给全</text><rect x="28" y="645" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  逆深度候选 + 点积：C形状B×L×h×w，不直接就是深度图</text><rect x="53" y="705" width="610" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="737" font-size="23" fill="#17816c" font-weight="700">教学深度端点1和4，L=3</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">逆深度[1,.625,.25] → d=[1,1.6,4]</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">K=2，参考(1,0)，匹配(1,0)/(0,1)</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">分数.7071/0：相似度大非概率已归一</text><rect x="714" y="705" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="737" font-size="23" fill="#7750ad" font-weight="700">480×640、L128教学</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">特征60×80，C有614400项</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">float32约2.34MiB/视图，仅算最终C</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">中间warp特征、梯度与attention另计</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  复制单图不产生真实双目；相同相机条件下深度轴会退化</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="987" font-size="23" fill="#c36b24" font-weight="700">若Ki=Kj、R=I、t=0</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">pj(d)∼K(dK⁻¹p)∼p，对所有d相同</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">两路特征相同则C沿d重复</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">重复图相机处理主文未给全，需实现核验</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">性能提升不证明得到新的视差观测</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="987" font-size="23" fill="#17816c" font-weight="700">任务loss联合学习，不凭空增加新一致性loss</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">单图也可运行辅助结构与特征融合</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">相机误差/运动/遮挡仍会污染匹配</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">增加视图或深度候选不是必然提升</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未训练模型、运行COLMAP或重建场景</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>