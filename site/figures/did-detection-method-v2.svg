<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">DID ｜带符号二阶残差、近似消差与联合误报</title><desc id="desc">依据主文 §3–4、Fig.2与式1–9；像素、流形反例与FPR为教学算术，非检测实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1230" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">DID ｜带符号二阶残差、近似消差与联合误报</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3–4、Fig.2与式1–9；像素、流形反例与FPR为教学算术，非检测实验。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  同一个冻结重建器连续两次；输出两个3×256×256特征图</text><rect x="52" y="175" width="375" height="139" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="207" font-size="23" fill="#2376c5" font-weight="700">原图x → R → x′</text><text x="70" y="240" font-size="19" fill="#18334c" font-weight="400">重建不是独立文生图</text><text x="70" y="269" font-size="19" fill="#18334c" font-weight="400">E1=|x−x′|，非负</text><text x="70" y="298" font-size="19" fill="#18334c" font-weight="400">特征提取不训练ADM</text><rect x="484" y="175" width="390" height="139" fill="#fff" stroke="#7750ad" rx="16"/><text x="502" y="207" font-size="23" fill="#7750ad" font-weight="700">x′ → R → x″</text><text x="502" y="240" font-size="19" fill="#18334c" font-weight="400">E2=|x′−x″|，非负</text><text x="502" y="269" font-size="19" fill="#18334c" font-weight="400">D2=E1−E2，有正负</text><text x="502" y="298" font-size="19" fill="#18334c" font-weight="400">不是平方，也不再取绝对值</text><rect x="932" y="175" width="405" height="139" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="207" font-size="23" fill="#17816c" font-weight="700">两支独立ResNet-50</text><text x="950" y="240" font-size="19" fill="#18334c" font-weight="400">E1与D2各有监督BCE</text><text x="950" y="269" font-size="19" fill="#18334c" font-weight="400">y=1生成，y=0真实</text><text x="950" y="298" font-size="19" fill="#18334c" font-weight="400">两支都低分才最终判真实</text><path d="M427,242 L477,242" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,242 L925,242" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="365" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  两像素教学：保持减法次序，不将负值裁成0</text><rect x="52" y="425" width="405" height="157" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="457" font-size="23" fill="#2376c5" font-weight="700">x  /  x′  /  x″</text><text x="70" y="490" font-size="19" fill="#18334c" font-weight="400">(.8,.2)</text><text x="70" y="519" font-size="19" fill="#18334c" font-weight="400">(.7,.3)</text><text x="70" y="548" font-size="19" fill="#18334c" font-weight="400">(.68,.5)</text><path d="M457,500 L485,500" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="492" y="425" width="405" height="157" fill="#fff" stroke="#7750ad" rx="16"/><text x="510" y="457" font-size="23" fill="#7750ad" font-weight="700">E1  /  E2</text><text x="510" y="490" font-size="19" fill="#18334c" font-weight="400">(.1,.1)</text><text x="510" y="519" font-size="19" fill="#18334c" font-weight="400">(.02,.2)</text><path d="M897,500 L925,500" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="932" y="425" width="405" height="157" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="457" font-size="23" fill="#17816c" font-weight="700">D2 = E1 − E2</text><text x="950" y="490" font-size="19" fill="#18334c" font-weight="400">(.08,−.10)</text><text x="950" y="519" font-size="19" fill="#18334c" font-weight="400">第2位置二次重建变化更大</text><rect x="28" y="640" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="674" font-size="24" fill="#18334c" font-weight="700">03  消差依赖近流形与相关扰动，不是一般重建器的恒等式</text><rect x="53" y="700" width="610" height="155" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="732" font-size="23" fill="#2376c5" font-weight="700">理想化：a=.02，d=d′=.1</text><text x="71" y="765" font-size="19" fill="#18334c" font-weight="400">真实D2=.08−.1=−.02；生成约0</text><text x="71" y="794" font-size="19" fill="#18334c" font-weight="400">仅在弱信号、符号稳定等条件下消差</text><text x="71" y="823" font-size="19" fill="#18334c" font-weight="400">若d′=.3：真实−.22、生成−.2</text><text x="71" y="852" font-size="19" fill="#18334c" font-weight="400">扰动不相关便不能直接宣称清除噪声</text><rect x="714" y="700" width="621" height="155" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="732" font-size="23" fill="#c36b24" font-weight="700">反例：M={0}，R(x)=0+.1</text><text x="732" y="765" font-size="19" fill="#18334c" font-weight="400">生成x=0 → x′=.1 → x″=.1</text><text x="732" y="794" font-size="19" fill="#18334c" font-weight="400">D2=.1−0=.1，不是0</text><text x="732" y="823" font-size="19" fill="#18334c" font-weight="400">δ处处相同，但x′已不在流形上</text><text x="732" y="852" font-size="19" fill="#18334c" font-weight="400">式5–8还依赖第二次残差的理想化</text><rect x="28" y="915" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="949" font-size="24" fill="#18334c" font-weight="700">04  c≈.292893是分数阈值，不是每支或整体FPR</text><rect x="53" y="975" width="610" height="171" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="1007" font-size="23" fill="#17816c" font-weight="700">教学p1=.2、p2=.4 → 最终判生成</text><text x="71" y="1040" font-size="19" fill="#18334c" font-weight="400">真实 ⇔ p1&lt;c 且 p2&lt;c</text><text x="71" y="1069" font-size="19" fill="#18334c" font-weight="400">生成 ⇔ max(p1,p2)≥c</text><text x="71" y="1098" font-size="19" fill="#18334c" font-weight="400">BCE只训各支，没有端到端AND门损失</text><text x="71" y="1127" font-size="19" fill="#18334c" font-weight="400">应在独立验证集做同FPR比较</text><rect x="714" y="975" width="621" height="171" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="1007" font-size="23" fill="#7750ad" font-weight="700">两支各误报.1，整体可能不同</text><text x="732" y="1040" font-size="19" fill="#18334c" font-weight="400">独立 .19；完全相同 .1；互斥 .2</text><text x="732" y="1069" font-size="19" fill="#18334c" font-weight="400">分类器独立训练 ≠ 误报事件独立</text><text x="732" y="1098" font-size="19" fill="#18334c" font-weight="400">主要成本：两次串行重建 + 两支分类</text><text x="732" y="1127" font-size="19" fill="#18334c" font-weight="400">未加载权重、训练或执行图像检测</text><text x="36" y="1207" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>