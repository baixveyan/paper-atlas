<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">LAM3C ｜视频点云、EMA原型与抗噪图约束</title><desc id="desc">依据PDF3–5 Fig.2–5、式1–5；图权重/CE/Huber为教学例，未运行视频重建或PTv3。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">LAM3C ｜视频点云、EMA原型与抗噪图约束</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–5 Fig.2–5、式1–5；图权重/CE/Huber为教学例，未运行视频重建或PTv3。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  获许可视频 → CLIP室内切片 → π³重建点云 → 过滤/坐标/尺度</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">原名π³；旧稿ω3转写本轮纠正</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">点输入9维：xyz + RGB + normal</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">49,219场景；自采子集15,921</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">ScanNet尺度分布仍是外部统计先验</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="207" font-size="23" fill="#17816c" font-weight="700">PTv3学生有梯度，teacher按EMA更新</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">local/masked学生，对global教师原型分布</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">基础CE三项4:2:2；q=Sinkhorn、p=softmax</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">图平滑embedding，不直接修复点云坐标</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  两套配对关系：同场景几何kNN边 ≠ 跨增强对应点</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="457" font-size="23" fill="#7750ad" font-weight="700">Laplacian基础Σw||hi−hj||²</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">w=exp(−d²/σ²)，σ为kNN距离中位数</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">实际用degree normalization + Huber</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">k/阈值/归一化形式/Huber δ主文没给全</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">noise global教师 vs masked global学生</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">对应点embedding平方差均值</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">示例[1,0]与[.8,.2] → .08</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">旋转/尺度/裁剪后的坐标匹配需统一</text><rect x="28" y="615" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  距离权重教学：σ=.1，近边d=.1得e⁻¹，远边d=1.9得e⁻³⁶¹</text><path d="M100 740 L250 740" stroke="#2376c5" stroke-width="6"/><path d="M250 740 L580 740" stroke="#99a8b8" stroke-width="2" stroke-dasharray="7 6"/><circle cx="100" cy="740" r="9" fill="#2376c5"/><text x="72" y="715" font-size="19" fill="#18334c" font-weight="400">p0=0</text><circle cx="250" cy="740" r="9" fill="#2376c5"/><text x="222" y="715" font-size="19" fill="#18334c" font-weight="400">p1=.1</text><circle cx="580" cy="740" r="9" fill="#2376c5"/><text x="552" y="715" font-size="19" fill="#18334c" font-weight="400">p2=2</text><text x="90" y="790" font-size="19" fill="#18334c" font-weight="400">近边≈.367879；远边接近0（图示间距不按比例）</text><text x="90" y="833" font-size="19" fill="#c36b24" font-weight="400">边权减弱离群影响，也可能跨薄层或物体边缘过平滑</text><rect x="714" y="675" width="621" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="707" font-size="23" fill="#2376c5" font-weight="700">标准Huber教学δ1、残差10 → 9.5</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">相比.5r²=50增长慢，非作者默认δ</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">所有hi=c时平滑为0，不能单独防坍塌</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">teacher/student都常量时一致性也为0</text><text x="732" y="827" font-size="19" fill="#18334c" font-weight="400">需结合原型/均衡/增强与实际表现检查</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  L=CE + λRLap + .05Rcons；λ从.0002线性增至.003</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="987" font-size="23" fill="#17816c" font-weight="700">CE教学q=[.8,.2]</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">p=[.5,.5] → .693147</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">p=[.8,.2] → .500402，不要求零损失</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">σ为0/空图/丢对应等边界未完整说明</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">LP与Full-FT不是同一评测口径</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="987" font-size="23" fill="#7750ad" font-weight="700">无扫描预训练样本≠无统计/模型先验</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">数据生成/teacher前向/图构造均有成本</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">图约Nk条边，特征差约NkC</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">仅验算教学CE/权重/Huber/尺度</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未下载数据或运行重建/预训练模型</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>