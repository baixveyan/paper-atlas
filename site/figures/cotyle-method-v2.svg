<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1290" viewBox="0 0 1400 1290" role="img" aria-labelledby="title desc"><title id="title">CoTyle ｜数字种子、196索引与三阶段风格生成</title><desc id="desc">依据正文 §3、Fig.3 及固定提交代码；概率条为独立算术例，非生成模型实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1290" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">CoTyle ｜数字种子、196索引与三阶段风格生成</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据正文 §3、Fig.3 及固定提交代码；概率条为独立算术例，非生成模型实验。</text><rect x="28" y="115" width="1344" height="268" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  三阶段训练：同一个模块在不同阶段的更新范围不同</text><rect x="52" y="177" width="375" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="209" font-size="23" fill="#2376c5" font-weight="700">码本：风格对比 + 量化</text><text x="70" y="242" font-size="19" fill="#18334c" font-weight="400">同 / 异风格图对 → 视觉特征</text><text x="70" y="271" font-size="19" fill="#18334c" font-weight="400">连续 196×64 → 1024×64 码本</text><text x="70" y="300" font-size="19" fill="#18334c" font-weight="400">索引后解码回视觉接口维度</text><rect x="484" y="177" width="390" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="502" y="209" font-size="23" fill="#17816c" font-weight="700">图像条件生成器</text><text x="502" y="242" font-size="19" fill="#18334c" font-weight="400">冻结码本与文本编码器</text><text x="502" y="271" font-size="19" fill="#18334c" font-weight="400">参考 x₁ 给风格，文本 y₂ 给内容</text><text x="502" y="300" font-size="19" fill="#18334c" font-weight="400">训练 DiT 生成同风格目标 x₂</text><rect x="932" y="177" width="405" height="165" fill="#fff" stroke="#7750ad" rx="16"/><text x="950" y="209" font-size="23" fill="#7750ad" font-weight="700">无条件风格 AR</text><text x="950" y="242" font-size="19" fill="#18334c" font-weight="400">冻结视觉编码与码本</text><text x="950" y="271" font-size="19" fill="#18334c" font-weight="400">真实图像 → 196 索引序列</text><text x="950" y="300" font-size="19" fill="#18334c" font-weight="400">Qwen2-0.5B 架构从头训练</text><path d="M427,252 L477,252" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,252 L925,252" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="410" width="1344" height="302" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="444" font-size="24" fill="#18334c" font-weight="700">02  数字只决定风格采样：196 索引与图像噪声各有来源</text><rect x="52" y="470" width="375" height="164" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="502" font-size="23" fill="#c36b24" font-weight="700">style_code → 随机序列</text><text x="70" y="535" font-size="19" fill="#18334c" font-weight="400">固定种子 → 起始索引 0…1023</text><text x="70" y="564" font-size="19" fill="#18334c" font-weight="400">再采 195 个 → 总长 196</text><text x="70" y="593" font-size="19" fill="#18334c" font-weight="400">不是把 196 变成单一 token</text><rect x="484" y="470" width="390" height="164" fill="#fff" stroke="#2376c5" rx="16"/><text x="502" y="502" font-size="23" fill="#2376c5" font-weight="700">查表 + 解码 → 风格条件</text><text x="502" y="535" font-size="19" fill="#18334c" font-weight="400">196×64 → 视觉特征接口</text><text x="502" y="564" font-size="19" fill="#18334c" font-weight="400">经 VLM 文本分支与内容融合</text><text x="502" y="593" font-size="19" fill="#18334c" font-weight="400">码本本体65,536标量≠全模型</text><rect x="932" y="470" width="405" height="164" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="502" font-size="23" fill="#17816c" font-weight="700">独立 image_seed → 图像</text><text x="950" y="535" font-size="19" fill="#18334c" font-weight="400">重新设置图像随机源</text><text x="950" y="564" font-size="19" fill="#18334c" font-weight="400">风格条件固定，可换内容与噪声</text><text x="950" y="593" font-size="19" fill="#18334c" font-weight="400">同风格数字不等于相同像素</text><path d="M427,546 L477,546" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,546 L925,546" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="65" y="683" font-size="20" fill="#18334c" font-weight="700">固定提交 inference.py：1 个起始 + max_new_tokens=195；还需固定模型、频率表与采样参数。</text><rect x="28" y="738" width="1344" height="301" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="772" font-size="24" fill="#18334c" font-weight="700">03  乘 logit 的符号边界：这不是对所有输入单调降概率</text><text x="63" y="809" font-size="22" fill="#c36b24" font-weight="700">负值：首项概率反而增加</text><rect x="65" y="824" width="25.032609" height="24" fill="#c36b24" stroke="#fff" rx="3"/><text x="65" y="874" font-size="20" fill="#c36b24" font-weight="400">0.1192</text><rect x="310" y="824" width="56.477694" height="24" fill="#c36b24" stroke="#fff" rx="3"/><text x="310" y="874" font-size="20" fill="#c36b24" font-weight="400">0.2689</text><text x="63" y="920" font-size="22" fill="#17816c" font-weight="700">正值：首项概率下降</text><rect x="65" y="935" width="184.967391" height="24" fill="#17816c" stroke="#fff" rx="3"/><text x="65" y="985" font-size="20" fill="#17816c" font-weight="400">0.8808</text><rect x="310" y="935" width="153.52230600000001" height="24" fill="#17816c" stroke="#fff" rx="3"/><text x="310" y="985" font-size="20" fill="#17816c" font-weight="400">0.7311</text><rect x="625" y="800" width="710" height="192" fill="#fff" stroke="#7750ad" rx="16"/><text x="643" y="832" font-size="23" fill="#7750ad" font-weight="700">首项抑制系数 .5，另一项 logit 保持 0</text><text x="643" y="865" font-size="19" fill="#18334c" font-weight="400">[−2,0] → [−1,0]：.1192 → .2689</text><text x="643" y="894" font-size="19" fill="#18334c" font-weight="400">[2,0] → [1,0]：.8808 → .7311</text><text x="643" y="923" font-size="19" fill="#18334c" font-weight="400">f 是码本使用频率，不是空间频率</text><text x="643" y="952" font-size="19" fill="#18334c" font-weight="400">公开实现只显式处理 logits[0][0] 切片</text><rect x="28" y="1064" width="1344" height="175" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1098" font-size="24" fill="#18334c" font-weight="700">04  数值反例是教学核对；训练损失歧义仍需保留</text><rect x="53" y="1120" width="1282" height="90" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="1152" font-size="23" fill="#2376c5" font-weight="700">重建式3印刷为 cos² 且正权重最小化，与“靠近”文字有差异</text><text x="71" y="1185" font-size="19" fill="#18334c" font-weight="400">码本直通梯度与独立seed已静态核实；未安装作者代码、加载权重、训练或生成实验</text><text x="36" y="1267" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>