<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title desc"><title id="title">ActionMesh ｜时序潜同步、已知形状回填与固定连接动画</title><desc id="desc">依据主文 §3、Fig.2与式1；3帧token与三角形位移为教学例，非动画生成结果。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ActionMesh ｜时序潜同步、已知形状回填与固定连接动画</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3、Fig.2与式1；3帧token与三角形位移为教学例，非动画生成结果。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  N视频帧 × T形状token：展平后跨帧交流；s是另一个flow时钟</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">教学N=3、T=2 → 6个token</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">逐帧：三张2×2，合计12个关联</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">inflated：一张6×6，共36个关联</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">FlashAttention2不消除精确注意力二次量</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">tk：视频位置；s：去噪层级</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">RoPE编码视频相对位置帮助动作连贯</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">DINOv2给每帧图像条件</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">latent token不是固定顶点ID</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  三帧中第2帧已知：每步前回填[噪声, z*, 噪声]</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="457" font-size="23" fill="#2376c5" font-weight="700">训练：已知源保持干净、s=0</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">源位置不计扩散loss</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">目标可通过注意力读取源特征</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">无该位置loss ≠ 对训练没有影响</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">推理：每个去噪步前重新写回z*</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">参考帧可选清楚、无遮挡的中间帧</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">只在初始化写一次可能让参考漂移</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">阶段一输出各帧独立(Vk,Fk)</text><rect x="28" y="615" width="1344" height="290" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  阶段二：固定E3D → 联合潜Z → 查询参考位置和法线 → δk</text><polygon points="108,806 208,806 108,731" fill="none" stroke="#2376c5" stroke-width="3"/><text x="73" y="699" font-size="22" fill="#2376c5" font-weight="700">参考 t1：p=0</text><text x="73" y="857" font-size="19" fill="#2376c5" font-weight="400">F=[0,1,2] 始终不变</text><path d="M263,765 L443,765" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><polygon points="593,806 693,806 593,731" fill="none" stroke="#17816c" stroke-width="3"/><text x="493" y="699" font-size="22" fill="#17816c" font-weight="700">目标 t2：p=1</text><text x="493" y="857" font-size="19" fill="#17816c" font-weight="400">F=[0,1,2] 始终不变</text><path d="M683,765 L863,765" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><polygon points="980.5,806 1080.5,806 980.5,731" fill="none" stroke="#7750ad" stroke-width="3"/><text x="913" y="699" font-size="22" fill="#7750ad" font-weight="700">目标 t3：p=.5</text><text x="913" y="857" font-size="19" fill="#7750ad" font-weight="400">F=[0,1,2] 始终不变</text><text x="65" y="887" font-size="20" fill="#18334c" font-weight="700">第三帧 = 参考0 + δ3(.5)，不是第二帧1 + .5；网格表面位置一致还不等于逐顶点对应。</text><rect x="28" y="930" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="964" font-size="24" fill="#18334c" font-weight="700">04  法线分清相邻表面；固定面连接仍无法切开/融合拓扑</text><rect x="53" y="990" width="610" height="166" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="1022" font-size="23" fill="#17816c" font-weight="700">训练采样表面点；推理查询全部Nv顶点</text><text x="71" y="1055" font-size="19" fill="#18334c" font-weight="400">δk为Nv×3，时间输入指定源与目标</text><text x="71" y="1084" font-size="19" fill="#18334c" font-weight="400">输出(V+δk,F)，无预设骨架</text><text x="71" y="1113" font-size="19" fill="#18334c" font-weight="400">自交、体积与新露纹理仍需独立检查</text><text x="71" y="1142" font-size="19" fill="#18334c" font-weight="400">完整形变loss及正则权重主文未给全</text><rect x="714" y="990" width="621" height="166" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="1022" font-size="23" fill="#7750ad" font-weight="700">不需逐场景优化 ≠ 单次前向全完成</text><text x="732" y="1055" font-size="19" fill="#18334c" font-weight="400">参考图生3D + 多步潜采样 + 网格化</text><text x="732" y="1084" font-size="19" fill="#18334c" font-weight="400">重新编码形状 + 时序位移解码</text><text x="732" y="1113" font-size="19" fill="#18334c" font-weight="400">长序列末帧接续可能累计漂移</text><text x="732" y="1142" font-size="19" fill="#18334c" font-weight="400">未训练、推理、绑定骨骼或导出动画</text><text x="36" y="1217" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>