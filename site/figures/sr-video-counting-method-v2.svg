<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">视频计数SR ｜频域人数、阈值门控与运动容忍权重</title><desc id="desc">依据主文 §3、Fig.1–2与式2–13；模长/阈值/权重为独立教学例，非真实视频实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">视频计数SR ｜频域人数、阈值门控与运动容忍权重</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3、Fig.1–2与式2–13；模长/阈值/权重为独立教学例，非真实视频实验。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  两帧独立通过共享计数器；只有训练损失交换时间信息</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">It / It+1 → Dt / Dt+1 → Ct / Ct+1</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">ChF是复数频率图；C(0)=人数</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">不是把密度除人数后的概率ChF</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">部署只留当前帧密度预测与积分计数</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">离线只用训练标签</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">ε*：相邻ChF差L1上界统计</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">S(w)：按人数归一的经验差分方差</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">Λ*：PSD运动协方差拟合，不运行光流</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  教学两个单位权重频率点，差模长(3,4)：L1=7，L2=5</text><rect x="53" y="425" width="610" height="172" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="457" font-size="23" fill="#c36b24" font-weight="700">ε*=6：7&gt;6，激活整个L2</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">不是惩罚L1−阈值=1</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">ε*=7：严格大于不成立，辅助项0</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">门控是未加权全局L1；不是逐频率阈值</text><text x="71" y="577" font-size="19" fill="#18334c" font-weight="400">触发边界不连续，软门不是原文给定设计</text><rect x="714" y="425" width="621" height="172" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="457" font-size="23" fill="#17816c" font-weight="700">运动容忍H=(1,.5)</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">加权L2=√(3²+(.5×4)²)=√13</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">≈3.605551，α=.8 → 2.884441</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">不是平方范数13，也不是改变触发条件</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">标签监督仍同时约束每帧预测</text><rect x="28" y="645" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  H=1/(√(qmin·hΛ)+1)，+1在平方根外</text><rect x="53" y="705" width="610" height="143" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="737" font-size="23" fill="#2376c5" font-weight="700">教学qmin=10，h=.3</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">H=1/(√3+1)≈.366025</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">若误写1/√(3+1)，会得到.5</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">零频h=0 → H=1，仍保护人数变化</text><rect x="714" y="705" width="621" height="143" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="737" font-size="23" fill="#7750ad" font-weight="700">h=(1−exp(−wᵀΛw))exp(−γ²wᵀw)</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">Λ⪰0，γ为密度标签高斯带宽</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">人数取两预测的较小者，是否detach待核验</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">估计统计与训练裁剪/缩放/帧率须一致</text><rect x="28" y="900" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="934" font-size="24" fill="#18334c" font-weight="700">04  最优单帧/多帧估计的条件关系，不是有限网络等价保证</text><rect x="53" y="960" width="610" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="992" font-size="23" fill="#c36b24" font-weight="700">比较E[人数|当前帧]与E[人数|窗口]</text><text x="71" y="1025" font-size="19" fill="#18334c" font-weight="400">额外窗口无信息等条件下，差才为0</text><text x="71" y="1054" font-size="19" fill="#18334c" font-weight="400">有部分可见线索≠人数必然可确定</text><text x="71" y="1083" font-size="19" fill="#18334c" font-weight="400">有限频率窗不等于全频域理论积分</text><text x="71" y="1112" font-size="19" fill="#18334c" font-weight="400">镜头切换/分布漂移可能超过训练阈值</text><rect x="714" y="960" width="621" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="992" font-size="23" fill="#17816c" font-weight="700">训练加计算，推理不加时间融合</text><text x="732" y="1025" font-size="19" fill="#18334c" font-weight="400">两帧前向 + ChF监督 + 条件加权正则</text><text x="732" y="1054" font-size="19" fill="#18334c" font-weight="400">预测非负性、H梯度与抗离群规则需核验</text><text x="732" y="1083" font-size="19" fill="#18334c" font-weight="400">99.5fps是作者特定配置，不含所有环节</text><text x="732" y="1112" font-size="19" fill="#18334c" font-weight="400">未下载视频、训练或运行计数模型</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>