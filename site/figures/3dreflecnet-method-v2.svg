<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1290" viewBox="0 0 1400 1290" role="img" aria-labelledby="title desc"><title id="title">3DReflecNet ｜数据怎么产生，真值与评测怎么分</title><desc id="desc">依据正文 §3–5、Fig.5，PDF3–6；单位估算与坐标接口为阅读补充，未下载数据。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1290" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">3DReflecNet ｜数据怎么产生，真值与评测怎么分</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据正文 §3–5、Fig.5，PDF3–6；单位估算与坐标接口为阅读补充，未下载数据。</text><rect x="28" y="115" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  合成：shape × 所选材质与照明 → instance → 60 个视角</text><rect x="52" y="177" width="355" height="165" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="209" font-size="23" fill="#2376c5" font-weight="700">几何资产</text><text x="70" y="242" font-size="19" fill="#18334c" font-weight="400">10K+ 库资产 + 2K+ 图生资产</text><text x="70" y="271" font-size="19" fill="#18334c" font-weight="400">图生：深度 / 法向 → 网格</text><text x="70" y="300" font-size="19" fill="#18334c" font-weight="400">几何质量并非没有误差</text><rect x="466" y="177" width="390" height="165" fill="#fff" stroke="#c36b24" rx="16"/><text x="484" y="209" font-size="23" fill="#c36b24" font-weight="700">实例化与 PBR 渲染</text><text x="484" y="242" font-size="19" fill="#18334c" font-weight="400">22 材质类型，2700+ HDRI</text><text x="484" y="271" font-size="19" fill="#18334c" font-weight="400">另有 1–2 个点光源</text><text x="484" y="300" font-size="19" fill="#18334c" font-weight="400">按所选组合，不做完整笛卡尔积</text><rect x="914" y="177" width="425" height="165" fill="#fff" stroke="#17816c" rx="16"/><text x="932" y="209" font-size="23" fill="#17816c" font-weight="700">每实例的输出接口</text><text x="932" y="242" font-size="19" fill="#18334c" font-weight="400">60×1000×1000×3 RGB</text><text x="932" y="271" font-size="19" fill="#18334c" font-weight="400">深度 / 法向 / mask / 相机</text><text x="932" y="300" font-size="19" fill="#18334c" font-weight="400">点云与网格来自源几何</text><path d="M407,250 L459,250" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M856,250 L907,250" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="410" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="444" font-size="24" fill="#18334c" font-weight="700">02  评测有两条轴：数据划分与同一物体的留出视角</text><rect x="53" y="471" width="610" height="155" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="503" font-size="23" fill="#7750ad" font-weight="700">整体数据：80% / 10% / 10%</text><text x="71" y="536" font-size="19" fill="#18334c" font-weight="400">训练 / 验证 / 测试，不等于一个实例的视角数</text><text x="71" y="565" font-size="19" fill="#18334c" font-weight="400">是否严格按 shape 隔离，正文未完整交代</text><text x="71" y="594" font-size="19" fill="#18334c" font-weight="400">不能把同形不同材质跨集合默认当独立样本</text><rect x="714" y="471" width="621" height="155" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="503" font-size="23" fill="#2376c5" font-weight="700">48 种材质配置诊断：同模型同照明</text><text x="732" y="536" font-size="19" fill="#18334c" font-weight="400">每配置 50 张训练视角 + 10 张测试视角</text><text x="732" y="565" font-size="19" fill="#18334c" font-weight="400">50+10=60；48 配置 ≠ 数据集22材质类型</text><text x="732" y="594" font-size="19" fill="#18334c" font-weight="400">只说明该控制变量实验，不推广为全库统计</text><rect x="28" y="715" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="749" font-size="24" fill="#18334c" font-weight="700">03  实拍：先利用纹理底座定姿，再分割对象</text><rect x="52" y="776" width="355" height="150" fill="#fff" stroke="#c36b24" rx="16"/><text x="70" y="808" font-size="23" fill="#c36b24" font-weight="700">对象 + 纹理底座 + 转台</text><text x="70" y="841" font-size="19" fill="#18334c" font-weight="400">iPhone 1080×1920 / 30fps</text><text x="70" y="870" font-size="19" fill="#18334c" font-weight="400">360°观测；手机可保持固定</text><text x="70" y="899" font-size="19" fill="#18334c" font-weight="400">不是所有帧都自动用于训练</text><rect x="466" y="776" width="390" height="150" fill="#fff" stroke="#17816c" rx="16"/><text x="484" y="808" font-size="23" fill="#17816c" font-weight="700">RealityScan → 位姿</text><text x="484" y="841" font-size="19" fill="#18334c" font-weight="400">跟踪底座稳定特征</text><text x="484" y="870" font-size="19" fill="#18334c" font-weight="400">对象坐标下的相机随转台变化</text><text x="484" y="899" font-size="19" fill="#18334c" font-weight="400">xc = Tcw Two(t) xo</text><rect x="914" y="776" width="425" height="150" fill="#fff" stroke="#7750ad" rx="16"/><text x="932" y="808" font-size="23" fill="#7750ad" font-weight="700">SAM2 → 去底座和背景</text><text x="932" y="841" font-size="19" fill="#18334c" font-weight="400">保留目标对象像素</text><text x="932" y="870" font-size="19" fill="#18334c" font-weight="400">实拍没有合成源网格同级GT</text><text x="932" y="899" font-size="19" fill="#18334c" font-weight="400">物体旋转会改变与光照的关系</text><path d="M407,849 L459,849" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M856,849 L907,849" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="995" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1029" font-size="24" fill="#18334c" font-weight="700">04  数量与指标的计算：先确定单位，再比较结果</text><rect x="52" y="1053" width="610" height="159" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="1085" font-size="23" fill="#2376c5" font-weight="700">帧数与存储量纲示例</text><text x="70" y="1118" font-size="19" fill="#18334c" font-weight="400">120K 实例 × 60 视角 ≈ 7.2M 帧</text><text x="70" y="1147" font-size="19" fill="#18334c" font-weight="400">每帧 uint8 RGB 无压缩约3MB</text><text x="70" y="1176" font-size="19" fill="#18334c" font-weight="400">约21.6TB，仅RGB估算，非发行包大小</text><rect x="714" y="1053" width="621" height="159" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="1085" font-size="23" fill="#c36b24" font-weight="700">PSNR 对数差 ≠ 线性画质百分比</text><text x="732" y="1118" font-size="19" fill="#18334c" font-weight="400">35dB → 19dB：MSE 约增加 39.81 倍</text><text x="732" y="1147" font-size="19" fill="#18334c" font-weight="400">前提：相同 MAX、掩码与评测协议</text><text x="732" y="1176" font-size="19" fill="#18334c" font-weight="400">NVS高分不保证网格正确；未运行重建实验</text><text x="36" y="1267" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>