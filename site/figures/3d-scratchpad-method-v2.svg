<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">3D Scratchpad ｜身份与几何分工、坐标投影和编辑路径</title><desc id="desc">依据主文 §3–4、Fig.2与式1–3；坐标/投影/潜融合为教学例，非作者生成或编辑结果。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">3D Scratchpad ｜身份与几何分工、坐标投影和编辑路径</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3–4、Fig.2与式1–3；坐标/投影/潜融合为教学例，非作者生成或编辑结果。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  每个主体：稳定ID + 身份图 + 无纹理mesh + 盒子/变换</text><rect x="52" y="175" width="375" height="139" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="207" font-size="23" fill="#2376c5" font-weight="700">提示 → 主体/背景/P′</text><text x="70" y="240" font-size="19" fill="#18334c" font-weight="400">每主体先文生图，留身份参考</text><text x="70" y="269" font-size="19" fill="#18334c" font-weight="400">再图生3D，mesh只涂标识色</text><text x="70" y="298" font-size="19" fill="#18334c" font-weight="400">外观不是用标识色当真实纹理</text><rect x="484" y="175" width="390" height="139" fill="#fff" stroke="#7750ad" rx="16"/><text x="502" y="207" font-size="23" fill="#7750ad" font-weight="700">BboxPlanner → 布局</text><text x="502" y="240" font-size="19" fill="#18334c" font-weight="400">P′/描述/身份/长宽比/空间D</text><text x="502" y="269" font-size="19" fill="#18334c" font-weight="400">输出包围盒与目标朝向</text><text x="502" y="298" font-size="19" fill="#18334c" font-weight="400">边界/相交需核验，不自动物理正确</text><rect x="932" y="175" width="405" height="139" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="207" font-size="23" fill="#17816c" font-weight="700">3D状态 → 深度 + 身份 → 图</text><text x="950" y="240" font-size="19" fill="#18334c" font-weight="400">SIGMA-Gen联合多主体控制</text><text x="950" y="269" font-size="19" fill="#18334c" font-weight="400">深度管结构，身份参考管外观</text><text x="950" y="298" font-size="19" fill="#18334c" font-weight="400">最终图仍可能偏离3D约束</text><path d="M427,242 L477,242" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,242 L925,242" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  教学相机沿+Z：u=X/Z；朝相机移动也改变横向投影</text><path d="M90,575 L610,575" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="530" y="601" font-size="20" fill="#2376c5" font-weight="400">X向右</text><circle cx="210" cy="486" r="13" fill="#2376c5"/><text x="125" y="451" font-size="20" fill="#2376c5" font-weight="700">松鼠 X=−1</text><circle cx="490" cy="486" r="13" fill="#7750ad"/><text x="405" y="451" font-size="20" fill="#7750ad" font-weight="700">老鼠 X=1</text><text x="136" y="529" font-size="20" fill="#2376c5" font-weight="400">Z=2 → u=−.5</text><text x="421" y="529" font-size="20" fill="#7750ad" font-weight="400">Z=2 → u=.5</text><rect x="714" y="425" width="621" height="171" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">松鼠Z改1：u=−1；数值是教学设定</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">镜头转向后，图像左不必等于世界−X</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">编辑器必须接收相机C与空间D</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">五个候选机位中选择，不是任意坐标最优解</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">世界坐标不变，投影/遮挡仍可改变</text><rect x="28" y="645" width="1344" height="230" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  先生成临时图的主体裁剪估朝向，再用多视角mesh图规划变换</text><rect x="53" y="705" width="610" height="143" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="737" font-size="23" fill="#2376c5" font-weight="700">OrientationEstimator → 当前朝向</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">深度 + 身份 → 临时图 → 每主体裁剪</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">不直接从无纹理mesh猜脸/背</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">临时图画错，也会污染朝向反馈</text><rect x="714" y="705" width="621" height="143" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="737" font-size="23" fill="#7750ad" font-weight="700">TransformPlanner → 旋转/平移/尺度</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">读取当前/目标朝向 + 前左右顶渲染</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">教学pworld=R·S·plocal+b，顺序要明确</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">Euler轴序/度弧度/更新规范主文未给全</text><rect x="28" y="900" width="1344" height="290" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="934" font-size="24" fill="#18334c" font-weight="700">04  编辑：擦旧主体 → 改3D并重渲深度 → 同身份插入 + 潜融合</text><rect x="53" y="960" width="610" height="177" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="992" font-size="23" fill="#17816c" font-weight="700">SubjectEditor(E,I,C,描述,盒子,D)</text><text x="71" y="1025" font-size="19" fill="#18334c" font-weight="400">ObjectClear先移除旧物体，避免重复</text><text x="71" y="1054" font-size="19" fill="#18334c" font-weight="400">扩张主体盒mask留阴影协调空间</text><text x="71" y="1083" font-size="19" fill="#18334c" font-weight="400">M=1编辑：zblend=M·zedit+(1−M)·zbase</text><text x="71" y="1112" font-size="19" fill="#18334c" font-weight="400">必须同噪声时刻，base不应把旧物体拷回</text><rect x="714" y="960" width="621" height="177" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="992" font-size="23" fill="#c36b24" font-weight="700">教学M=(0,1,0)</text><text x="732" y="1025" font-size="19" fill="#18334c" font-weight="400">edit=(9,8,7)，base=(1,2,3)</text><text x="732" y="1054" font-size="19" fill="#18334c" font-weight="400">blend=(1,8,3)，只改中间位置</text><text x="732" y="1083" font-size="19" fill="#18334c" font-weight="400">融合式为阅读补充，具体采样流程待核验</text><text x="732" y="1112" font-size="19" fill="#18334c" font-weight="400">未调用付费规划器、生成器或图像编辑</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>