<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">cryoDeRec ｜成像配对、共享双支与频域补全边界</title><desc id="desc">依据PDF3–5 Fig.2/4、式1–10；残差/DFT/内存数字为教学例，非冷冻电镜实验结果。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">cryoDeRec ｜成像配对、共享双支与频域补全边界</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–5 Fig.2/4、式1–10；残差/DFT/内存数字为教学例，非冷冻电镜实验结果。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  先训练噪声G；冻结后，同一密度生成配准输入/目标</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">实验电影帧 → 运动校正P → 帧减P</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">二维残差训练WGAN-GP；不是精确纯噪声</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">理想独立T=4：差分方差=.75σ²</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">平均投影噪声却为.25σ²，尺度须核验</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">ρ → 两条投影/WBP支路</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">x：有限角 → CTF → 加G噪声 → WBP</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">y：全角、无CTF、无噪 → WBP</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">目标仍是离散重建近似，不是实测真值</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  一个fθ，两次前向；不是两个恢复网络或两个任务头</text><rect x="53" y="425" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="457" font-size="23" fill="#17816c" font-weight="700">第一支 x → fθ(x)，目标y</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">第二支 T_R(x) → FFT → ×M → IFFT → fθ</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">第二支目标为T_R(y)，目标不加mask</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">同一R保持空间配准；M作用在频域</text><text x="71" y="577" font-size="19" fill="#18334c" font-weight="400">原覆盖旋转后再相乘：M(k)W(R⁻¹k)</text><rect x="714" y="425" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">L = Lfidelity + .1 Lrecon</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">两支梯度相加，只更新共享恢复θ</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">G已冻结，不反向训练成像数据生成</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">每块平方和或体素mean会改变梯度尺度</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">主文未给层通道、FFT网格或旋转采样细节</text><rect x="28" y="645" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  8点DFT教学：删频率不能唯一还原；三维M是楔形频域mask</text><rect x="53" y="705" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="737" font-size="23" fill="#2376c5" font-weight="700">x[n]=2+cos(2πn/8)</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">DFT：DC=16，±1频率各4</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">仅留DC → IFFT后每一点都是2</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">抹去频率影响全部空间点，不是空间涂黑</text><rect x="714" y="705" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="737" font-size="23" fill="#7750ad" font-weight="700">常数2也变成相同输入</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">两种原信号共享一个被遮蔽观测</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">恢复起伏依赖训练先验，不是测到新证据</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">学习补全必须防结构幻觉，ENL不能证真</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  真实推理只WBP → 切块 → 冻结fθ → 拼接</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="987" font-size="23" fill="#17816c" font-weight="700">作者96³块、重叠32，内部步长64</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">教学192³若末块贴边：0/64/96起点</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">每轴3块，共27块；末端重叠变64</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">作者padding/拼接权重未展开</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">不把任意教学拼接方案冒充原代码</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="987" font-size="23" fill="#c36b24" font-weight="700">B=4单份float32输入约13.5MiB</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">同大小complex64频谱约27MiB</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">目标/双支激活/梯度/优化器另计</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">FFT约QlogQ，网络成本需层配置</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未训练模型或恢复真实电镜体积</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>