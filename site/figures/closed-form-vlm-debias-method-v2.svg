30789445 450.0,1003.5988118800235 454.0,1004.0453262364317 458.0,1004.4477592942513 462.0,1004.8054830035622 466.0,1005.1178471435728 470.0,1005.3841782874184 474.0,1005.6037787020197 478.0,1005.7759251779639 482.0,1005.8998677839063 486.0,1005.9748285394635 490.0,1006.0000000000001" fill="none" stroke="#17816c" stroke-width="4"/><circle cx="249.43987541732682" cy="934.2520560622029" r="6" fill="#7750ad"/><text x="95" y="798" font-size="17" fill="#18334c" font-weight="400">1</text><text x="474" y="1035" font-size="19" fill="#18334c" font-weight="400">α=.6</text><text x="120" y="1049" font-size="19" fill="#18334c" font-weight="400">橙：L/a ；绿：V/(1−b)</text><rect x="570" y="791" width="767" height="215" fill="#fff" stroke="#7750ad" rx="16"/><text x="588" y="823" font-size="23" fill="#7750ad" font-weight="700">两条曲线的交点是实际闭式解</text><text x="588" y="856" font-size="19" fill="#18334c" font-weight="400">E=a+(1−b)/a；b√(1−α²)=1−Eα</text><text x="588" y="885" font-size="19" fill="#18334c" font-weight="400">平方 → (E²+b²)α²−2Eα+a²=0</text><text x="588" y="914" font-size="19" fill="#18334c" font-weight="400">取减号根，并检查 0≤α≤a、1−Eα≥0</text><text x="588" y="943" font-size="19" fill="#18334c" font-weight="400">α/a = V/.2 ≈ .3985997</text><text x="588" y="972" font-size="19" fill="#18334c" font-weight="400">未归一化 max(L,V) 的解 .1291901 是另一个问题</text><rect x="28" y="1097" width="1344" height="170" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="1131" font-size="24" fill="#18334c" font-weight="700">04  保证与实际任务分开验收</text><rect x="53" y="1151" width="1283" height="89" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="1183" font-size="23" fill="#2376c5" font-weight="700">表示界：相似度变化 ≤ √(2VI) + √(2VT)</text><text x="71" y="1216" font-size="19" fill="#18334c" font-weight="400">不直接保证F1或检索排名；原型提示、退化输入、数值秩及查询相关图库处理另需核验</text><text x="36" y="1287" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>