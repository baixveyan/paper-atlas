<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1310" viewBox="0 0 1400 1310" role="img" aria-labelledby="title desc"><title id="title">闭式 VLM 去偏 ｜从原型差到归一化最坏损失的交点</title><desc id="desc">依据正文 §3–4 与补充A；几何与曲线为 a=.6、b=.8 的教学计算，未运行下游模型。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1310" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">闭式 VLM 去偏 ｜从原型差到归一化最坏损失的交点</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据正文 §3–4 与补充A；几何与曲线为 a=.6、b=.8 的教学计算，未运行下游模型。</text><rect x="28" y="115" width="1344" height="260" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  差空间只保留属性变化；完整原型可能把公共语义也删掉</text><path d="M100,329 L433,329" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M100,329 L100,180" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><path d="M100,329 L340,209" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><text x="355" y="209" font-size="20" fill="#17816c" font-weight="400">p₁=(.8,.6)</text><text x="128" y="182" font-size="19" fill="#c36b24" font-weight="400">属性纵轴 A</text><text x="170" y="359" font-size="20" fill="#2376c5" font-weight="400">共同内容横轴 A⊥</text><rect x="553" y="177" width="780" height="158" fill="#fff" stroke="#17816c" rx="16"/><text x="571" y="209" font-size="23" fill="#17816c" font-weight="700">p₁=(.8,.6)，p₂=(.8,−.6) 都是单位向量</text><text x="571" y="242" font-size="19" fill="#18334c" font-weight="400">差 p₂−p₁=(0,−1.2) → A 是纵轴</text><text x="571" y="271" font-size="19" fill="#18334c" font-weight="400">完整原型张成二维平面；投掉整个平面会只剩零向量</text><text x="571" y="300" font-size="19" fill="#18334c" font-weight="400">待处理 e=(.8,.6)：a=‖e∥‖=.6，b=‖e⊥‖=.8</text><rect x="28" y="398" width="1344" height="310" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="432" font-size="24" fill="#18334c" font-weight="700">02  在二维单位圆上折中：输出仍为单位向量</text><path d="M100,652 L440,652" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M100,652 L100,442" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><path d="M100 452 A200 200 0 0 1 300 652" fill="none" stroke="#b6c7d6" stroke-width="2"/><path d="M100,652 L260,532" fill="none" stroke="#c36b24" stroke-width="3" marker-end="url(#c36b24)" /><text x="274" y="525" font-size="20" fill="#c36b24" font-weight="400">e=(.8,.6)</text><path d="M100,652 L294.196,604.168" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><text x="313" y="601" font-size="22" fill="#17816c" font-weight="700">u⋆</text><text x="155" y="684" font-size="20" fill="#18334c" font-weight="400">α 是纵轴属性系数</text><rect x="570" y="457" width="767" height="194" fill="#fff" stroke="#17816c" rx="16"/><text x="588" y="489" font-size="23" fill="#17816c" font-weight="700">u(α)=α v∥ + √(1−α²) v⊥</text><text x="588" y="522" font-size="19" fill="#18334c" font-weight="400">归一化平衡：α⋆=.2391598</text><text x="588" y="551" font-size="19" fill="#18334c" font-weight="400">u⋆≈(.9709802,.2391598)，范数=1</text><text x="588" y="580" font-size="19" fill="#18334c" font-weight="400">L=.2391598；V=1−⟨u,e⟩≈.07971994</text><text x="588" y="609" font-size="19" fill="#18334c" font-weight="400">两原型相似度之差 = 1.2α⋆≈.2869918</text><text x="588" y="638" font-size="19" fill="#18334c" font-weight="400">仍残留属性，不把平衡去偏称为完全中和</text><rect x="28" y="732" width="1344" height="340" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="766" font-size="24" fill="#18334c" font-weight="700">03  必须先归一化：平衡的是 L/a 与 V/(1−b)</text><path d="M90,1006 L510,1006" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M90,1006 L90,808" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><polyline points="90.0,1006.0 94.0,1004.2 98.0,1002.4 102.0,1000.6 106.0,998.8 110.0,997.0 114.0,995.2 118.0,993.4 122.0,991.6 126.0,989.8 130.0,988.0 134.0,986.2 138.0,984.4 142.0,982.6 146.0,980.8 150.0,979.0 154.0,977.2 158.0,975.4 162.0,973.6 166.0,971.8 170.0,970.0 174.0,968.2 178.0,966.4 182.0,964.6 186.0,962.8 190.0,961.0 194.0,959.2 198.0,957.4 202.0,955.6 206.0,953.8 210.0,952.0 214.0,950.2 218.0,948.4 222.0,946.6 226.0,944.8 230.0,943.0 234.0,941.2 238.0,939.4 242.0,937.6 246.0,935.8 250.0,934.0 254.0,932.2 258.0,930.4 262.0,928.6 266.0,926.8 270.0,925.0 274.0,923.2 278.0,921.4 282.0,919.6 286.0,917.8 290.0,916.0 294.0,914.2 298.0,912.4 302.0,910.6 306.0,908.8 310.0,907.0 314.0,905.2 318.0,903.4 322.0,901.6 326.0,899.8 330.0,898.0 334.0,896.2 338.0,894.4 342.0,892.6 346.0,890.8 350.0,889.0 354.0,887.2 358.0,885.4 362.0,883.6 366.0,881.8 370.0,880.0 374.0,878.2 378.0,876.4 382.0,874.6 386.0,872.8 390.0,871.0 394.0,869.2 398.0,867.4 402.0,865.6 406.0,863.8 410.0,862.0 414.0,860.2 418.0,858.4 422.0,856.6 426.0,854.8 430.0,853.0 434.0,851.2 438.0,849.4000000000001 442.0,847.5999999999999 446.0,845.8 450.0,844.0 454.0,842.2 458.0,840.4 462.0,838.6 466.0,836.8 470.0,835.0 474.0,833.2 478.0,831.4 482.0,829.6 486.0,827.8 490.0,826.0" fill="none" stroke="#c36b24" stroke-width="4"/><polyline points="90.0,826.0 94.0,829.227039883358 98.0,832.4281581336256 102.0,835.6033505506292 106.0,838.7526101315573 110.0,841.8759270671765 1