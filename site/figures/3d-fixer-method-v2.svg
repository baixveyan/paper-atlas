<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">3D-Fixer ｜扩展边界、几何投影与同噪声ORFA</title><desc id="desc">依据PDF3–5 Fig.2–3、式1；边界/网格/余弦为教学例，未运行场景补全。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">3D-Fixer ｜扩展边界、几何投影与同噪声ORFA</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–5 Fig.2–3、式1；边界/网格/余弦为教学例，未运行场景补全。</text><rect x="28" y="115" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  可见碎片AABB → 同中心宽松立方盒：三个轴边长都是4s_max</text><rect x="90" y="180" width="250" height="180" fill="#f6f9fc" stroke="#2376c5" rx="0"/><rect x="185" y="252" width="65" height="32" fill="#fff0e5" stroke="#c36b24" rx="0"/><text x="100" y="211" font-size="20" fill="#2376c5" font-weight="700">宽松范围B_exp</text><text x="168" y="311" font-size="19" fill="#c36b24" font-weight="400">可见B_vis</text><text x="95" y="395" font-size="18" fill="#586d80" font-weight="400">示意切片；非按实际轴尺度绘制</text><rect x="714" y="175" width="621" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="207" font-size="23" fill="#2376c5" font-weight="700">教学vis：x[2,3] y[0,.5] z[4,4.2]</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">C=(2.5,.25,4.1)，s_max=1，边长4</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">exp：x[.5,4.5] y[−1.75,2.25] z[2.1,6.1]</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">若完整物体延伸到x8，盒仍覆盖不了</text><text x="732" y="327" font-size="19" fill="#18334c" font-weight="400">4倍是工程范围假设，非任意遮挡证明</text><rect x="28" y="425" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="459" font-size="24" fill="#18334c" font-weight="700">02  宽松盒coarse定B_full → 紧盒fine细化 → 可见性引导纹理</text><rect x="53" y="485" width="610" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="517" font-size="23" fill="#17816c" font-weight="700">教学64格轴：边长4 → 格宽.0625</text><text x="71" y="550" font-size="19" fill="#18334c" font-weight="400">若fine边长1.6 → 格宽.025，更细2.5倍</text><text x="71" y="579" font-size="19" fill="#18334c" font-weight="400">局部归一与逆变换必须同步条件坐标</text><text x="71" y="608" font-size="19" fill="#18334c" font-weight="400">B_full裁错会限制fine能恢复的范围</text><rect x="714" y="485" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="517" font-size="23" fill="#7750ad" font-weight="700">GAFP：MoGe v2图像feature→visible voxel</text><text x="732" y="550" font-size="19" fill="#18334c" font-weight="400">局部空间对齐 + 全局feature cross-attention</text><text x="732" y="579" font-size="19" fill="#18334c" font-weight="400">depth/visibility-ratio embedding细节在补充</text><text x="732" y="608" font-size="19" fill="#18334c" font-weight="400">不可见面仍靠先验，非复制已观测背面纹理</text><rect x="28" y="675" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="709" font-size="24" fill="#18334c" font-weight="700">03  ORFA训练：teacher clean图 / student遮挡图，共享z_t和t</text><rect x="53" y="735" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="767" font-size="23" fill="#2376c5" font-weight="700">L_AL=−E[平均sim(h_s,h)]</text><text x="71" y="800" font-size="19" fill="#18334c" font-weight="400">降低负相似度，让中间特征更接近</text><text x="71" y="829" font-size="19" fill="#18334c" font-weight="400">教学cos：h=(1,0)、hs=(.8,.6) → −.8</text><text x="71" y="858" font-size="19" fill="#18334c" font-weight="400">hs=(1,0) → −1，仅方向例，sim实现待核</text><rect x="714" y="735" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="767" font-size="23" fill="#c36b24" font-weight="700">FM同时训练生成目标，不只对齐feature</text><text x="732" y="800" font-size="19" fill="#18334c" font-weight="400">teacher固定，base prior固定，新条件分支训练</text><text x="732" y="829" font-size="19" fill="#18334c" font-weight="400">注入条件仍需经固定层传回输入梯度</text><text x="732" y="858" font-size="19" fill="#18334c" font-weight="400">路径/solver/步数/逐参数配置正文未给全</text><rect x="28" y="925" width="1344" height="265" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="959" font-size="24" fill="#18334c" font-weight="700">04  推理无需clean图/teacher；逐物体in-place补全省显式配准搜索</text><rect x="53" y="985" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="1017" font-size="23" fill="#17816c" font-weight="700">独立并行≠无限物体无显存成本</text><text x="71" y="1050" font-size="19" fill="#18334c" font-weight="400">attention教学∑Li² vs 全联合(∑Li)²</text><text x="71" y="1079" font-size="19" fill="#18334c" font-weight="400">还需coarse/fine迭代、条件编码与纹理</text><text x="71" y="1108" font-size="19" fill="#18334c" font-weight="400">mask/fragment/三个盒/逆变换逐项保存</text><text x="71" y="1137" font-size="19" fill="#18334c" font-weight="400">初始几何偏差会传到完整资产</text><rect x="714" y="985" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="1017" font-size="23" fill="#7750ad" font-weight="700">布局对齐不自动保证物理一致</text><text x="732" y="1050" font-size="19" fill="#18334c" font-weight="400">多物体仍可穿插，遮挡背面存在多解</text><text x="732" y="1079" font-size="19" fill="#18334c" font-weight="400">局部盒操作不是已运行原代码</text><text x="732" y="1108" font-size="19" fill="#18334c" font-weight="400">仅验算边界/坐标/尺度/余弦教学例</text><text x="732" y="1137" font-size="19" fill="#18334c" font-weight="400">未运行模型、渲染场景或下载ARSG数据</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>