<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">4D Primitive-Mache ｜刚性碎片、逆变换链与遮挡延续</title><desc id="desc">依据主文 §3、Fig.2/3/5与式1–6；坐标与最小二乘是教学算例，未运行作者重建。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">4D Primitive-Mache ｜刚性碎片、逆变换链与遮挡延续</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3、Fig.2/3/5与式1–6；坐标与最小二乘是教学算例，未运行作者重建。</text><rect x="28" y="115" width="1344" height="240" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  观测点图 + 时间分区 + 邻帧跟踪 → 每片段一个SE(3)</text><rect x="52" y="176" width="375" height="143" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="208" font-size="23" fill="#2376c5" font-weight="700">π³点图：H×W×3</text><text x="70" y="241" font-size="19" fill="#18334c" font-weight="400">每像素是观测时刻的世界3D点</text><text x="70" y="270" font-size="19" fill="#18334c" font-weight="400">SAM2传播对象ID与mask</text><text x="70" y="299" font-size="19" fill="#18334c" font-weight="400">分区内假设近似刚性</text><rect x="484" y="176" width="390" height="143" fill="#fff" stroke="#7750ad" rx="16"/><text x="502" y="208" font-size="23" fill="#7750ad" font-weight="700">2D对应采样目标3D点</text><text x="502" y="241" font-size="19" fill="#18334c" font-weight="400">u → u+flow(u) → Xj采样</text><text x="502" y="270" font-size="19" fill="#18334c" font-weight="400">双方同对象mask、置信加权</text><text x="502" y="299" font-size="19" fill="#18334c" font-weight="400">2D flow不是直接的3D位移</text><rect x="932" y="176" width="405" height="143" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="208" font-size="23" fill="#17816c" font-weight="700">几何后端估计刚性运动</text><text x="950" y="241" font-size="19" fill="#18334c" font-weight="400">动态片段6维增量；静态冻结</text><text x="950" y="270" font-size="19" fill="#18334c" font-weight="400">固定对象最后可见片段T=I</text><text x="950" y="299" font-size="19" fill="#18334c" font-weight="400">不重新训练前端模型</text><path d="M427,247 L477,247" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,247 L925,247" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="380" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="414" font-size="24" fill="#18334c" font-weight="700">02  先到共同参考，再拉回目标：T(p→q)=Tq⁻¹Tp</text><circle cx="105" cy="487" r="8" fill="#2376c5"/><text x="65" y="464" font-size="21" fill="#2376c5" font-weight="700">来源p：x=1</text><circle cx="455" cy="487" r="8" fill="#17816c"/><text x="415" y="464" font-size="21" fill="#17816c" font-weight="700">目标q：x=3</text><circle cx="1015" cy="487" r="8" fill="#7750ad"/><text x="975" y="464" font-size="21" fill="#7750ad" font-weight="700">参考：x=5</text><path d="M112 488 L112 546 L1015 546 L1015 497" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="418" y="574" font-size="20" fill="#2376c5" font-weight="400">Tp：+4 → 参考5</text><path d="M1008 487 L1008 507 L455 507 L455 497" fill="none" stroke="#17816c" stroke-width="3" marker-end="url(#17816c)" /><text x="628" y="493" font-size="20" fill="#17816c" font-weight="400">Tq⁻¹：−2 → 目标3</text><text x="70" y="608" font-size="21" fill="#18334c" font-weight="700">净变换 +2；直接用Tp会放错到参考5。纯平移可交换，一般旋转不可随意反序。</text><rect x="28" y="655" width="1344" height="240" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="689" font-size="24" fill="#18334c" font-weight="700">03  残差 → 线性化 → IRLS / Gauss–Newton更新位姿</text><rect x="53" y="715" width="610" height="144" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="747" font-size="23" fill="#2376c5" font-weight="700">纯平移教学：两组对应都需要+2</text><text x="71" y="780" font-size="19" fill="#18334c" font-weight="400">r=[d−2,d−2]，当前d=0</text><text x="71" y="809" font-size="19" fill="#18334c" font-weight="400">J=[1,1]ᵀ，W=I → 2τ=4</text><text x="71" y="838" font-size="19" fill="#18334c" font-weight="400">τ=2 → d更新到2，残差归零</text><rect x="714" y="715" width="621" height="144" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="747" font-size="23" fill="#c36b24" font-weight="700">真实优化：JᵀWJτ=−JᵀWr</text><text x="732" y="780" font-size="19" fill="#18334c" font-weight="400">Huber降低离群影响，不自动修正错分割</text><text x="732" y="809" font-size="19" fill="#18334c" font-weight="400">原文置信乘在鲁棒代价内部，不能乱挪权重</text><text x="732" y="838" font-size="19" fill="#18334c" font-weight="400">⊕左右约定、阻尼与阈值需实现核验</text><rect x="28" y="920" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="954" font-size="24" fill="#18334c" font-weight="700">04  遮挡后靠关联运动延续，不是重新观察到隐藏表面</text><rect x="52" y="980" width="375" height="146" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="1012" font-size="23" fill="#2376c5" font-weight="700">仍可见：抽屉前板</text><text x="70" y="1045" font-size="19" fill="#18334c" font-weight="400">OBB扩大1.1，接触候选</text><text x="70" y="1074" font-size="19" fill="#18334c" font-weight="400">相对增量比较：规约F相消</text><text x="70" y="1103" font-size="19" fill="#18334c" font-weight="400">不是绝对T数值相近就同运动</text><rect x="484" y="980" width="390" height="146" fill="#fff" stroke="#7750ad" rx="16"/><text x="502" y="1012" font-size="23" fill="#7750ad" font-weight="700">关联：抽屉本体</text><text x="502" y="1045" font-size="19" fill="#18334c" font-weight="400">前板 ↔ 本体 ↔ 内部物体</text><text x="502" y="1074" font-size="19" fill="#18334c" font-weight="400">接触图可传递，优先速度相似</text><text x="502" y="1103" font-size="19" fill="#18334c" font-weight="400">内部不需直接碰前板</text><rect x="932" y="980" width="405" height="146" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="1012" font-size="23" fill="#17816c" font-weight="700">被遮挡：内部小物体</text><text x="950" y="1045" font-size="19" fill="#18334c" font-weight="400">依赖继续随父对象运动的假设</text><text x="950" y="1074" font-size="19" fill="#18334c" font-weight="400">若独自滑动，外部视频无法知道</text><text x="950" y="1103" font-size="19" fill="#18334c" font-weight="400">未见几何不能凭记忆变成真值</text><path d="M427,1050 L477,1050" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,1050 L925,1050" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><text x="64" y="1178" font-size="20" fill="#18334c" font-weight="700">运动参数约O(MK)；显式保存每时刻全部来源点图仍可达O(K²HW)。150帧分块不等于无限增量建图。</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>