<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">DNRNet ｜局部/全局纠正、置信门控与批停止</title><desc id="desc">依据PDF3–5 Fig.2、式1–13；低维状态/门控/批停止均为教学例，非情感模型实测。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">DNRNet ｜局部/全局纠正、置信门控与批停止</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–5 Fig.2、式1–13；低维状态/门控/批停止均为教学例，非情感模型实测。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  每轮旧x快照：Local本模态推断 → Global跨模态补充 → 同步更新</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">Local：FF → 两层Transformer HLI</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">Feedback → 两层Tanh MLP → L_m</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">CA：Transformer+Sigmoid给w_m，各路独立</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">w软目标1−缺失率，非语义正确概率</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="207" font-size="23" fill="#17816c" font-weight="700">C_m=Σ_i≠m w_i x_i（不是归一平均）</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">L_m作Q，C_m作K/V，时间attention</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">G_m=(1−w_m)×attention，弱自身多借外部</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">所有模态基于同一t状态，不原地混入t+1</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  教学单位置/identity：音频[1,0]w.8，文本[0,2]w.9</text><rect x="53" y="425" width="610" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="457" font-size="23" fill="#7750ad" font-weight="700">C_v=[.8,1.8]，w_v=.2 → G_v=[.64,1.44]</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">x_v=[1,−1]，L_v=[.2,−.2]，教学λ=.5</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">残差相加=[1.42,−.38]</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">无affine/忽略ε的二维LN → [1,−1]</text><text x="71" y="577" font-size="19" fill="#18334c" font-weight="400">中间纠正非0，归一后仍可与旧状态一样</text><rect x="714" y="425" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="457" font-size="23" fill="#c36b24" font-weight="700">真实λ可训练，LN有配置，不套教学数</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">x_next=LN(x+λ(L+G))</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">同一模态T/d对齐后才能逐元素加</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">弱置信/完整但误导输入不能简单等同</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">对齐/padding/随机重建目标细节需源码核查</text><rect x="28" y="645" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  flatten三模态S；每样本相对L2后按batch平均，小于1e−4停止</text><rect x="53" y="705" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="737" font-size="23" fill="#2376c5" font-weight="700">教学B64：63个变化0，1个变化.005</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">均值=.000078125 &lt; .0001 → 整批停</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">该单样本仍高于阈值；批组成会影响轮数</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">稳定不证明正确、最优或事实恢复</text><rect x="714" y="705" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="737" font-size="23" fill="#17816c" font-weight="700">正文无完整最大轮数/无收敛兜底</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">LayerNorm/Tanh不自动保证收缩映射</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">ξ防旧状态零范数；图不能代替终止检查</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">“主动”是内部迭代，不重新采集原数据</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  最终三模态相加/池化/linear → 情感score；完整特征只训练监督</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="987" font-size="23" fill="#7750ad" font-weight="700">Ltask + αLca + βLrec</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">task/置信MSE，重建是特征平方L2</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">完整U经encoder作为目标，不进测试输入</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">重建目标detach/损失逐轮聚合未完整给出</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">不是输出原视频/波形或真实心理状态</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="987" font-size="23" fill="#c36b24" font-weight="700">B64/T8/d128三模态状态约.75MiB/轮</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">不含QKV/MLP/BERT/反传与多轮缓存</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">n轮会重复计算，需实际时延/轮次分布</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">仅验算加权/门控/LN/停止/内存</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未训练模型或运行情感预测</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>