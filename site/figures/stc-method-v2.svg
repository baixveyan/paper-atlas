<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">STC ｜参考帧时钟、选择行计算与因果双锚点</title><desc id="desc">依据PDF3–8 Fig.3–6、式1–9；二维锚点与token计数是教学例，Q/K/V歧义保留待核。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">STC ｜参考帧时钟、选择行计算与因果双锚点</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–8 Fig.3–6、式1–9；二维锚点与token计数是教学例，Q/K/V歧义保留待核。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  J=4教学：参考0完整编码；帧1/2/3均复用0；帧4刷新</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">ViT每层缓存K/V/attention输出/MLP</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">P=8，复用率75% → 选2行重算</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">相似度[1,.99,.9,.8,.95,.4,−.2,.98]</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">从1计数选择第7/6，完整输出仍8行</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="207" font-size="23" fill="#c36b24" font-weight="700">k个Q读取P个K/V，不是k×k</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">2×8分数 → softmax → 2行新输出</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">scatter到参考输出副本，静态行沿用</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">式4–6的K/V写法不自洽，完整策略待核</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  先编码完整Z → 当前SCA / 过去TCA → 评分 → 才更新历史</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="457" font-size="23" fill="#17816c" font-weight="700">SCA=当前P个token均值</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">TCA=至多W个过去帧均值的平均</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">旧H不含当前帧；评分完再append SCA</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">首帧空历史/零范数/α和W默认未展开</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="457" font-size="23" fill="#7750ad" font-weight="700">S=α(1−cos TCA)+(1−α)(1−cos SCA)</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">按式8是加权和，非附近所称乘积</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">TopK后才缩短LLM视觉序列</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">更新缓存/锚点≠训练模型参数</text><rect x="28" y="615" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  4 token二维教学：两锚点+余弦+排序可手算</text><rect x="53" y="675" width="610" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="707" font-size="23" fill="#2376c5" font-weight="700">Z=[(1,0),(1,0),(0,1),(−1,0)]</text><text x="71" y="740" font-size="19" fill="#18334c" font-weight="400">TCA=(1,0)，SCA=(.25,.25)，α=.5</text><text x="71" y="769" font-size="19" fill="#18334c" font-weight="400">分数≈[.146447,.146447,.646447,1.853553]</text><text x="71" y="798" font-size="19" fill="#18334c" font-weight="400">裁减50% → 选择第4/3行</text><text x="71" y="827" font-size="19" fill="#18334c" font-weight="400">投影与输入仍需保留原时间/空间位置</text><rect x="714" y="675" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="707" font-size="23" fill="#c36b24" font-weight="700">新颖只是代理，不保证未知问题有用</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">常驻文字可能低分，罕见噪声可能高分</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">Cacher误差会改变Z、锚点和最终排名</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">实验单Pruner裁75%、联合裁70%</text><text x="732" y="827" font-size="19" fill="#18334c" font-weight="400">式后25%例子写反，切勿混淆保留/裁减</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  两种缓存分开：ViT参考状态 ≠ 基底LLM的历史KV</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="987" font-size="23" fill="#17816c" font-weight="700">J4/重算.25：理想周期占比.4375</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">仅选中重算部分，不含全Key/LN/索引</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">教学16帧×100token，留30% → 480</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">不是论文实际token配置</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">缓存带宽、文本历史、解码均另计</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="987" font-size="23" fill="#7750ad" font-weight="700">所有权重冻结，仅处理已到达帧</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">非参考帧只降低部分ViT计算</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">Pruner主要降低LLM预填充成本</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">.3²=.09仅纯视觉二次项，非总时延</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未运行模型或测量GPU加速</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>