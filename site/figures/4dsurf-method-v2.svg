<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">4DSurf ｜法向flow、重叠段几何与LoRA继承</title><desc id="desc">依据PDF3–6 Fig.2–3、式1–6；平面/时间段/矩阵数字为教学例，偏导与参数化缺口待核。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">4DSurf ｜法向flow、重叠段几何与LoRA继承</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–6 Fig.2–3、式1–6；平面/时间段/矩阵数字为教学例，偏导与参数化缺口待核。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  每段G个二维高斯盘 + 时间运动场 → 变形盘 → 可微渲染</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">canonical μ:G×3 / q:G×4 / ξ:G×2</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">Fθ(μ,t) → v3 + ω3 + e2，共G×8</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">μt=μ+t v；qt=φ(tω)⊗q；ξt=ξ+t e</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">若v随t变，dμt/dt=v+t∂tv，不能当ODE</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="207" font-size="23" fill="#c36b24" font-weight="700">RGB / 深度 / 法向 / alpha共同参与优化</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">光轴深度差D(p*)−d(μt)近似SDF</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">不是任意点精确欧氏距离或传感真值</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">偏导/移动采样/多相机口径待补充核验</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  运输方程 ∂ts+∇s·u=0 → f=−u·n，约束只有法向分量</text><rect x="53" y="425" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="457" font-size="23" fill="#17816c" font-weight="700">教学平面s=z−a(t)，n=(0,0,1)</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">u=(0,0,.2) → f=−.2</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">u=(1,0,.2) → f仍−.2</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">纯切向(1,0,0) → f=0，仍可在移动</text><text x="71" y="577" font-size="19" fill="#18334c" font-weight="400">旋转项ω×Rx需要同一坐标与旋转中心</text><rect x="714" y="425" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="457" font-size="23" fill="#7750ad" font-weight="700">运动flow与深度flow是同模型两种估计</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">Lflow=Σ|f−ftilde|，不是双真值监督</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">教学−.2与−.1 → 该项残差.1</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">两侧可共同错误但一致，需图像等项</text><text x="732" y="577" font-size="19" fill="#18334c" font-weight="400">中心采样+局部刚性不保证整个盘任意形变</text><rect x="28" y="645" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  K=5教学：段1[1…6] → 段2[6…11] → 段3[11…16]</text><rect x="53" y="705" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="737" font-size="23" fill="#2376c5" font-weight="700">6/11是共享virtual时刻</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">前段边界变形高斯 → 后段canonical初始化</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">新可见区域可新建高斯；各段canonical独立</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">继承初始化不等于严格全序列连续约束</text><rect x="714" y="705" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="737" font-size="23" fill="#c36b24" font-weight="700">导出交界只保留一次</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">段1输出1…5，段2输出6…10</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">末段教学保留11…16，共16唯一时刻</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">真实尾段规则须核，不能无条件丢最后帧</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  IMT冻上一段线性基底；当前LoRA和三个输出head可训</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="987" font-size="23" fill="#17816c" font-weight="700">θN=θN−1+ANBN，不是只加到初始base</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">教学256²矩阵，r16 → 8192参数</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">完整65536，单层仅12.5%，其他部分另计</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">θ3=θ1+Δθ2+Δθ3，需要累积历史增量</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">多个低秩增量之和rank可能继续增加</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="987" font-size="23" fill="#7750ad" font-weight="700">canonical几何仍逐段保存</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">LoRA省运动场，不省全部模型同样比例</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">每时刻渲染训练视角深度 → TSDF融合</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">体素/截断/有效深度参数主文未展开</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未训练场景、提网格或做GPU计时</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>