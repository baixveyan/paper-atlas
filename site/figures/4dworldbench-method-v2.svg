<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc"><title id="title">4DWorldBench ｜从问答证据到几何、运动与风格评分</title><desc id="desc">依据主文 §4–5 与补充 §1、式1–9；小矩阵与轨迹数值为教学例，非生成模型实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1250" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">4DWorldBench ｜从问答证据到几何、运动与风格评分</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §4–5 与补充 §1、式1–9；小矩阵与轨迹数值为教学例，非生成模型实验。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  两份证据：条件决定应有现象，输出提供实际发生的证据</text><rect x="52" y="176" width="375" height="148" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="208" font-size="23" fill="#2376c5" font-weight="700">条件 C → 条件描述 TC</text><text x="70" y="241" font-size="19" fill="#18334c" font-weight="400">文本直接用；图像/视频先转字幕</text><text x="70" y="270" font-size="19" fill="#18334c" font-weight="400">按语义选择物理维度</text><text x="70" y="299" font-size="19" fill="#18334c" font-weight="400">生成诊断问题与参考答案</text><rect x="484" y="176" width="390" height="148" fill="#fff" stroke="#c36b24" rx="16"/><text x="502" y="208" font-size="23" fill="#c36b24" font-weight="700">输出视频 V → 输出描述 T̂</text><text x="502" y="241" font-size="19" fill="#18334c" font-weight="400">物理：LLM按实际字幕答题</text><text x="502" y="270" font-size="19" fill="#18334c" font-weight="400">不能根据常识替视频补出变形</text><text x="502" y="299" font-size="19" fill="#18334c" font-weight="400">对齐另有MLLM直接看视频路径</text><rect x="932" y="176" width="405" height="148" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="208" font-size="23" fill="#17816c" font-weight="700">逐题匹配 → 分支命中率</text><text x="950" y="241" font-size="19" fill="#18334c" font-weight="400">sᵢ=1[预测答案=参考答案]</text><text x="950" y="270" font-size="19" fill="#18334c" font-weight="400">10问仅2题正确 → .2</text><text x="950" y="299" font-size="19" fill="#18334c" font-weight="400">存在性题正确 ≠ 物理过程正确</text><path d="M427,248 L477,248" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,248 L925,248" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="385" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  相机控制与重投影：一个测指定轨迹，一个测几何自洽</text><rect x="53" y="445" width="610" height="157" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="477" font-size="23" fill="#7750ad" font-weight="700">相机控制：SLAM轨迹对照指定轨迹</text><text x="71" y="510" font-size="19" fill="#18334c" font-weight="400">旋转差4°，尺度对齐后位置差.25</text><text x="71" y="539" font-size="19" fill="#18334c" font-weight="400">√(4×.25)=1，量纲并非像素或度</text><text x="71" y="568" font-size="19" fill="#18334c" font-weight="400">位置差=0 → 乘积0，即使仍有旋转错误</text><text x="71" y="597" font-size="19" fill="#18334c" font-weight="400">需同时保留旋转与平移原始分量</text><rect x="714" y="445" width="621" height="157" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="477" font-size="23" fill="#2376c5" font-weight="700">几何一致性：三维点投影回图像</text><text x="732" y="510" font-size="19" fill="#18334c" font-weight="400">观测(100,50)，投影(103,54)</text><text x="732" y="539" font-size="19" fill="#18334c" font-weight="400">像素残差√(3²+4²)=5，不是25</text><text x="732" y="568" font-size="19" fill="#18334c" font-weight="400">先片段内平均，再跨短片段平均</text><text x="732" y="597" font-size="19" fill="#18334c" font-weight="400">SLAM自洽不等于完整世界真值</text><rect x="28" y="665" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="699" font-size="24" fill="#18334c" font-weight="700">03  风格Gram会丢空间位置：交换两列后距离仍为0</text><text x="63" y="733" font-size="23" fill="#2376c5" font-weight="700">特征 F₁</text><rect x="73" y="754" width="74" height="54" fill="#fff" stroke="#2376c5" rx="4"/><text x="102" y="789" font-size="24" fill="#2376c5" font-weight="700">1</text><rect x="158" y="754" width="74" height="54" fill="#fff" stroke="#2376c5" rx="4"/><text x="187" y="789" font-size="24" fill="#2376c5" font-weight="700">0</text><rect x="73" y="818" width="74" height="54" fill="#fff" stroke="#2376c5" rx="4"/><text x="102" y="853" font-size="24" fill="#2376c5" font-weight="700">0</text><rect x="158" y="818" width="74" height="54" fill="#fff" stroke="#2376c5" rx="4"/><text x="187" y="853" font-size="24" fill="#2376c5" font-weight="700">2</text><text x="365" y="733" font-size="23" fill="#c36b24" font-weight="700">空间列交换 F₂</text><rect x="375" y="754" width="74" height="54" fill="#fff" stroke="#c36b24" rx="4"/><text x="404" y="789" font-size="24" fill="#c36b24" font-weight="700">0</text><rect x="460" y="754" width="74" height="54" fill="#fff" stroke="#c36b24" rx="4"/><text x="489" y="789" font-size="24" fill="#c36b24" font-weight="700">1</text><rect x="375" y="818" width="74" height="54" fill="#fff" stroke="#c36b24" rx="4"/><text x="404" y="853" font-size="24" fill="#c36b24" font-weight="700">2</text><rect x="460" y="818" width="74" height="54" fill="#fff" stroke="#c36b24" rx="4"/><text x="489" y="853" font-size="24" fill="#c36b24" font-weight="700">0</text><text x="716" y="733" font-size="23" fill="#17816c" font-weight="700">共同 Gram = FFᵀ</text><rect x="726" y="754" width="74" height="54" fill="#fff" stroke="#17816c" rx="4"/><text x="755" y="789" font-size="24" fill="#17816c" font-weight="700">1</text><rect x="811" y="754" width="74" height="54" fill="#fff" stroke="#17816c" rx="4"/><text x="840" y="789" font-size="24" fill="#17816c" font-weight="700">0</text><rect x="726" y="818" width="74" height="54" fill="#fff" stroke="#17816c" rx="4"/><text x="755" y="853" font-size="24" fill="#17816c" font-weight="700">0</text><rect x="811" y="818" width="74" height="54" fill="#fff" stroke="#17816c" rx="4"/><text x="840" y="853" font-size="24" fill="#17816c" font-weight="700">4</text><path d="M255,811 L350,811" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M568,811 L698,811" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="1040" y="742" width="296" height="141" fill="#fff" stroke="#7750ad" rx="16"/><text x="1058" y="774" font-size="23" fill="#7750ad" font-weight="700">解释边界</text><text x="1058" y="807" font-size="19" fill="#18334c" font-weight="400">Gram相同，空间可不同</text><text x="1058" y="836" font-size="19" fill="#18334c" font-weight="400">首尾比较可能漏闪烁</text><text x="1058" y="865" font-size="19" fill="#18334c" font-weight="400">风格高分不保证几何</text><rect x="28" y="960" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="994" font-size="24" fill="#18334c" font-weight="700">04  评分协议不能猜：加法、均值、缺失项与归一化分别记录</text><rect x="53" y="1020" width="610" height="149" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="1052" font-size="23" fill="#c36b24" font-weight="700">运动两分量：低级.9、QA .3</text><text x="71" y="1085" font-size="19" fill="#18334c" font-weight="400">相加1.2；平均.6，不能互换</text><text x="71" y="1114" font-size="19" fill="#18334c" font-weight="400">补充文字说平均，式7印成相加</text><text x="71" y="1143" font-size="19" fill="#18334c" font-weight="400">表2保留a+b；本篇不替作者补÷2</text><rect x="714" y="1020" width="621" height="149" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="1052" font-size="23" fill="#2376c5" font-weight="700">静态3D的N/A不是0分</text><text x="732" y="1085" font-size="19" fill="#18334c" font-weight="400">不测事件/运动/物理/运动一致性</text><text x="732" y="1114" font-size="19" fill="#18334c" font-weight="400">仍可评转台视频的时间画质</text><text x="732" y="1143" font-size="19" fill="#18334c" font-weight="400">normalize边界和Overall权重待核验</text><text x="36" y="1227" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>