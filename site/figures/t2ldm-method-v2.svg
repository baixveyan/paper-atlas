<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1220" viewBox="0 0 1400 1220" role="img" aria-labelledby="title desc"><title id="title">T2LDM ｜球面RM、v参数化与训练专用几何指导</title><desc id="desc">依据主文 §4、Fig.2–3与式1–9；点坐标、v转换与角特征是教学例，非LiDAR生成实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1220" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">T2LDM ｜球面RM、v参数化与训练专用几何指导</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §4、Fig.2–3与式1–9；点坐标、v转换与角特征是教学例，非LiDAR生成实验。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  球面点云 → 距离/强度RM；空间大小与噪声步数不能混淆</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">nuScenes：32×1024×2</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">(10,0,0)：r=10，u=512</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">(0,10,0)：r=10，u=256</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">同格碰撞/无效值让投影仅部分可逆</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">训练噪声步t∈{1,…,1024}</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">xt=a·x0+σ·ε，输入噪声RM</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">冻结CLIP给n×768文本特征</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">Q: hw×C；K/V: n×C；W: hw×n</text><rect x="28" y="365" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  v参数化：a=.8、σ=.6，故a²+σ²=1</text><rect x="53" y="425" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="457" font-size="23" fill="#2376c5" font-weight="700">教学干净x0=.5、噪声ε=−1</text><text x="71" y="490" font-size="19" fill="#18334c" font-weight="400">xt=.8×.5+.6×(−1)=−.2</text><text x="71" y="519" font-size="19" fill="#18334c" font-weight="400">v=.8×(−1)−.6×.5=−1.1</text><text x="71" y="548" font-size="19" fill="#18334c" font-weight="400">DN以平方误差学习目标v</text><rect x="714" y="425" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="457" font-size="23" fill="#17816c" font-weight="700">反算x0=a·xt−σ·v=.5</text><text x="732" y="490" font-size="19" fill="#18334c" font-weight="400">反算ε=σ·xt+a·v=−1</text><text x="732" y="519" font-size="19" fill="#18334c" font-weight="400">采样时用预测v换算噪声后走式9</text><text x="732" y="548" font-size="19" fill="#18334c" font-weight="400">实际没有测试真值x0供采样器使用</text><path d="M663,492 L707,492" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="615" width="1344" height="250" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="649" font-size="24" fill="#18334c" font-weight="700">03  GN看干净RM与DN特征；只在训练中提供细节对齐</text><rect x="53" y="675" width="610" height="175" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="707" font-size="23" fill="#c36b24" font-weight="700">前100K步：DN / GN共同适配</text><text x="71" y="740" font-size="19" fill="#18334c" font-weight="400">GN输入x0与多尺度Fnoise，重建x0</text><text x="71" y="769" font-size="19" fill="#18334c" font-weight="400">L = LDN + LGN + λ·LSCRG</text><text x="71" y="798" font-size="19" fill="#18334c" font-weight="400">余弦对齐意图，不是最小化正号cos</text><text x="71" y="827" font-size="19" fill="#18334c" font-weight="400">detach、尺度归约和λ日程需实现核验</text><rect x="714" y="675" width="621" height="175" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="707" font-size="23" fill="#17816c" font-weight="700">100K后GN冻结；推理时GN删除</text><text x="732" y="740" font-size="19" fill="#18334c" font-weight="400">冻结参数 ≠ 所有输入梯度都被切断</text><text x="732" y="769" font-size="19" fill="#18334c" font-weight="400">训练仍可能经固定GN计算辅助信号</text><text x="732" y="798" font-size="19" fill="#18334c" font-weight="400">推理只跑DN：噪声 → RM → 点云</text><text x="732" y="827" font-size="19" fill="#18334c" font-weight="400">不喂干净RM，不声称扩散零成本</text><rect x="28" y="890" width="1344" height="280" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="924" font-size="24" fill="#18334c" font-weight="700">04  DPE给角度身份，不会自动将卷积改为环形连接</text><rect x="68" y="966" width="125" height="54" fill="#fff" stroke="#2376c5" rx="4"/><text x="86" y="1001" font-size="23" fill="#2376c5" font-weight="700">7π/4</text><rect x="208" y="966" width="125" height="54" fill="#fff" stroke="#2376c5" rx="4"/><text x="226" y="1001" font-size="23" fill="#2376c5" font-weight="700">5π/4</text><rect x="348" y="966" width="125" height="54" fill="#fff" stroke="#2376c5" rx="4"/><text x="366" y="1001" font-size="23" fill="#2376c5" font-weight="700">3π/4</text><rect x="488" y="966" width="125" height="54" fill="#fff" stroke="#2376c5" rx="4"/><text x="506" y="1001" font-size="23" fill="#2376c5" font-weight="700">π/4</text><text x="73" y="1063" font-size="20" fill="#2376c5" font-weight="700">教学w=4；第0列sin/cos=(−√2/2,√2/2)</text><text x="73" y="1100" font-size="20" fill="#18334c" font-weight="400">K=2 → 每位置8维；通道相加前须形状相容</text><rect x="714" y="950" width="621" height="174" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="982" font-size="23" fill="#7750ad" font-weight="700">x′=x+α·FourierK(θ,φ)</text><text x="732" y="1015" font-size="19" fill="#18334c" font-weight="400">多频角特征 + 可学习门控</text><text x="732" y="1044" font-size="19" fill="#18334c" font-weight="400">0与2π附近编码接近，不是整数列号</text><text x="732" y="1073" font-size="19" fill="#18334c" font-weight="400">方位原点/FOV与逆投影必须核对</text><text x="732" y="1102" font-size="19" fill="#18334c" font-weight="400">未生成点云、训练或执行检测器</text><text x="36" y="1197" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>