<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title desc"><title id="title">ActiveVLA ｜7通道定位、虚拟放大与三维动作融合</title><desc id="desc">依据正文 §3、Fig.2，PDF3–6；FoV与热图数值为教学例，未运行机器人。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1200" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ActiveVLA ｜7通道定位、虚拟放大与三维动作融合</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据正文 §3、Fig.2，PDF3–6；FoV与热图数值为教学例，未运行机器人。</text><rect x="28" y="115" width="1344" height="245" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  粗 → 虚拟选视角 → 细：始终受同一份观测点云限制</text><rect x="52" y="177" width="375" height="148" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="209" font-size="23" fill="#2376c5" font-weight="700">粗阶段三正交图</text><text x="70" y="242" font-size="19" fill="#18334c" font-weight="400">RGB3 + 深度1 + 世界坐标3</text><text x="70" y="271" font-size="19" fill="#18334c" font-weight="400">H×W×7，不是普通RGB3</text><text x="70" y="300" font-size="19" fill="#18334c" font-weight="400">patch重排 → convex热图 → pf</text><rect x="484" y="177" width="390" height="148" fill="#fff" stroke="#c36b24" rx="16"/><text x="502" y="209" font-size="23" fill="#c36b24" font-weight="700">球面候选与放大</text><text x="502" y="242" font-size="19" fill="#18334c" font-weight="400">围绕 pf 选三个虚拟相机</text><text x="502" y="271" font-size="19" fill="#18334c" font-weight="400">可见 / 距离 / 多样性综合排序</text><text x="502" y="300" font-size="19" fill="#18334c" font-weight="400">粗细 PaliGemma 共享权重</text><rect x="932" y="177" width="405" height="148" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="209" font-size="23" fill="#17816c" font-weight="700">细阶段与最终动作</text><text x="950" y="242" font-size="19" fill="#18334c" font-weight="400">3图热图融合 → 三维平移峰值</text><text x="950" y="271" font-size="19" fill="#18334c" font-weight="400">全局 + ROI局部特征 → MLP</text><text x="950" y="300" font-size="19" fill="#18334c" font-weight="400">每轴72旋转bin + 夹爪 / 碰撞</text><path d="M427,250 L477,250" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,250 L925,250" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="385" width="1344" height="220" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="419" font-size="24" fill="#18334c" font-weight="700">02  缩小 FoV 的非线性：z=4 并非覆盖宽度恰好缩小4倍</text><rect x="53" y="445" width="610" height="125" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="477" font-size="23" fill="#2376c5" font-weight="700">教学 α=π/2、d=1m、图宽224像素</text><text x="71" y="510" font-size="19" fill="#18334c" font-weight="400">z=1：W=2m，112像素/米</text><text x="71" y="539" font-size="19" fill="#18334c" font-weight="400">z=4：W≈.397825m，约563.06像素/米</text><rect x="714" y="445" width="621" height="125" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="477" font-size="23" fill="#c36b24" font-weight="700">W(z)=2d tan(α/(2z))</text><text x="732" y="510" font-size="19" fill="#18334c" font-weight="400">图像采样密度约5.03倍，不是新增深度测量</text><text x="732" y="539" font-size="19" fill="#18334c" font-weight="400">空洞与未观测表面不能凭重渲染自动补全</text><rect x="28" y="630" width="1344" height="220" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="664" font-size="24" fill="#18334c" font-weight="700">03  三维网格点投到各图读分数，再选总分峰值</text><rect x="53" y="690" width="610" height="120" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="722" font-size="23" fill="#17816c" font-weight="700">等权重教学算例</text><text x="71" y="755" font-size="19" fill="#18334c" font-weight="400">gA：(.8,.7,.1) → 平均 .5333</text><text x="71" y="784" font-size="19" fill="#18334c" font-weight="400">gB：(.6,.6,.6) → 平均 .6 → 选 gB</text><rect x="714" y="690" width="621" height="120" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="722" font-size="23" fill="#7750ad" font-weight="700">S(g)=Σv wv hv(πv(g))</text><text x="732" y="755" font-size="19" fill="#18334c" font-weight="400">不是三张图各取最大后直接平均位置</text><text x="732" y="784" font-size="19" fill="#18334c" font-weight="400">网格分辨率与越界/遮挡处理影响平移精度</text><rect x="28" y="875" width="1344" height="270" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="909" font-size="24" fill="#18334c" font-weight="700">04  几何打分与动作输出都存在适用边界</text><rect x="53" y="935" width="610" height="167" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="967" font-size="23" fill="#c36b24" font-weight="700">候选相机的评分不能补猜</text><text x="71" y="1000" font-size="19" fill="#18334c" font-weight="400">等半径球面距离方差可为0</text><text x="71" y="1029" font-size="19" fill="#18334c" font-weight="400">对称候选角度和可能相同</text><text x="71" y="1058" font-size="19" fill="#18334c" font-weight="400">射线终点排除与up向量需实现核验</text><text x="71" y="1087" font-size="19" fill="#18334c" font-weight="400">top-K综合分数不保证集合最大角分离</text><rect x="714" y="935" width="621" height="167" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="967" font-size="23" fill="#2376c5" font-weight="700">动作与训练范围</text><text x="732" y="1000" font-size="19" fill="#18334c" font-weight="400">平移3D + 三轴各72bin + 两个二值输出</text><text x="732" y="1029" font-size="19" fill="#18334c" font-weight="400">热图交叉熵；其他损失权重未完整给出</text><text x="732" y="1058" font-size="19" fill="#18334c" font-weight="400">碰撞标志是预测，不是安全证明</text><text x="732" y="1087" font-size="19" fill="#18334c" font-weight="400">未运行仿真、真实机械臂或训练</text><text x="36" y="1177" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>