<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">AD-GBC ｜各向异性分配、非均值聚合与正则梯度</title><desc id="desc">依据主文 §3–4、Fig.2–4与式1–11；特征、像素数量与导数为教学例，非分割/临床测量。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1230" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">AD-GBC ｜各向异性分配、非均值聚合与正则梯度</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3–4、Fig.2–4与式1–11；特征、像素数量与导数为教学例，非分割/临床测量。</text><rect x="28" y="115" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  对应编码/解码路径分别调用同一模块；不把两路像素混成一池</text><rect x="53" y="175" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="207" font-size="23" fill="#2376c5" font-weight="700">B×Cin×H×W → B×N×D，N=HW</text><text x="71" y="240" font-size="19" fill="#18334c" font-weight="400">D=Cin时不额外降维；实验K=32</text><text x="71" y="269" font-size="19" fill="#18334c" font-weight="400">中心K×D、正尺度K×D是训练参数</text><text x="71" y="298" font-size="19" fill="#18334c" font-weight="400">每路输入产生各自A，参数梯度共享</text><rect x="714" y="175" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="207" font-size="23" fill="#7750ad" font-weight="700">特征距离d=Σ((z−c)/σ)²</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">σ=(1,1)：差(1,1)的d=2</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">σ=(2,.5)：相同差的d=4.25</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">轴对齐椭球，不是完整协方差或硬图像圈</text><rect x="28" y="365" width="1344" height="255" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="399" font-size="24" fill="#18334c" font-weight="700">02  教学Z=[0,2]，中心[0,2]，σ=τ=1；先AᵀZ再AC′</text><rect x="52" y="425" width="375" height="172" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="457" font-size="23" fill="#2376c5" font-weight="700">距离与行softmax</text><text x="70" y="490" font-size="19" fill="#18334c" font-weight="400">d=[[0,4],[4,0]]</text><text x="70" y="519" font-size="19" fill="#18334c" font-weight="400">A≈[[.982,.018],</text><text x="70" y="548" font-size="19" fill="#18334c" font-weight="400">       [.018,.982]]</text><text x="70" y="577" font-size="19" fill="#18334c" font-weight="400">每行和1，不是每列必和1</text><rect x="484" y="425" width="390" height="172" fill="#fff" stroke="#c36b24" rx="16"/><text x="502" y="457" font-size="23" fill="#c36b24" font-weight="700">C′=AᵀZ：K×D</text><text x="502" y="490" font-size="19" fill="#18334c" font-weight="400">C′≈[.035972,1.964028]</text><text x="502" y="519" font-size="19" fill="#18334c" font-weight="400">不是把参数中心C替换成C′</text><text x="502" y="548" font-size="19" fill="#18334c" font-weight="400">原式无除Σi Aik</text><text x="502" y="577" font-size="19" fill="#18334c" font-weight="400">这是加权和，不是加权均值</text><rect x="932" y="425" width="405" height="172" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="457" font-size="23" fill="#17816c" font-weight="700">Zhat=AC′：N×D</text><text x="950" y="490" font-size="19" fill="#18334c" font-weight="400">Zhat≈[.070651,1.929349]</text><text x="950" y="519" font-size="19" fill="#18334c" font-weight="400">回投影、残差、3×3Conv/BN/ReLU</text><text x="950" y="548" font-size="19" fill="#18334c" font-weight="400">固定A时AAᵀ秩≤K</text><text x="950" y="577" font-size="19" fill="#18334c" font-weight="400">整体A依赖Z，模块并非线性</text><path d="M427,500 L477,500" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,500 L925,500" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="645" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="679" font-size="24" fill="#18334c" font-weight="700">03  幅值随像素质量变化：3个相同像素与6个像素不同</text><rect x="53" y="705" width="610" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="71" y="737" font-size="23" fill="#c36b24" font-weight="700">每个z=1、分配[.5,.5]</text><text x="71" y="770" font-size="19" fill="#18334c" font-weight="400">N=3 → C′=[1.5,1.5] → 每输出1.5</text><text x="71" y="799" font-size="19" fill="#18334c" font-weight="400">N=6 → C′=[3,3] → 每输出3</text><text x="71" y="828" font-size="19" fill="#18334c" font-weight="400">若改成均值，均输出1，已变更论文算子</text><rect x="714" y="705" width="621" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="732" y="737" font-size="23" fill="#7750ad" font-weight="700">残差保留局部，参数正则防退化</text><text x="732" y="770" font-size="19" fill="#18334c" font-weight="400">中心谱项目标方差1/D，不是1</text><text x="732" y="799" font-size="19" fill="#18334c" font-weight="400">中心化协方差rank≤min(D,K−1)</text><text x="732" y="828" font-size="19" fill="#18334c" font-weight="400">K32时最多31秩，不能凭loss强求全D满秩</text><rect x="28" y="895" width="1344" height="285" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="929" font-size="24" fill="#18334c" font-weight="700">04  尺度loss监督σ²，观测s²停止梯度；其他路径仍可训练</text><rect x="53" y="955" width="610" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="71" y="987" font-size="23" fill="#17816c" font-weight="700">s²=ΣA(z−c)²/(ΣA+ε)</text><text x="71" y="1020" font-size="19" fill="#18334c" font-weight="400">此处有质量归一化，和C′公式不同</text><text x="71" y="1049" font-size="19" fill="#18334c" font-weight="400">目标detach，避免经A反向移动目标</text><text x="71" y="1078" font-size="19" fill="#18334c" font-weight="400">∂L/∂σ=4σ(σ²−s²)/K</text><text x="71" y="1107" font-size="19" fill="#18334c" font-weight="400">s²=4、σ=1 → −12/K，下降增大尺度</text><rect x="714" y="955" width="621" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="732" y="987" font-size="23" fill="#2376c5" font-weight="700">总loss=BCE+Dice+λWdiv+βscale</text><text x="732" y="1020" font-size="19" fill="#18334c" font-weight="400">主干1e−4，粒球参数1e−2</text><text x="732" y="1049" font-size="19" fill="#18334c" font-weight="400">推理保留模块前向，不计算几何训练loss</text><text x="732" y="1078" font-size="19" fill="#18334c" font-weight="400">空间主成本O(N(CinD+KD+Cin²))</text><text x="732" y="1107" font-size="19" fill="#18334c" font-weight="400">未训练/推理医学模型或处理患者数据</text><text x="36" y="1207" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>