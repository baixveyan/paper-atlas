<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1270" viewBox="0 0 1400 1270" role="img" aria-labelledby="title desc"><title id="title">ActiveAD ｜从分层配额到规划导向的增量精标</title><desc id="desc">依据主文 §3–5、式1–6及补充D–E；几何、熵和排名为教学算例，非驾驶实验。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1270" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">ActiveAD ｜从分层配额到规划导向的增量精标</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据主文 §3–5、式1–6及补充D–E；几何、熵和排名为教学算例，非驾驶实验。</text><rect x="28" y="115" width="1344" height="235" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  标注单位是clip：便宜日志先可用，昂贵3D标签只在选中后解锁</text><rect x="52" y="176" width="375" height="145" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="208" font-size="23" fill="#2376c5" font-weight="700">天气 / 昼夜 → 指令分组</text><text x="70" y="241" font-size="19" fill="#18334c" font-weight="400">四天气组；组内四驾驶类别</text><text x="70" y="270" font-size="19" fill="#18334c" font-weight="400">每个最终子组按平均速度排序</text><text x="70" y="299" font-size="19" fill="#18334c" font-weight="400">等间隔抽样覆盖慢到快</text><rect x="484" y="176" width="390" height="145" fill="#fff" stroke="#7750ad" rx="16"/><text x="502" y="208" font-size="23" fill="#7750ad" font-weight="700">平方根配额教学例</text><text x="502" y="241" font-size="19" fill="#18334c" font-weight="400">组大小81与9，γ=.5</text><text x="502" y="270" font-size="19" fill="#18334c" font-weight="400">权重9:3；预算12 → 配额9:3</text><text x="502" y="299" font-size="19" fill="#18334c" font-weight="400">小组库占10%，预算占25%</text><rect x="932" y="176" width="405" height="145" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="208" font-size="23" fill="#17816c" font-weight="700">概率 × 总预算 → 整数ID</text><text x="950" y="241" font-size="19" fill="#18334c" font-weight="400">第二层还需乘第一层比例</text><text x="950" y="270" font-size="19" fill="#18334c" font-weight="400">γ=1按数量；γ=0非空组等额</text><text x="950" y="299" font-size="19" fill="#18334c" font-weight="400">空组/取整/回填不能补猜</text><path d="M427,248 L477,248" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><path d="M874,248 L925,248" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="28" y="375" width="1344" height="290" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="409" font-size="24" fill="#18334c" font-weight="700">02  三分数看不同问题：轨迹偏差、预测接近度、近车多模式熵</text><rect x="52" y="435" width="375" height="177" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="467" font-size="23" fill="#2376c5" font-weight="700">DE：每个点先算L2</text><text x="70" y="500" font-size="19" fill="#18334c" font-weight="400">二维偏差(3,4) → 距离5</text><text x="70" y="529" font-size="19" fill="#18334c" font-weight="400">三点[0,5,0] → DE=5/3</text><text x="70" y="558" font-size="19" fill="#18334c" font-weight="400">使用自车日志，无需邻车真值</text><text x="70" y="587" font-size="19" fill="#18334c" font-weight="400">clip帧与未来6点不是同一轴</text><rect x="484" y="435" width="390" height="177" fill="#fff" stroke="#c36b24" rx="16"/><text x="502" y="467" font-size="23" fill="#c36b24" font-weight="700">SC：按文字意图解释</text><text x="502" y="500" font-size="19" fill="#18334c" font-weight="400">最近距离[.5,2,4]米</text><text x="502" y="529" font-size="19" fill="#18334c" font-weight="400">Σexp(−d) ≈ .76018</text><text x="502" y="558" font-size="19" fill="#18334c" font-weight="400">更接近 → 更大；不是碰撞概率</text><text x="502" y="587" font-size="19" fill="#18334c" font-weight="400">印刷式4漏范数，代码未公开</text><rect x="932" y="435" width="405" height="177" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="467" font-size="23" fill="#17816c" font-weight="700">AU：先过滤，再加权熵</text><text x="950" y="500" font-size="19" fill="#18334c" font-weight="400">A距1m，p=[.5,.5] → 5.1217</text><text x="950" y="529" font-size="19" fill="#18334c" font-weight="400">B距2m，p=[.9,.1] → .8837</text><text x="950" y="558" font-size="19" fill="#18334c" font-weight="400">总约6.0054；4m对象排除</text><text x="950" y="587" font-size="19" fill="#18334c" font-weight="400">δ=3m；d的具体时刻待核验</text><text x="63" y="643" font-size="20" fill="#18334c" font-weight="700">规划接口：6×2未来点；邻车逻辑接口：A×M×6×2轨迹与A×M概率，非作者内存布局承诺。</text><rect x="28" y="690" width="1344" height="235" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="724" font-size="24" fill="#18334c" font-weight="700">03  每列归一化后再相加：教学min-max不是已核实作者实现</text><rect x="56" y="751" width="411" height="134" fill="#fff" stroke="#2376c5" rx="16"/><text x="74" y="783" font-size="23" fill="#2376c5" font-weight="700">A：标准化(DE,SC,AU)</text><text x="74" y="816" font-size="19" fill="#18334c" font-weight="400">(1,0,0)</text><text x="74" y="845" font-size="19" fill="#18334c" font-weight="400">三项和 1.0000</text><rect x="486" y="751" width="411" height="134" fill="#fff" stroke="#17816c" rx="16"/><text x="504" y="783" font-size="23" fill="#17816c" font-weight="700">B：标准化(DE,SC,AU)</text><text x="504" y="816" font-size="19" fill="#18334c" font-weight="400">(.5,1,1/3)</text><text x="504" y="845" font-size="19" fill="#18334c" font-weight="400">三项和 1.8333 → 选中</text><rect x="916" y="751" width="411" height="134" fill="#fff" stroke="#7750ad" rx="16"/><text x="934" y="783" font-size="23" fill="#7750ad" font-weight="700">C：标准化(DE,SC,AU)</text><text x="934" y="816" font-size="19" fill="#18334c" font-weight="400">(0,1/3,1)</text><text x="934" y="845" font-size="19" fill="#18334c" font-weight="400">三项和 1.3333</text><rect x="28" y="950" width="1344" height="275" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="984" font-size="24" fill="#18334c" font-weight="700">04  总池700的时间轴：10% → 20% → 30%，最后还要训练</text><rect x="52" y="1011" width="405" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="70" y="1043" font-size="23" fill="#2376c5" font-weight="700">70已标注</text><text x="70" y="1076" font-size="19" fill="#18334c" font-weight="400">训练70 → 推理余630</text><text x="70" y="1105" font-size="19" fill="#18334c" font-weight="400">再选70精标</text><path d="M457,1073 L485,1073" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="492" y="1011" width="405" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="510" y="1043" font-size="23" fill="#c36b24" font-weight="700">140已标注</text><text x="510" y="1076" font-size="19" fill="#18334c" font-weight="400">从头重训140 → 推理余560</text><text x="510" y="1105" font-size="19" fill="#18334c" font-weight="400">再选70精标</text><path d="M897,1073 L925,1073" fill="none" stroke="#2376c5" stroke-width="3" marker-end="url(#2376c5)" /><rect x="932" y="1011" width="405" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="950" y="1043" font-size="23" fill="#17816c" font-weight="700">210已标注</text><text x="950" y="1076" font-size="19" fill="#18334c" font-weight="400">最终再训练210，才是30%模型</text><text x="950" y="1105" font-size="19" fill="#18334c" font-weight="400">输出ID不等于已训练最终模型</text><text x="64" y="1195" font-size="20" fill="#18334c" font-weight="700">SC/AU依赖当前模型，漏检对象也可能被漏选；本图算术为教学例，未运行驾驶模型。</text><text x="36" y="1247" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>