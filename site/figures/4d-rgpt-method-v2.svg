<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc"><title id="title">4D-RGPT ｜时间尺度、latent/显式蒸馏与冻结梯度</title><desc id="desc">依据PDF3–5 §3–4与PDF8 Table7；时间/尺寸/解码数字为教学例，非感知实测。</desc><defs><marker id="2376c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2376c5"/></marker><marker id="17816c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#17816c"/></marker><marker id="c36b24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#c36b24"/></marker><marker id="7750ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#7750ad"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1400" height="1235" fill="#fff" stroke="#fff" rx="0"/><text x="36" y="50" font-size="32" fill="#18334c" font-weight="700">4D-RGPT ｜时间尺度、latent/显式蒸馏与冻结梯度</text><text x="36" y="87" font-size="19" fill="#586d80" font-weight="400">依据PDF3–5 §3–4与PDF8 Table7；时间/尺寸/解码数字为教学例，非感知实测。</text><rect x="28" y="115" width="1344" height="275" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="149" font-size="24" fill="#18334c" font-weight="700">01  同3帧索引[0,1,2]，真实时间不同；教学位移6m不决定同一速度</text><path d="M90 213 L550 213" stroke="#2376c5" stroke-width="3"/><circle cx="100" cy="213" r="7" fill="#2376c5"/><text x="85" y="248" font-size="19" fill="#2376c5" font-weight="400">0s</text><circle cx="260" cy="213" r="7" fill="#2376c5"/><text x="245" y="248" font-size="19" fill="#2376c5" font-weight="400">.5s</text><circle cx="420" cy="213" r="7" fill="#2376c5"/><text x="405" y="248" font-size="19" fill="#2376c5" font-weight="400">1s → 6m/s</text><path d="M90 313 L550 313" stroke="#7750ad" stroke-width="3"/><circle cx="100" cy="313" r="7" fill="#7750ad"/><text x="85" y="348" font-size="19" fill="#7750ad" font-weight="400">0s</text><circle cx="260" cy="313" r="7" fill="#7750ad"/><text x="245" y="348" font-size="19" fill="#7750ad" font-weight="400">2s</text><circle cx="420" cy="313" r="7" fill="#7750ad"/><text x="405" y="348" font-size="19" fill="#7750ad" font-weight="400">4s → 1.5m/s</text><rect x="714" y="175" width="621" height="176" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="207" font-size="23" fill="#17816c" font-weight="700">TPE加到视觉feature，位于projector前</text><text x="732" y="240" font-size="19" fill="#18334c" font-weight="400">同帧token共享时间向量，不增加token条数</text><text x="732" y="269" font-size="19" fill="#18334c" font-weight="400">教学D4/T100/t1：[sin1,cos1,sin.1,cos.1]</text><text x="732" y="298" font-size="19" fill="#18334c" font-weight="400">与LLM hidden宽c、teacher宽c′分开</text><text x="732" y="327" font-size="19" fill="#18334c" font-weight="400">实际时间单位/起点/T配置主文未给全</text><rect x="28" y="415" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="449" font-size="24" fill="#18334c" font-weight="700">02  student hidden → 时间/空间Rearrange → 可训MLP → teacher同形latent</text><rect x="53" y="475" width="610" height="133" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="507" font-size="23" fill="#2376c5" font-weight="700">Fteacher：N′×h′×w′×c′</text><text x="71" y="540" font-size="19" fill="#18334c" font-weight="400">Fhidden：N×h×w×c，不能只改reshape</text><text x="71" y="569" font-size="19" fill="#18334c" font-weight="400">LD在latent比差；ED在解码模态比差</text><text x="71" y="598" font-size="19" fill="#18334c" font-weight="400">teacher不是精确真值，仍有伪监督偏差</text><rect x="714" y="475" width="621" height="133" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="507" font-size="23" fill="#c36b24" font-weight="700">固定同一套D_m读两边latent</text><text x="732" y="540" font-size="19" fill="#18334c" font-weight="400">depth1 / flow2 / motion1 / camray6</text><text x="732" y="569" font-size="19" fill="#18334c" font-weight="400">光流不等于3D物体运动；射线非6DoF姿态</text><text x="732" y="598" font-size="19" fill="#18334c" font-weight="400">Δ函数/权重/valid mask主文未给完整</text><rect x="28" y="665" width="1344" height="225" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="699" font-size="24" fill="#18334c" font-weight="700">03  参数冻结与输入梯度：固定解码head仍须让ED梯度传回student</text><rect x="53" y="725" width="610" height="133" fill="#fff" stroke="#7750ad" rx="16"/><text x="71" y="757" font-size="23" fill="#7750ad" font-weight="700">默认冻结视觉E_V，训练projector+LLM</text><text x="71" y="790" font-size="19" fill="#18334c" font-weight="400">读出D_4DP训练；L4P teacher/模态head固定</text><text x="71" y="819" font-size="19" fill="#18334c" font-weight="400">teacher仅产目标，不接student梯度</text><text x="71" y="848" font-size="19" fill="#18334c" font-weight="400">student head不能整段no_grad切断输入</text><rect x="714" y="725" width="621" height="133" fill="#fff" stroke="#17816c" rx="16"/><text x="732" y="757" font-size="23" fill="#17816c" font-weight="700">教学D(z)=2z，teacher1/student.8</text><text x="732" y="790" font-size="19" fill="#18334c" font-weight="400">latent差.2，输出差.4，导数乘2传回</text><text x="732" y="819" font-size="19" fill="#18334c" font-weight="400">仅链式法则示例，不是作者decoder/loss</text><text x="732" y="848" font-size="19" fill="#18334c" font-weight="400">SFT答案CE与LD/ED共同优化可训路径</text><rect x="28" y="915" width="1344" height="275" fill="#f6f9fc" stroke="#d9e3ec" rx="16"/><text x="50" y="949" font-size="24" fill="#18334c" font-weight="700">04  推理只视频+时间戳+首帧region+问题 → VLM答案；训练分支全部移除</text><rect x="53" y="975" width="610" height="176" fill="#fff" stroke="#2376c5" rx="16"/><text x="71" y="1007" font-size="23" fill="#2376c5" font-weight="700">不运行teacher / 4D读出MLP / 模态head</text><text x="71" y="1040" font-size="19" fill="#18334c" font-weight="400">region只锁定首帧身份，非给完整GT轨迹</text><text x="71" y="1069" font-size="19" fill="#18334c" font-weight="400">自动检测/分割属于基准整理，不自动在线跑</text><text x="71" y="1098" font-size="19" fill="#18334c" font-weight="400">TPE提供时间，未硬编码物理求解</text><text x="71" y="1127" font-size="19" fill="#18334c" font-weight="400">问答提升不等于任意速度/深度可靠测量</text><rect x="714" y="975" width="621" height="176" fill="#fff" stroke="#c36b24" rx="16"/><text x="732" y="1007" font-size="23" fill="#c36b24" font-weight="700">16×224²×10通道float32≈30.625MiB</text><text x="732" y="1040" font-size="19" fill="#18334c" font-weight="400">单套显式图；teacher/student/latent另计</text><text x="732" y="1069" font-size="19" fill="#18334c" font-weight="400">训练成本保留，部署无需额外感知模型</text><text x="732" y="1098" font-size="19" fill="#18334c" font-weight="400">仅验算时间/编码/梯度示例/内存</text><text x="732" y="1127" font-size="19" fill="#18334c" font-weight="400">未运行或训练L4P/NVILA</text><text x="36" y="1212" font-size="17" fill="#586d80" font-weight="400">原创阅读示意 · 非实验测量 / 非逐算子实现 · 配套正文解释所有假设与缺失细节</text></g></svg>